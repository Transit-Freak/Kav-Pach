<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4EFE4">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>מדד אמינות הרכבת — כיוון 2: עיתון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="../base.css">
<style>
  /* כיוון 2 — עיתון מודפס: נייר, סריף (פרנק-ריהל), דיו שחור ואדום לאיחורים, קווים כפולים */
  :root{
    --bg:#F4EFE4; --panel:#FBF8F1; --panel2:#EFE9DB; --line:#DCD4C2; --line2:#C2B89F;
    --ink:#1A1713; --mut:#5C554A; --dim:#8A8272; --accent:#B3261E; --accent2:#8E1B15;
    --ok:#2E7D4F; --warn:#B8860B; --late:#C9551A; --bad:#B3261E; --none:#B8AE99;
    --mono:'Frank Ruhl Libre',serif; --disp:'Frank Ruhl Libre',serif; --disp-w:700; --body:'Frank Ruhl Libre',serif;
    --radius:2px; --radius-sm:2px; --tag-ink:#fff; --scheme:light; --tip-bg:#1A1713; --tip-ink:#F4EFE4; --ovl:rgba(40,32,24,.6);
  }
  body{font-size:15px}
  .mast{text-align:center;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:14px 0 12px;margin-bottom:6px}
  .mast h1{font-size:46px;font-weight:900;line-height:1.05}
  .mast .kicker{font-size:12px;color:var(--mut);letter-spacing:2px;font-weight:500;margin-top:6px}
  .topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--ink)}
  .topline a{color:var(--ink);text-decoration:none;font-weight:700}
  .head{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:end;padding:18px 0 14px;border-bottom:1px solid var(--ink)}
  .big{font-family:var(--disp);font-size:132px;line-height:.85;font-weight:900;letter-spacing:-2px;color:var(--ink)}
  .deck b{display:block;font-size:30px;font-weight:700;line-height:1.15;margin-bottom:6px}
  .deck span{color:var(--mut);font-size:13.5px}
  .strip{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);padding:0;margin:0 0 18px;border-bottom:1px solid var(--line2)}
  .strip li{padding:12px 14px;border-inline-start:1px solid var(--line2)}
  .strip li:first-child{border-inline-start:none}
  .strip b{font-size:30px;display:block;font-weight:700;line-height:1.1}
  .strip b i{font-style:normal;font-size:13px;color:var(--mut);margin-inline-start:4px}
  .strip span{font-size:12.5px;color:var(--ink);font-weight:700}
  .strip small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .panel{box-shadow:none}
  .ptitle::before{display:none}
  .ptitle{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:10px}
  .pchip.on{background:var(--ink);color:var(--bg)}
  .daynav input{color:var(--ink)}
  .mono{font-size:15px}
  .mono.t{color:var(--ink)}
  .tag{border-radius:0}
  @media(max-width:760px){
    .head{grid-template-columns:1fr}
    .big{font-size:96px}
    .strip{grid-template-columns:1fr 1fr}
    .strip li:nth-child(3){border-inline-start:none}
    .mast h1{font-size:34px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1>מדד אמינות הרכבת</h1><div class="kicker">כל רכבת שבלו״ז מול המיקום ששידרה · מנתוני דאטאבוס · <span class="tag">ניסוי</span></div></div>
  <div class="topline"><span>הקו הבוחן · כלי מספר אחד-עשר</span><a href="../../">← לדף הבית</a></div>
  <div class="trynav">כיוונים: <a href="1.html">1 לוח</a><a class="on" href="2.html">2 עיתון</a><a href="3.html">3 כרטיס</a><a href="4.html">4 מפת קווים</a><a href="5.html">5 שילוט</a></div>
  <p class="sub" id="sub">טוען נתונים…</p>
  <div class="periods" id="periods"></div>
  <div id="app"><div class="msg">טוען…</div></div>
  <div class="panel method" id="method"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>window.RAIL_THEME = {hero: 'headline', tiles: 'light', data: '../data/', c: {ok: '#2E7D4F', warn: '#B8860B', late: '#C9551A', bad: '#B3261E', grid: '#DCD4C2', axis: '#8A8272', bg: '#FBF8F1', line: '#1A1713', accent: '#B3261E', none: '#B8AE99', seg: '#1A1713', dash: '#8A8272'}};</script>
<script src="../app.js"></script>
</body>
</html>
