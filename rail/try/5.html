<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E6E8EB">
<meta name="robots" content="noindex, nofollow">

<title>מדד אמינות הרכבת — כיוון 5: שילוט תחנה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Anton&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="../base.css">
<style>
  /* כיוון 5 — שילוט תחנה: בטון אפור, שלט שחור עם פס צהוב, ספרות גבוהות וצרות */
  :root{
    --bg:#E6E8EB; --panel:#F7F8FA; --panel2:#EDEFF2; --line:#D3D7DD; --line2:#B6BCC6;
    --ink:#111214; --mut:#4C525B; --dim:#7D848E; --accent:#FFC800; --accent2:#7A5F00;
    --ok:#1B9E4B; --warn:#E39B00; --late:#E0621A; --bad:#C81E1E; --none:#B6BCC6;
    --mono:'Anton','Heebo',sans-serif; --disp:'Heebo',sans-serif; --disp-w:900; --body:'Heebo',sans-serif;
    --radius:6px; --radius-sm:4px; --tag-ink:#111; --scheme:light; --tip-bg:#111214; --tip-ink:#fff; --ovl:rgba(17,18,20,.6);
  }
  .bar-top{background:#111214;color:#fff;padding:12px 16px;border-radius:6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:6px solid var(--accent)}
  .bar-top h1{color:#fff;font-size:26px;letter-spacing:-.2px}
  .bar-top .homelink{color:#fff;border-color:#444}
  .glyph{width:42px;height:42px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:4px}
  .sign{margin:0 0 18px;background:#111214;color:#fff;border-radius:8px;overflow:hidden}
  .sign-main{padding:18px 22px 14px;display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;border-bottom:1px solid #2A2C30}
  .sign-main b{font-family:'Anton',var(--body);font-size:104px;line-height:1;color:var(--accent);letter-spacing:1px}
  .sl{font-size:15px;font-weight:800;color:#fff}
  .sc{font-size:12px;color:#A6ACB6;flex-basis:100%}
  .sign-row{display:grid;grid-template-columns:repeat(4,1fr)}
  .sg{padding:14px 18px;border-inline-start:1px solid #2A2C30;display:flex;flex-direction:column;gap:4px;min-width:0}
  .sg:first-child{border:none}
  .sg .sl{font-size:12px;color:#C9CED6}
  .sg b{font-family:'Anton',var(--body);font-size:40px;line-height:1;color:#fff;letter-spacing:.5px}
  .sg b i{font-style:normal;font-family:var(--body);font-size:12px;color:#A6ACB6;margin-inline-start:5px;font-weight:700}
  .sg .sc{font-size:11.5px;flex-basis:auto}
  .seg,.daynav{border-color:#111214}
  .pchip.on{background:#111214;color:var(--accent)}
  .daynav input{color:#111214;font-family:var(--body);font-weight:800}
  .panel{border:none;border-inline-start:6px solid #111214}
  .ptitle::before{background:var(--accent);border:2px solid #111214;width:8px;height:14px;box-sizing:content-box}
  .st{border-radius:2px}
  .mono{font-family:'Anton',var(--body);font-size:16px;letter-spacing:.6px;font-weight:400}
  .mono.t{color:#111214}
  .mono.d0,.mono.d1,.mono.d2,.mono.d3{font-size:15px}
  .modal{border:none;border-top:8px solid var(--accent)}
  .rs .rt,.rs .ra,.rs .rd{font-family:'Anton',var(--body);letter-spacing:.6px;font-size:15px}
  @media(max-width:760px){
    .sign-row{grid-template-columns:1fr 1fr}
    .sg:nth-child(3){border:none}
    .sign-main b{font-size:80px}
    .bar-top h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar-top">
    <div class="glyph" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 64 64"><rect x="14" y="8" width="36" height="40" rx="6" fill="#111214"/><rect x="20" y="15" width="24" height="13" rx="2" fill="#FFC800"/><circle cx="24" cy="38" r="3.5" fill="#FFC800"/><circle cx="40" cy="38" r="3.5" fill="#FFC800"/><path d="M22 48l-6 9M42 48l6 9" stroke="#111214" stroke-width="4" stroke-linecap="round"/></svg></div>

  <p class="sub" id="sub">טוען נתונים…</p>

</div>

</html>
