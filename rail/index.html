<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C131D">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>מדד אמינות הרכבת — הקו הבוחן</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%230C131D"/><rect x="14" y="10" width="36" height="38" rx="8" fill="%23F6B93B"/><rect x="20" y="17" width="24" height="12" rx="3" fill="%230C131D"/><circle cx="24" cy="38" r="3.5" fill="%230C131D"/><circle cx="40" cy="38" r="3.5" fill="%230C131D"/><path d="M22 48l-6 8M42 48l6 8" stroke="%23F6B93B" stroke-width="4" stroke-linecap="round"/></svg>'>
<meta property="og:title" content="מדד אמינות הרכבת — הקו הבוחן">
<meta property="og:description" content="כל רכבת בלו״ז מול המיקום ששידרה בפועל: איחורים לפי קו, תחנה ושעה, יום אחרי יום">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="base.css">
<style>
  /* כיוון 1 — לוח יציאות של תחנת רכבת: רקע כהה, ספרות "לד" בענבר, קווי הפרדה דקים */
  :root{
    --bg:#0C131D; --panel:#121B28; --panel2:#182436; --line:#24324A; --line2:#2E3F5A;
    --ink:#EAF0F7; --mut:#9AAAC0; --dim:#6B7D96; --accent:#F6B93B; --accent2:#FFD37A;
    --ok:#3DD68C; --warn:#F6B93B; --late:#FB8A4B; --bad:#F26D6D; --none:#3B4B63;
    --mono:'Share Tech Mono','Courier New',monospace; --disp:'Secular One','Heebo',sans-serif; --body:'Heebo',system-ui,sans-serif;
    --radius:12px; --radius-sm:8px; --tip-bg:#0A1119; --tip-ink:#EAF0F7; --scheme:dark;
  }
  .glyph{width:46px;height:46px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rule{height:3px;margin:14px 0 12px;background:linear-gradient(90deg,var(--accent) 0,var(--accent) 38%,var(--line) 38%,var(--line) 100%);border-radius:2px}
  .board{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .cell{background:var(--panel);padding:16px 18px;position:relative;min-width:0}
  .cell.hero{background:linear-gradient(180deg,#151F2E,#0F1826);background-image:repeating-linear-gradient(180deg,transparent 0 21px,rgba(255,255,255,.028) 21px 22px)}
  .cell .lbl{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.3px;margin-bottom:6px;display:block}
  .cell .num{font-family:var(--mono);font-size:34px;line-height:1;color:var(--ink);letter-spacing:.5px;display:block;font-variant-numeric:tabular-nums}
  .cell .num i{font-style:normal;font-family:var(--body);font-size:13px;color:var(--mut);margin-inline-start:4px;font-weight:700}
  .cell.hero .num{font-size:78px;color:var(--accent);text-shadow:0 0 18px rgba(246,185,59,.35)}
  .cell.hero .lbl{font-size:14px;color:var(--accent2)}
  .cell .cap{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:8px;line-height:1.5}
  .cell.hero .cap{color:var(--mut);font-size:12.5px}
  @media(max-width:760px){
    .board{grid-template-columns:1fr 1fr}
    .cell.hero{grid-column:1/-1}
    .cell.hero .num{font-size:64px}
    .cell .num{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="glyph" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 64 64"><rect x="14" y="8" width="36" height="40" rx="8" fill="#0C131D"/><rect x="20" y="15" width="24" height="13" rx="3" fill="#F6B93B"/><circle cx="24" cy="38" r="3.5" fill="#F6B93B"/><circle cx="40" cy="38" r="3.5" fill="#F6B93B"/><path d="M22 48l-6 9M42 48l6 9" stroke="#0C131D" stroke-width="4" stroke-linecap="round"/></svg></div>
    <h1>מדד אמינות הרכבת</h1>
    <span class="tag">ניסוי</span>
    <a class="homelink" href="../">← הקו הבוחן</a>
  </div>
  <div class="rule"></div>
  <p class="sub" id="sub">טוען נתונים…</p>
  <div class="periods" id="periods"></div>
  <div id="app"><div class="msg">טוען…</div></div>
  <div class="panel method" id="method"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>window.RAIL_THEME = {hero: 'board', tiles: 'dark', data: 'data/'};</script>
<script src="app.js"></script>
</body>
</html>
