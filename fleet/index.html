<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- כמו בשאר הכלים: הדפדפן מאמת מול השרת בכל כניסה — עדכוני תכונה נראים מיד -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>צי הרכבים — הקו הבוחן</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="14" rx="4" fill="%2310172A"/><rect x="6" y="11" width="5" height="4" rx="1" fill="%23ffffff"/><rect x="13" y="11" width="5" height="4" rx="1" fill="%23ffffff"/><rect x="20" y="11" width="5" height="4" rx="1" fill="%23ffffff"/><circle cx="9" cy="24" r="3" fill="%2310172A"/><circle cx="23" cy="24" r="3" fill="%2310172A"/></svg>'>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --ink:#10172A; --mut:#6B7488; --dim:#8B93A7;
    --line:#E6EAF0; --chipbg:#EEF1F6; --row:#F6F8FB;
    --ok:#166534; --ok-bg:#DCFCE7; --bad:#991B1B; --bad-bg:#FEE2E2;
    --shadow:0 1px 3px rgba(16,23,42,.08); --shadow-lg:0 14px 40px rgba(16,23,42,.18);
  }
  *{box-sizing:border-box}
  html{direction:rtl}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  h1{font-size:21px;font-weight:800;margin:0}
  .tag{font-size:10.5px;font-weight:700;background:#FEF3C7;color:#92400E;border-radius:999px;padding:3px 10px}
  .homelink{margin-inline-start:auto;font-size:13px;font-weight:700;color:#1D4ED8;text-decoration:none}
  .searchrow{display:flex;gap:8px;flex:1;min-width:280px;align-items:center}
  #q{flex:1;height:46px;border:none;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:0 16px;font:600 14px 'Rubik',sans-serif;color:var(--ink);outline:none}
  #q:focus{box-shadow:0 0 0 2px #10172A, var(--shadow)}
  .modes{display:flex;gap:5px}
  .mode{border:none;cursor:pointer;background:var(--surface);color:var(--mut);border-radius:999px;padding:11px 15px;font:700 12.5px 'Rubik',sans-serif;box-shadow:var(--shadow)}
  .mode.on{background:var(--ink);color:#fff}
  .sub{font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.6;margin:8px 0 14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--mut);font-weight:700}
  .kpi.bad b{color:var(--bad)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{border:none;text-align:inherit;font-family:inherit;cursor:pointer;color:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .12s}
  .card:hover{transform:translateY(-2px)}
  .card h2{margin:0;font-size:17px;font-weight:800}
  .card .n{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .card .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;font-weight:700}
  .card .pills span{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 9px}
  .card .pills .r{background:rgba(0,0,0,.25)}
  .panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
  .ptitle{font-weight:800;font-size:14px;margin:0 0 10px}
  .ophead{color:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ophead h2{margin:0;font-size:20px;font-weight:800}
  .ophead .sub2{font-size:12px;opacity:.85;font-weight:500}
  .ophead .pills{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;font-weight:700}
  .ophead .pills span{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px}
  .ophead .pills .r{background:rgba(0,0,0,.25)}
  .back{border:none;background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 15px;font:700 13px 'Rubik',sans-serif;cursor:pointer;box-shadow:var(--shadow);margin-bottom:12px}
  .types{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .type{background:var(--row);border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:inherit;font-family:inherit}
  .type.on{border-color:var(--ink)}
  .type b{display:block;font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .type span{font-size:11px;color:var(--mut);font-weight:700}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.cols2{grid-template-columns:1fr}}
  .yrow{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:4px}
  .ybar{height:12px;border-radius:4px;background:var(--chipbg);overflow:hidden}
  .ybar i{display:block;height:100%;border-radius:4px}
  .ybar .tot{display:block;height:100%;border-radius:4px;background:#D7DDE6}
  .ybar .tot i{border-radius:4px}
  .yrow .c{text-align:left;color:var(--mut);font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:12.5px}
  th{text-align:right;font-size:11px;color:var(--dim);font-weight:700;padding:2px 10px;white-space:nowrap;cursor:pointer;user-select:none}
  td{background:var(--row);padding:9px 10px;font-weight:600;white-space:nowrap}
  tr.v{cursor:pointer}
  tr.v:hover td{background:#EDF2F8}
  tr.off td{background:#FDF2F2;color:var(--bad)}
  td:first-child{border-radius:0 10px 10px 0}
  td:last-child{border-radius:10px 0 0 10px}
  .tg{border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:700;background:#E8F0FB;color:#1D4ED8}
  .st{border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:700}
  .st.on{background:var(--ok-bg);color:var(--ok)}.st.off{background:var(--bad-bg);color:var(--bad)}
  .st.mv{background:#FEF3C7;color:#92400E}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fchip{border:none;cursor:pointer;background:var(--chipbg);color:var(--mut);border-radius:999px;padding:6px 13px;font:700 11.5px 'Rubik',sans-serif}
  .fchip.on{background:var(--ink);color:#fff}
  .tblbox{overflow-x:auto}
  .more{width:100%;border:none;background:var(--chipbg);color:var(--ink);border-radius:12px;padding:10px;font:700 13px 'Rubik',sans-serif;cursor:pointer;margin-top:6px}
  .ovl{position:fixed;inset:0;background:rgba(16,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
  .modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);max-width:500px;width:100%;max-height:86vh;overflow-y:auto;padding:18px 20px}
  .mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .plate{direction:ltr;background:#F4F5F6;border:2px solid #B3B9C6;border-radius:8px;padding:3px 12px;font-weight:800;font-size:17px;color:var(--ink)}
  .x{margin-inline-start:auto;border:none;background:var(--chipbg);border-radius:10px;width:34px;height:34px;font-size:15px;font-weight:800;cursor:pointer;color:var(--mut)}
  .msec{font-size:11px;font-weight:800;color:#1D4ED8;margin:12px 0 6px}
  .mgrid{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
  .mgrid div{padding:7px 12px;border-bottom:1px solid var(--row);min-width:0;overflow-wrap:anywhere}
  .mgrid .k{background:#F8FAFC;font-weight:800;color:var(--mut);white-space:nowrap}
  .mgrid .v2{font-weight:600}
  .note{font-size:11px;color:var(--dim);font-weight:600;line-height:1.6;margin-top:10px}
  .empty{padding:40px;text-align:center;color:var(--dim);font-weight:700}
  .msg{padding:60px 20px;text-align:center;color:var(--mut);font-weight:800;font-size:16px}
  button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid #10172A;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="11" rx="2.5"></rect><path d="M3 11h18"></path><circle cx="8" cy="18.5" r="1.6"></circle><circle cx="16" cy="18.5" r="1.6"></circle></svg></div>
    <h1>צי הרכבים</h1>
    <span class="tag">ניסוי</span>
    <div class="searchrow">
      <input id="q" type="search" placeholder="חיפוש חברה…">
      <div class="modes">
        <button class="mode on" data-m="op">חברה</button>
        <button class="mode" data-m="city">עיר</button>
        <button class="mode" data-m="plate">מספר רכב</button>
      </div>
    </div>
    <a class="homelink" href="../" target="_blank" rel="noopener">→ הקו הבוחן</a>
  </div>
  <div class="sub">כל האוטובוסים שנצפו בשידורי האיכון של משרד התחבורה — לאיזו חברה כל רכב שייך, מאיזו שנה, מתי נצפה לראשונה ולאחרונה, ואילו ירדו מהשירות. לחיצה על רכב פותחת את כל פרטיו מהמאגר הממשלתי. מקורות: דאטאבוס (הסדנא לידע ציבורי) + מאגר הרישוי הממשלתי.</div>
  <div id="view"><div class="msg">⏳ טוען נתונים…</div></div>
</div>

<script>
const COLORS={3:'#1B7A3D',4:'#0F766E',5:'#1E5BC6',6:'#334155',14:'#0E7490',15:'#E87511',16:'#B45309',18:'#7C3AED',21:'#BE185D',25:'#C2410C',30:'#1E5BC6',31:'#1E5BC6',32:'#1E5BC6',33:'#4D7C0F',34:'#A16207',35:'#9333EA',37:'#0369A1',38:'#0369A1'};
const PALETTE=['#475569','#B91C1C','#15803D','#6D28D9','#0E7490','#A16207','#BE185D','#374151'];
const $=s=>document.querySelector(s);
let DATA=null, MODE='op', Q='', VIEW={t:'home'}, TYPEF=null, KABF=null, STATF=null, YEARF=null, SORTK=null, SORTD=-1, LIMIT=200, OFF=0, CITIES=null, CITYSEL=null;
// מאגר הרישוי מאיית "צבורי" בלי י' ומקצר "זעצ"/"בע קומתים"/"עיר מפרק" —
// מיישרים לעברית תקנית בתצוגה. התיקון יושב על gT ולכן הפילוח, המסננים
// והטבלה מדברים כולם באותן תוויות.
const fixT=t=>t&&t.replace(/\s+/g,' ').trim().replace('צבורי','ציבורי')
  .replace('זעצ','זעיר ציבורי').replace('בע קומתים','בעל קומותיים').replace('עיר מפרק','עירוני מפרקי');
const gY=v=>v[3+OFF],gM=v=>v[4+OFF],gD=v=>v[5+OFF],gT=v=>fixT(v[6+OFF]),gR=v=>OFF?v[3]:null;
const fmt=n=>n.toLocaleString('he-IL');
const fd=s=>s?s.split('-').reverse().join('.'):'—';
const days=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const isActive=v=>days(DATA.updated,v[2])<=DATA.retire_days;
const opColor=(ref,i)=>COLORS[ref]||PALETTE[i%PALETTE.length];
// רכב קבלן = סיווג הרישוי 'להסע מיוחד'/'הסעות מיוחדות' — אוטובוס הסעות שמופעל על קווי החברה
const isKab=v=>{const t=gT(v);return !!t&&t.includes('מיוחד');};
const op=ref=>DATA.operators.find(o=>o.ref===ref);
// אותה לוחית יכולה להופיע אצל כמה מפעילים (רכב שהועבר בין חברות) —
// מפה גלובלית לוחית ← כל רשומות השידור שלה
let XPLATE={};
function buildX(){XPLATE={};for(const o of DATA.operators)for(const v of o.vehicles){(XPLATE[v[0]]=XPLATE[v[0]]||[]).push([o,v]);}}
const movedTo=v=>{const l=XPLATE[v[0]]||[];const hit=l.find(([o2,v2])=>v2!==v&&isActive(v2)&&v2[2]>v[2]);return hit?hit[0]:null;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kpis(){
  let tot=0,act=0,kab=0;
  for(const o of DATA.operators) for(const v of o.vehicles){tot++;if(isActive(v))act++;if(DATA.enriched&&isKab(v))kab++;}
  return `<div class="kpis">
    <div class="kpi"><b>${fmt(tot)}</b><span>רכבים במעקב</span></div>
    <div class="kpi"><b>${fmt(act)}</b><span>פעילים</span></div>
    <div class="kpi bad"><b>${fmt(tot-act)}</b><span>ירדו מהשירות</span></div>
    <div class="kpi"><b>${DATA.operators.length}</b><span>מפעילים</span></div>
    ${kab?`<div class="kpi" title="אוטובוסים הרשומים במאגר הרישוי כ'הסע מיוחד' — בדרך כלל רכבי קבלני הסעות שמופעלים על קווי החברות"><b>${fmt(kab)}</b><span>רכבי קבלן (הסע מיוחד)</span></div>`:''}
    <div class="kpi"><b>${fd(DATA.updated)}</b><span>עדכון מאגר הרישוי ונתוני נסיעה</span></div>
    ${DATA.gov_updated?`<div class="kpi" title="קובץ כלי הרכב הציבוריים ממאגר הרישוי הממשלתי — מועלה ידנית לריפו"><b>${fd(DATA.gov_updated)}</b><span>עדכון פרטי הרכב (קובץ ידני)</span></div>`:''}
  </div>`;
}

function home(){
  const f=Q.trim();
  if(MODE==='city') return cityHome(f);
  if(MODE==='plate'&&f){
    const clean=f.replace(/-/g,'');
    const hits=[];
    for(const o of DATA.operators) for(const v of o.vehicles)
      if(v[0].replace(/-/g,'').includes(clean)){hits.push([o,v]);if(hits.length>=60)break;}
    return kpis()+`<div class="panel"><p class="ptitle">תוצאות למספר רכב "${esc(f)}"</p>
      ${hits.length?table(hits.map(h=>h[1]),hits.map(h=>h[0])):'<div class="empty">לא נמצא רכב מתאים</div>'}</div>`;
  }
  const ops=DATA.operators.filter(o=>!f||o.name.includes(f)).slice().sort((a,b)=>b.vehicles.length-a.vehicles.length);
  return kpis()+`<div class="cards">${ops.map((o,i)=>{
    const act=o.vehicles.filter(isActive).length, ret=o.vehicles.length-act;
    const kab=DATA.enriched?o.vehicles.filter(isKab).length:0;
    return `<button class="card" style="background:${opColor(o.ref,i)}" onclick="go(${o.ref})">
      <h2>${esc(o.name)}</h2><div class="n">${fmt(o.vehicles.length)}</div>
      <div class="pills"><span>${fmt(act)} פעילים</span>${ret?`<span class="r">${fmt(ret)} ירדו</span>`:''}${kab?`<span>${fmt(kab)} רכבי קבלן</span>`:''}</div>
    </button>`;}).join('')||'<div class="empty">לא נמצאה חברה</div>'}</div>`;
}

/* ── מצב עיר: אילו רכבים פועלים בכל עיר (נבנה מהקווים ששידר כל רכב) ── */
async function loadCities(){
  if(CITIES!==null) return;
  try{const r=await fetch('data/fleet-cities.json',{cache:'no-cache'});CITIES=r.ok?await r.json():{cities:{}};}
  catch(e){CITIES={cities:{}};}
  render();
}
function opName(ref){const o=op(+ref);return o?o.name:'מפעיל '+ref;}
function cityHome(f){
  if(CITIES===null){loadCities();return kpis()+'<div class="msg">⏳ טוען נתוני ערים…</div>';}
  const all=Object.entries(CITIES.cities||{});
  if(!all.length) return kpis()+'<div class="panel"><div class="empty">נתוני הערים ייבנו בריצת האיסוף הקרובה — הסריקה החלה לשמור את הקווים של כל רכב רק עכשיו. חזרו מחר.</div></div>';
  if(CITYSEL&&CITIES.cities[CITYSEL]) return cityView(CITYSEL);
  const hits=all.filter(([c])=>!f||c.includes(f)).sort((a,b)=>b[1].total-a[1].total).slice(0,30);
  return kpis()+`<div class="cards">${hits.map(([c,d])=>
    `<button class="card" style="background:#10172A" onclick="CITYSEL=${JSON.stringify(c).replace(/"/g,'&quot;')};render();window.scrollTo({top:0})">
      <h2>${esc(c)}</h2><div class="n">${fmt(d.total)}</div>
      <div class="pills"><span>רכבים פועלים בעיר</span></div>
    </button>`).join('')||'<div class="empty">לא נמצאה עיר</div>'}</div>`;
}
function cityView(c){
  const d=CITIES.cities[c];
  const mx=d.ops.length?d.ops[0][1]:1;
  const yk=Object.keys(d.years).map(Number).sort((a,b)=>b-a);
  const ymax=yk.length?Math.max(...Object.values(d.years)):1;
  const y0=+DATA.updated.slice(0,4);
  return `<button class="back" onclick="CITYSEL=null;render()">→ חזרה לכל הערים</button>
  <div class="ophead" style="background:#10172A">
    <div><h2>${esc(c)}</h2><div class="sub2">${fmt(d.total)} רכבים שונים פועלים בעיר · עדכון ${fd(CITIES.updated)}</div></div>
  </div>
  <div class="cols2">
    <div class="panel"><p class="ptitle">החברות שפועלות בעיר</p>
      ${d.ops.slice(0,12).map(([ref,n])=>`<div class="yrow" style="grid-template-columns:110px 1fr 52px"><span style="font-weight:700">${esc(opName(ref))}</span><div class="ybar"><i style="width:${Math.max(5,n/mx*100)}%;background:#1B7A3D"></i></div><span class="c">${fmt(n)}</span></div>`).join('')}
    </div>
    ${yk.length?`<div class="panel"><p class="ptitle">כמה אוטובוסים מכל שנתון מבצעים נסיעות בעיר</p>
      ${yk.map(y=>{const col=y>=y0-4?'#1B7A3D':y>=y0-8?'#9AB8A6':'#B3B9C6';
        return `<div class="yrow"><span>${y}</span><div class="ybar"><i style="width:${Math.max(4,d.years[y]/ymax*100)}%;background:${col}"></i></div><span class="c">${fmt(d.years[y])}</span></div>`;}).join('')}
    </div>`:'<div class="panel"><p class="ptitle">שנתונים</p><div class="empty">שנות הייצור יתווספו עם ההעשרה הממשלתית</div></div>'}
  </div>
  <p class="note">רכב משויך לעיר רק אם היא מוצא או יעד של קו שבו שידר — קווים שרק חולפים דרך העיר אינם נספרים. הנתונים מצטברים ככל שהסריקה מתקדמת.</p>`;
}

function table(vs,opsArr){
  const enr=DATA.enriched;
  const th=(k,t)=>`<th onclick="srt('${k}')">${t}${SORTK===k?(SORTD>0?' ▲':' ▼'):''}</th>`;
  const shown=vs.slice(0,LIMIT);
  return `<div class="tblbox"><table><thead><tr>${opsArr?'<th>חברה</th>':''}
    ${th('p','מספר רכב')}${enr?th('t','סוג הרכב')+th('y','שנתון')+th('d','דלתות')+th('m','יצרן ודגם'):''}
    ${OFF?th('r','נסיעות ביום'):''}${th('f','נצפה לראשונה')}${th('l','נצפה לאחרונה')}<th>מצב</th></tr></thead><tbody>
  ${shown.map((v,i)=>{const on=isActive(v);const mv=on?null:movedTo(v);
    return `<tr class="v ${on||mv?'':'off'}" tabindex="0" onclick="showV('${esc(v[0])}')">
    ${opsArr?`<td>${esc(opsArr[i].name)}</td>`:''}
    <td dir="ltr" style="text-align:right">${esc(v[0])}</td>
    ${enr?`<td>${gT(v)?`<span class="tg">${esc(gT(v))}</span>`:'—'}</td><td>${gY(v)||'—'}</td><td>${gD(v)||'—'}</td><td>${esc(gM(v)||'—')}</td>`:''}
    ${OFF?`<td>${gR(v)!=null?gR(v):'—'}</td>`:''}
    <td>${fd(v[1])}</td><td>${fd(v[2])}</td>
    <td><span class="st ${on?'on':mv?'mv':'off'}">${on?'פעיל':mv?'עבר ל'+esc(mv.name):'ירד מהשירות'}</span></td></tr>`;}).join('')}
  </tbody></table></div>
  ${vs.length>LIMIT?`<button class="more" onclick="LIMIT+=400;render()">הצגת עוד ${fmt(Math.min(400,vs.length-LIMIT))} מתוך ${fmt(vs.length-LIMIT)} שנותרו</button>`:''}`;
}

function opView(ref){
  const o=op(ref); if(!o) return home();
  const i=DATA.operators.indexOf(o), color=opColor(ref,i);
  const act=o.vehicles.filter(isActive).length, ret=o.vehicles.length-act;
  const enr=DATA.enriched;
  const kab=enr?o.vehicles.filter(isKab).length:0;
  const types={};
  if(enr) o.vehicles.forEach(v=>{const t=gT(v);if(t)types[t]=(types[t]||0)+1;});
  // באיזו שנה קלנדרית הרכב היה בשימוש: החלון שבין הצפייה הראשונה לאחרונה
  const usedIn=(v,Y)=>v[1]<=Y+'-12-31'&&v[2]>=Y+'-01-01';
  const years={}, yearsAct={}; let ysum=0,yn=0;
  o.vehicles.forEach(v=>{const y=gY(v);if(y){years[y]=(years[y]||0)+1;ysum+=y;yn++;
    if(YEARF?usedIn(v,YEARF):isActive(v))yearsAct[y]=(yearsAct[y]||0)+1;}});
  // אילו שנים קלנדריות מכוסות בנתוני השידור של החברה
  let minSeen=9999; o.vehicles.forEach(v=>{const y=+v[1].slice(0,4);if(y<minSeen)minSeen=y;});
  const calYears=[]; for(let y=+DATA.updated.slice(0,4);y>=minSeen;y--)calYears.push(y);
  // ממוצע נסיעות יומי לצי (רק בפורמט v2)
  const ravg=(()=>{if(!OFF)return null;const xs=o.vehicles.map(gR).filter(x=>x!=null);
    return xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1):null;})();
  const yk=Object.keys(years).map(Number).sort((a,b)=>b-a);
  const ymax=yk.length?Math.max(...Object.values(years)):1;
  const avgAge=yn?(new Date(DATA.updated).getFullYear()-ysum/yn).toFixed(1):null;
  const y0=+DATA.updated.slice(0,4);
  let vs=o.vehicles;
  if(TYPEF) vs=vs.filter(v=>gT(v)===TYPEF);
  if(KABF==='k') vs=vs.filter(isKab);
  if(KABF==='l') vs=vs.filter(v=>!isKab(v));
  if(STATF!==null) vs=vs.filter(v=>(isActive(v)?1:0)===STATF);
  vs=sortVs(vs);
  return `<button class="back" onclick="go(null)">→ חזרה לכל החברות</button>
  <div class="ophead" style="background:${color}">
    <div><h2>${esc(o.name)}</h2><div class="sub2">${fmt(o.vehicles.length)} רכבים${avgAge?` · גיל ממוצע ${avgAge}`:''} · עדכון ${fd(DATA.updated)}</div></div>
    <div class="pills"><span>${fmt(act)} פעילים</span>${ret?`<span class="r">${fmt(ret)} ירדו מהשירות</span>`:''}${ravg?`<span>${ravg} נסיעות ביום לרכב בממוצע</span>`:''}${kab?`<span title="אוטובוסים הרשומים במאגר הרישוי כ'הסע מיוחד' — בדרך כלל רכבי קבלני הסעות">🚐 ${fmt(kab)} רכבי קבלן</span>`:''}</div>
  </div>
  ${Object.keys(types).length?`<div class="panel"><p class="ptitle">פילוח לפי סוג רכב — לחיצה מסננת את הטבלה</p>
    <div class="types">${Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
      `<button class="type ${TYPEF===t?'on':''}" onclick="TYPEF=TYPEF===${JSON.stringify(t).replace(/"/g,'&quot;')}?null:${JSON.stringify(t).replace(/"/g,'&quot;')};LIMIT=200;render()"><b>${fmt(c)}</b><span>${esc(t)}</span></button>`).join('')}</div></div>`:''}
  ${yk.length?`<div class="panel"><p class="ptitle">כמה רכבים מכל שנתון — וכמה מהם ${YEARF?`היו בשימוש בשנת ${YEARF}`:'פעילים בפועל'}</p>
      ${calYears.length>1?`<div class="filters">
        <button class="fchip ${YEARF===null?'on':''}" onclick="YEARF=null;render()">היום</button>
        ${calYears.map(y=>`<button class="fchip ${YEARF===y?'on':''}" onclick="YEARF=${y};render()">${y}</button>`).join('')}
      </div>`:''}
      ${yk.map(y=>{const c=y>=y0-6?color:y>=y0-10?'#9AA8B8':'#C4CAD4';const act=yearsAct[y]||0;
        return `<div class="yrow" style="grid-template-columns:44px 1fr 170px"><span>${y}</span><div class="ybar"><b class="tot" style="width:${Math.max(4,years[y]/ymax*100)}%"><i style="width:${years[y]?Math.round(act/years[y]*100):0}%;background:${c}"></i></b></div><span class="c"><b style="color:var(--ok)">${fmt(act)} ${YEARF?`בשנת ${YEARF}`:'פעילים'}</b> · ${fmt(years[y])} סה"כ</span></div>`;}).join('')}
      <p class="note">${YEARF?`רכב נספר לשנת ${YEARF} אם שידר נסיעות במהלכה (לפי חלון הפעילות שנמדד בדאטאבוס). הנתונים מכסים מ-${minSeen} ואילך — ורק את התקופה שכבר נסרקה.`:'"פעיל" = שידר במהלך החודש האחרון. רכב שלא שידר חודש ומעלה נחשב כמי שירד מהשירות.'}</p>
    </div>`:'<div class="panel"><p class="ptitle">כמה רכבים מכל שנתון</p><div class="empty">שנות הייצור יתווספו בהעשרה הקרובה מהמאגר הממשלתי</div></div>'}
  <div class="panel"><p class="ptitle">הרכבים${TYPEF?' · מסונן: '+esc(TYPEF):''}</p>
    <div class="filters">
      <button class="fchip ${STATF===null?'on':''}" onclick="STATF=null;LIMIT=200;render()">הכול</button>
      <button class="fchip ${STATF===1?'on':''}" onclick="STATF=1;LIMIT=200;render()">פעילים</button>
      <button class="fchip ${STATF===0?'on':''}" onclick="STATF=0;LIMIT=200;render()">ירדו מהשירות</button>
      ${enr&&kab?`<button class="fchip ${KABF==='l'?'on':''}" onclick="KABF=KABF==='l'?null:'l';LIMIT=200;render()">רכבי קו</button>
      <button class="fchip ${KABF==='k'?'on':''}" onclick="KABF=KABF==='k'?null:'k';LIMIT=200;render()">רכבי קבלן</button>`:''}
    </div>
    ${table(vs,null)}
    <p class="note">לחיצה על כותרת ממיינת · לחיצה על רכב פותחת את כל פרטיו.</p>
  </div>`;
}

function sortVs(vs){
  if(!SORTK) return vs;
  const key={p:v=>v[0],f:v=>v[1],l:v=>v[2],y:v=>gY(v)||0,m:v=>gM(v)||'',d:v=>gD(v)||0,t:v=>gT(v)||'',r:v=>gR(v)||0}[SORTK];
  return vs.slice().sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*SORTD;});
}
function srt(k){if(SORTK===k)SORTD*=-1;else{SORTK=k;SORTD=-1;}render();}

/* חלון פרטי רכב — כל שדה מהמאגר הממשלתי, נטען מהחלק (shard) הרלוונטי */
const LBL={mispar_rechev:'מספר רכב',tozeret_nm:'יצרן',tozeret_cd:'קוד יצרן',degem_nm:'דגם',
  degem_cd:'קוד דגם',kinuy_mishari:'כינוי מסחרי',shnat_yitzur:'שנת ייצור',tzeva_rechev:'צבע',
  tzeva_cd:'קוד צבע',sug_delek_nm:'סוג דלק',mispar_moshavim:'מספר מושבים',tokef_dt:'תוקף רישיון',
  moed_aliya_lakvish:'עלייה לכביש',sug_rechev_nm:'סוג רכב',sug_rechev_cd:'קוד סוג רכב',
  baalut:'בעלות',misgeret:'מספר שלדה',mishkal_kolel:'משקל כולל (ק"ג)',gova:'גובה (ס"מ)',
  mispar_dlatot:'מספר דלתות',kvutzat_zihum:'קבוצת זיהום',ramat_gimur:'רמת גימור',
  mivchan_acharon_dt:'טסט אחרון',degem_manoa:'דגם מנוע',nefach_manoa:'נפח מנוע (סמ"ק)',
  koah_sus:'כוח סוס',hanaa_nm:'הנעה',mazgan_ind:'מיזוג',halonot_nm:'חלונות',
  abs_ind:'ABS',mispar_kariot_avir:'כריות אוויר',mispar_mekomot:'מספר מושבים',
  mispar_mekomot_leyd_nahag:'מושבים ליד הנהג',sug_rechev_EU_nm:'סיווג אירופי',
  bitul_nm:'סטטוס רישום',_source:'מקור הנתון'};
const SHARDS={};
async function shard(d){
  if(SHARDS[d]!==undefined) return SHARDS[d];
  try{const r=await fetch(`data/gov-details-${d}.json`,{cache:'no-cache'});SHARDS[d]=r.ok?await r.json():{};}
  catch(e){SHARDS[d]={};}
  return SHARDS[d];
}
async function showV(plate){
  // כל רשומות השידור של הלוחית — רכב שעבר בין חברות מופיע אצל כמה מפעילים
  const recs=(XPLATE[plate]||[]).slice().sort((a,b)=>a[1][2]<b[1][2]?1:-1);
  if(!recs.length) return;
  const fv=recs[0][1];
  const clean=plate.replace(/-/g,'').replace(/^0+/,'');
  const gov=(await shard(clean.slice(-1)))[clean];
  const on=recs.some(([,v])=>isActive(v));
  let rows='';
  for(const [o2,v2] of recs){
    const on2=isActive(v2);
    rows+=`<div class="msec">מהשידורים (דאטאבוס)${recs.length>1?' — '+esc(o2.name):''}</div><div class="mgrid">
    ${recs.length>1?'':`<div class="k">מפעיל</div><div class="v2">${esc(o2.name)}</div>`}
    <div class="k">נצפה לראשונה</div><div class="v2">${fd(v2[1])}</div>
    <div class="k">נצפה לאחרונה</div><div class="v2">${fd(v2[2])}</div>
    ${gR(v2)!=null?`<div class="k">נסיעות ביום בממוצע</div><div class="v2">${gR(v2)} (בימים שנמדדו)</div>`:''}
    <div class="k">מצב</div><div class="v2">${on2?'✅ פעיל':recs.length>1&&on?'↩️ כבר לא משדר אצל המפעיל הזה':'🔴 ירד מהשירות'}</div></div>`;
  }
  if(recs.length>1) rows+=`<p class="note">הרכב שידר תחת יותר ממפעיל אחד — כנראה הועבר בין חברות באותה קבוצה.</p>`;
  if(gov){
    const known=Object.keys(LBL).filter(k=>gov[k]!==undefined);
    const rest=Object.keys(gov).filter(k=>!(k in LBL));
    rows+=`<div class="msec">מהמאגר הממשלתי — כל השדות${DATA.gov_updated?` (נכון ל-${fd(DATA.gov_updated)})`:''}</div><div class="mgrid">`+
      [...known,...rest].map(k=>`<div class="k">${esc(LBL[k]||k)}</div><div class="v2">${esc(gov[k])}</div>`).join('')+`</div>`;
  }else{
    rows+=`<div class="msec">המאגר הממשלתי</div><div class="note">הרכב לא נמצא במאגר הרכב הציבורי — ייתכן שהוסר מהרישום, שההעשרה טרם רצה, או שהמזהה בשידור אינו לוחית.</div>`;
  }
  const ovl=document.createElement('div');ovl.className='ovl';
  ovl.innerHTML=`<div class="modal"><div class="mhead"><span class="plate">${esc(plate)}</span>
    ${gT(fv)?`<span class="tg">${esc(gT(fv))}</span>`:''}
    <span class="st ${on?'on':'off'}">${on?'פעיל':'ירד מהשירות'}</span>
    <button class="x" aria-label="סגירה">✕</button></div>${rows}</div>`;
  ovl.addEventListener('click',e=>{if(e.target===ovl||e.target.classList.contains('x'))ovl.remove();});
  document.body.appendChild(ovl);
}

function go(ref){VIEW=ref===null?{t:'home'}:{t:'op',ref};TYPEF=null;KABF=null;STATF=null;YEARF=null;SORTK=null;LIMIT=200;render();window.scrollTo({top:0});}
function render(){$('#view').innerHTML=VIEW.t==='op'?opView(VIEW.ref):home();}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  MODE=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));
  $('#q').placeholder=MODE==='op'?'חיפוש חברה…':MODE==='city'?'חיפוש עיר…':'חיפוש מספר רכב…';
  VIEW={t:'home'};CITYSEL=null;LIMIT=200;render();
}));
$('#q').addEventListener('input',e=>{Q=e.target.value;VIEW={t:'home'};CITYSEL=null;LIMIT=200;render();});

fetch('data/fleet.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
.then(d=>{d.operators=d.operators.filter(o=>![2,20,21].includes(o.ref)&&!/^מפעיל \d+$/.test(o.name));DATA=d;OFF=d.v===2?1:0;buildX();render();})
.catch(()=>{$('#view').innerHTML='<div class="msg">עוד אין נתונים — הריצו את ה-workflow ‏fleet-scan ב-GitHub Actions.</div>';});
</script>
</body>
</html>
