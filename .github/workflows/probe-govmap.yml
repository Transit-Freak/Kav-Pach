name: probe-govmap

# בדיקת GovMap (מרשם הכתובות הארצי) כמקור חיפוש כתובות למחירון:
# אילו endpoints עונים והאם CORS מאפשר קריאה מהאתר. דוח בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-govmap.yml'
      - 'tools/probe_govmap.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-govmap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: בדיקה
        run: |
          mkdir -p fares/checks
          python3 tools/probe_govmap.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp fares/checks/govmap-probe.json /tmp/probe.json
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p fares/checks && cp /tmp/probe.json fares/checks/govmap-probe.json
            git add fares/checks/govmap-probe.json
            if git diff --cached --quiet; then echo 'אין שינוי'; break; fi
            git commit -m 'data: בדיקת GovMap כמקור כתובות למחירון'
            if git push origin HEAD:main; then break; fi
            echo "push rejected — retry $i"; sleep 10
          done
