name: probe-govmap

# רעיון שלמה: האם התצלום האווירי הארצי (govmap / מפ"י) שמיש לפיילוט —
# איכות, כיסוי, ותנאי שימוש. כתובת אחת ארצית במקום עשרות עיריות.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: שירותי המפה הארציים
        run: |
          j() {
            echo "=== $1"
            curl -sk --max-time 30 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 1200
            echo; echo "---"
          }
          # govmap — נקודות הקצה הידועות
          j "https://ags.govmap.gov.il/arcgis/rest/services?f=json"
          j "https://open.govmap.gov.il/arcgis/rest/services?f=json"
          j "https://gisserver.mapi.gov.il/arcgis/rest/services?f=json"
          # מרכז המיפוי הישראלי (מפ"י) — שירותי אורתופוטו
          j "https://mapi.gov.il/arcgis/rest/services?f=json"
          j "https://orthophoto.mapi.gov.il/arcgis/rest/services?f=json"
          # שירות אריחים ציבורי של govmap
          j "https://cdn.govmap.gov.il/arcgis/rest/services?f=json"

      - name: תנאי שימוש govmap ומפ"י
        run: |
          txt() {
            echo "=== $1"
            curl -skL --max-time 30 "$1" -H 'User-Agent: Mozilla/5.0' | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?is)<(script|style).*?</\1>',' ',t)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t))
          t=re.sub(r'\s+',' ',t).strip()
          print(t[:2000] if t else '(ריק)')
          "
            echo; echo "---"
          }
          txt "https://www.govmap.gov.il/terms"
          txt "https://www.gov.il/he/departments/general/mapi_terms_of_use"
          txt "https://www.gov.il/he/departments/survey_of_israel"

      - name: נקודות קצה מהתיעוד הרשמי של govmap API
        run: |
          t() {
            echo "=== $1"
            code=$(curl -sk -o /tmp/o.txt -w '%{http_code}' --max-time 25 "$1" -H 'User-Agent: Mozilla/5.0' -H 'Referer: https://www.govmap.gov.il/')
            echo "  HTTP $code"
            head -c 400 /tmp/o.txt; echo; echo "---"
          }
          # ה-API המתועד: חיפוש, שכבות, והטמעה
          t "https://ags.govmap.gov.il/Search/SearchLocation"
          t "https://ags.govmap.gov.il/Layers/Layers"
          t "https://ags.govmap.gov.il/Identify/IdentifyByXY"
          t "https://www.govmap.gov.il/api/layers"
          t "https://ags.govmap.gov.il/api/layers"
          # WMS/WMTS סטנדרטיים — אם קיימים, זו הדרך הנכונה לאריחים
          t "https://open.govmap.gov.il/geoserver/opendata/wms?service=WMS&request=GetCapabilities"
          t "https://ags.govmap.gov.il/arcgis/services?wsdl"
          # מפ"י — שירותי אורתופוטו מתועדים
          t "https://api.mapi.gov.il/api/layers"
          t "https://open.mapi.gov.il/arcgis/rest/services?f=json"
