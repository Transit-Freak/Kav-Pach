name: probe-gis

# גישוש חד-פעמי (רעיון הסככות של שלמה): האם ה-GIS העירוני והממשלתי
# חושפים שכבות וקטור לשאילתות תוכנה — פוליגוני מבנים/סככות ליד תחנות.
# לא כותב כלום לריפו; הממצאים בלוג הריצה בלבד.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sk --max-time 20 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 600
            echo; echo "---"
          }
          # שלב 4: המבחן המכריע לרעיון של שלמה — האם "מבנים" כולל סככות?
          echo "=== שכבות מבנה בקטלוג IView2"
          curl -sk --max-time 60 "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2/MapServer?f=json" -H 'User-Agent: Mozilla/5.0' \
            | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)
          for l in d.get('layers') or []:
              if re.search('מבנ|סככ|גגון|קל', l.get('name','')):
                  print(l['id'], l['name'], l.get('geometryType',''))
          "
          echo "--- שאילתה מרחבית: אבן גבירול/ארלוזורוב, רדיוס 40 מ, שכבת מבנים (24) של מפת הבסיס"
          curl -sk --max-time 60 -H 'User-Agent: Mozilla/5.0' \
            "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer/24/query?geometry=34.7818,32.0879&geometryType=esriGeometryPoint&inSR=4326&distance=40&units=esriSRUnit_Meter&outFields=*&returnGeometry=true&f=json" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          fs=d.get('features') or []
          print('פוליגונים שנמצאו:',len(fs),'| שגיאה:' ,d.get('error'))
          def area(rings):
              a=0
              for r in rings:
                  s2=0
                  for i in range(len(r)-1):
                      s2+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1]
                  a+=abs(s2)/2
              return a
          for f in fs[:12]:
              g=f.get('geometry') or {}
              print(round(area(g.get('rings') or [])),'מ\"ר |', json.dumps(f.get('attributes'),ensure_ascii=False)[:120])
          "
          echo "---"
