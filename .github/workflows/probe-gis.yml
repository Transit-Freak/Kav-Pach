name: probe-gis

# גישוש חד-פעמי (רעיון הסככות של שלמה): האם ה-GIS העירוני והממשלתי
# חושפים שכבות וקטור לשאילתות תוכנה — פוליגוני מבנים/סככות ליד תחנות.
# לא כותב כלום לריפו; הממצאים בלוג הריצה בלבד.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sk --max-time 20 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 600
            echo; echo "---"
          }
          # שלב 2: צלילה לתל אביב — שהגישוש הראשון מצא פתוחה
          big() {
            echo "=== $1"
            curl -sk --max-time 30 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 4000
            echo; echo "---"
          }
          big "https://gisn.tel-aviv.gov.il/arcgis/rest/services/OpenData?f=json"
          big "https://gisn.tel-aviv.gov.il/arcgis/rest/services/WM?f=json"
          big "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer?f=json"
