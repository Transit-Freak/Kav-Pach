name: probe-gis

# גישוש חד-פעמי (רעיון הסככות של שלמה): האם ה-GIS העירוני והממשלתי
# חושפים שכבות וקטור לשאילתות תוכנה — פוליגוני מבנים/סככות ליד תחנות.
# לא כותב כלום לריפו; הממצאים בלוג הריצה בלבד.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sk --max-time 20 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 600
            echo; echo "---"
          }
          # שלב 5: אילו סוגי מבנה קיימים בכלל בשכבה — יש קטגוריית סככה?
          echo "=== ערכי t_sug_mivne בשכבת המבנים"
          curl -sk --max-time 60 -H 'User-Agent: Mozilla/5.0' \
            "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer/24/query?where=1%3D1&groupByFieldsForStatistics=t_sug_mivne&outStatistics=%5B%7B%22statisticType%22%3A%22count%22%2C%22onStatisticField%22%3A%22oid_mivne%22%2C%22outStatisticFieldName%22%3A%22n%22%7D%5D&f=json" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('error'): print('שגיאה:',d['error'])
          for f in d.get('features') or []:
              a=f['attributes']; print(a.get('t_sug_mivne'),'·',a.get('n'))
          "
          echo "---"
