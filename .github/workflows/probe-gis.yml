name: probe-gis

# גישוש חד-פעמי (רעיון הסככות של שלמה): האם ה-GIS העירוני והממשלתי
# חושפים שכבות וקטור לשאילתות תוכנה — פוליגוני מבנים/סככות ליד תחנות.
# לא כותב כלום לריפו; הממצאים בלוג הריצה בלבד.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sk --max-time 20 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 600
            echo; echo "---"
          }
          # שלב 3: הקטלוג המלא של תל אביב — חיפוש שכבות סככה/תחנה/ריהוט
          echo "=== שכבות רלוונטיות ב-IView2"
          curl -sk --max-time 60 "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2/MapServer?f=json" -H 'User-Agent: Mozilla/5.0' \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          ls=d.get('layers') or []
          print('סה\"כ שכבות:',len(ls))
          import re
          for l in ls:
              if re.search('סככ|תחנ|אוטובוס|ריהוט|רהיט|עמוד|מתקן', l.get('name','')):
                  print(l['id'], l['name'], l.get('geometryType',''))
          "
          echo "---"
