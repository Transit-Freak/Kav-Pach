name: probe-gis

# גישוש חד-פעמי (רעיון הסככות של שלמה): האם ה-GIS העירוני והממשלתי
# חושפים שכבות וקטור לשאילתות תוכנה — פוליגוני מבנים/סככות ליד תחנות.
# לא כותב כלום לריפו; הממצאים בלוג הריצה בלבד.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sk --max-time 20 "$1" -H 'User-Agent: Mozilla/5.0' | head -c 600
            echo; echo "---"
          }
          # שלב 6: בן כמה הסקר? שדות התאריך של פוליגוני "תחנת אוטובוס"
          echo "=== דוגמת פוליגוני תחנת אוטובוס עם כל השדות"
          curl -sk --max-time 60 -H 'User-Agent: Mozilla/5.0' \
            "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer/24/query?where=t_sug_mivne%3D%27%D7%AA%D7%97%D7%A0%D7%AA%20%D7%90%D7%95%D7%98%D7%95%D7%91%D7%95%D7%A1%27&outFields=*&resultRecordCount=3&returnGeometry=false&f=json" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for f in d.get('features') or []:
              print(json.dumps(f['attributes'],ensure_ascii=False))
          print('שדות:',[fl['name']+':'+fl.get('type','') for fl in d.get('fields') or []])
          "
          echo "---"
