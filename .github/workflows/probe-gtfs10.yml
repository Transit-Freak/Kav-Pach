name: probe-gtfs10
on:
  push:
    branches: [probe-go]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: השוואת פורמט המזהים
        run: |
          set -e
          curl -sL -o g10.zip "https://gtfs.mot.gov.il/gtfsfiles/Gtfs_10_days.zip"
          curl -sL -o tid.zip "https://gtfs.mot.gov.il/gtfsfiles/TripIdToDate.zip"
          python3 - <<'PY'
          import zipfile, io, csv, itertools
          z = zipfile.ZipFile('g10.zip')
          rd = csv.reader(io.TextIOWrapper(z.open('trips.txt'), 'utf-8-sig'))
          hdr = next(rd)
          print('עמודות trips (10 ימים):', hdr)
          rows = list(itertools.islice(rd, 5))
          for r in rows: print(' ', r)
          zt = zipfile.ZipFile('tid.zip')
          rd2 = csv.reader(io.TextIOWrapper(zt.open(zt.namelist()[0]), 'utf-8-sig'))
          print('עמודות TripIdToDate:', next(rd2))
          for r in itertools.islice(rd2, 3): print(' ', r)
          # האם ה-route_id של ה-10 ימים תואם ל-route_id של הקובץ הקלאסי?
          rd3 = csv.reader(io.TextIOWrapper(z.open('routes.txt'), 'utf-8-sig'))
          h = {c.strip(): i for i, c in enumerate(next(rd3))}
          print('עמודות routes (10 ימים):', sorted(h))
          for r in itertools.islice(rd3, 3): print(' ', r[:6])
          PY
