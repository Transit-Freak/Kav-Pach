name: line-history

# "הקו בזמן" — תיעוד יומי של שינויי מסלולים ותחנות מהשוואת GTFS.
# הריצה הראשונה יוצרת בסיס (כל הגרסאות הנוכחיות); מכאן והלאה רק שינויים.

on:
  schedule:
    - cron: '30 7 * * *'   # 10:30 ישראל בקיץ — אחרי חלון הפרסום של משרד התחבורה
  push:
    branches: [main]   # הבסיס נבנה פעם אחת על main — לא על ענפי עבודה
    paths:
      - '.github/workflows/line-history.yml'
      - 'tools/linehistory.py'
      - 'tools/rebuild_lines_index.py'
      - 'tools/enrich_stop_diffs.py'
      - 'tools/scan_vcnt_daily.py'
      - 'tools/last_sched.py'
      - 'tools/compact_lines.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: line-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1200 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt agency.txt calendar.txt

      - name: Diff line & stop history
        run: |
          set -euo pipefail
          # קובץ סימון ליישור חד-פעמי (תיקון גאומטריות בלי רישום אירועים)
          REBASE=0; [ -f line-history/data/.rebase ] && REBASE=1
          echo "REBASE=$REBASE"
          STOPS=stops.txt STOP_TIMES=stop_times.txt TRIPS=trips.txt ROUTES=routes.txt \
            SHAPES=shapes.txt AGENCY=agency.txt CALENDAR=calendar.txt MAIN=data-main.json \
            OUTDIR=line-history/data REBASE=$REBASE python3 tools/linehistory.py
          rm -f line-history/data/.rebase

      # אותה סריקה יומית אחת לכל הדפים: גם מעקב התגבורים (Gtfs_10_days)
      # רץ כאן, והתוצאות נדחפות באותו commit. כשל של שרת הרישוי לא מפיל
      # את הצינור — ההשוואה הבאה תתפוס את הפער.
      - name: מעקב תגבורים (רכבים מרובים באותה נסיעה)
        run: |
          OUTDIR=line-history/data python3 tools/scan_vcnt_daily.py || echo "שרת הרישוי לא זמין — נשלים בריצה הבאה"

      # קו שבוטל ומלאה שנה לביטולו (ולא נותר ממנו שום לו"ז) — המנגנון שואב
      # לבד מהארכיון את שעות-היציאה מיום פעילותו האחרון, ספציפית לכל קו.
      # עד 2 קבוצות-יום בריצה — ביום רגיל אפס-שתיים בודדות חוצות את סף השנה.
      - name: לו"ז אחרון לקווים שבוטלו (שנה ומעלה)
        run: |
          OUTDIR=line-history/data MAX_DAYS=2 python3 tools/last_sched.py || echo "הארכיון לא זמין — נשלים בריצה הבאה"

      # קו באג — אותה סריקה יומית אחת: קוד הזיהוי נמשך מריפו קו-באג (מקור
      # האמת שלו נשאר שם), רץ על אותו GTFS שכבר ירד כאן, והתוצאות נשמרות
      # ב-kavbug-data/; ריפו קו-באג מושך אותן בסנכרון קטן והאתר שלו נשאר
      # באותה כתובת בדיוק.
      - name: סריקת קו באג (עיקופי אוטובוסים) על אותו GTFS
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/kbscan kavbug-data
          for f in scan-country.js update-history.js data.js components.jsx; do
            curl -fsSL "https://raw.githubusercontent.com/Transit-Freak/kav-bug/main/$f" -o "/tmp/kbscan/$f"
          done
          npm install --prefix /tmp/kbscan fflate --no-save
          node --max-old-space-size=6144 /tmp/kbscan/scan-country.js gtfs.zip kavbug-data/country-scan
          node /tmp/kbscan/update-history.js kavbug-data/country-scan.json kavbug-data/history.json

      - name: Commit (לענף שהריץ — main בריצה המתוזמנת)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME:-main}"
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt agency.txt calendar.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # מיזוג לפי קבצים במקום העתקת התיקייה כולה: רק הקבצים שהריצה הזו
          # שינתה נשמרים; קובץ שהשתנה בינתיים גם ב-origin — origin גובר
          # (למשל סיפור מדויק ממכונת הדיוק שנחת בזמן שהריצה רצה).
          BASE=$(git rev-parse HEAD)
          git add -A line-history/data kavbug-data
          git diff --cached --name-only --diff-filter=d -z "$BASE" -- line-history/data kavbug-data > /tmp/lh-changed
          git diff --cached --name-only --diff-filter=D -z "$BASE" -- line-history/data kavbug-data > /tmp/lh-deleted
          rm -rf /tmp/lh-out && mkdir -p /tmp/lh-out
          xargs -0 -r -I{} cp --parents {} /tmp/lh-out/ < /tmp/lh-changed
          for i in 1 2 3 4; do
            git fetch origin "$BR" && git reset --hard "origin/$BR"
            cp -r /tmp/lh-out/. .
            xargs -0 -r rm -f -- < /tmp/lh-deleted
            git diff --name-only -z "$BASE" "origin/$BR" -- line-history/data kavbug-data > /tmp/lh-theirs
            while IFS= read -r -d '' f; do
              git checkout "origin/$BR" -- "$f" 2>/dev/null || rm -f -- "$f"
            done < /tmp/lh-theirs
            OUTDIR=line-history/data python3 tools/enrich_stop_diffs.py
            OUTDIR=line-history/data python3 tools/compact_lines.py
            OUTDIR=line-history/data python3 tools/rebuild_lines_index.py
            git add -A line-history/data kavbug-data
            if git diff --cached --quiet; then
              echo "unchanged — nothing to commit"; break; fi
            git commit -m "data: line-history — שינויי מסלולים ותחנות יומיים"
            if git push origin HEAD:"$BR"; then break; fi
            echo "push rejected ($BR moved) — retry $i"; sleep 10
          done
