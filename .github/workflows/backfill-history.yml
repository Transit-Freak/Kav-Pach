name: backfill-history

# "הקו בזמן" — מילוי-לאחור מארכיון אופן באס (הסדנא לידע ציבורי).
# מופעל ידנית עם טווח תאריכים; ממשיך מהנקודה האחרונה שנדגמה (backfill-state).
# קצב מנומס: ~2 קריאות בשנייה מול ה-API הציבורי שלהם.

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'מתאריך (YYYY-MM-DD)'
        required: true
        default: '2022-01-01'
      to:
        description: 'עד תאריך (YYYY-MM-DD)'
        required: true
        default: '2026-07-24'
  # דחיפה לקבצי המילוי מפעילה ריצה עם הטווח המלא — הסקריפט ממשיך לבד
  # מהנקודה האחרונה שנדגמה (backfill-state), אז ריצות חוזרות בטוחות.
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-history.yml'
      - 'tools/backfill_routes.py'
      - 'tools/rebuild_lines_index.py'
      - 'tools/enrich_stop_diffs.py'

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) לא תתפוס את מקומה של ריצת main שממתינה בתור
  group: backfill-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Backfill route timeline from Stride API
        run: |
          set -euo pipefail
          FROM="${{ github.event.inputs.from || '2022-01-01' }}" TO="${{ github.event.inputs.to || '2026-07-24' }}" \
            OUTDIR=line-history/data python3 tools/backfill_routes.py

      - name: Commit (לענף שהריץ)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # מיזוג לפי קבצים במקום העתקת התיקייה כולה: רק הקבצים שהריצה הזו
          # שינתה נשמרים; קובץ שהשתנה בינתיים גם ב-origin — origin גובר.
          BASE=$(git rev-parse HEAD)
          git add -A line-history/data
          git diff --cached --name-only --diff-filter=d -z "$BASE" -- line-history/data > /tmp/bf-changed
          git diff --cached --name-only --diff-filter=D -z "$BASE" -- line-history/data > /tmp/bf-deleted
          rm -rf /tmp/bf-out && mkdir -p /tmp/bf-out
          xargs -0 -r -I{} cp --parents {} /tmp/bf-out/ < /tmp/bf-changed
          for i in 1 2 3 4; do
            git fetch origin "$BR" && git reset --hard "origin/$BR"
            cp -r /tmp/bf-out/. .
            xargs -0 -r rm -f -- < /tmp/bf-deleted
            git diff --name-only -z "$BASE" "origin/$BR" -- line-history/data > /tmp/bf-theirs
            while IFS= read -r -d '' f; do
              git checkout "origin/$BR" -- "$f" 2>/dev/null || rm -f -- "$f"
            done < /tmp/bf-theirs
            OUTDIR=line-history/data python3 tools/enrich_stop_diffs.py
            OUTDIR=line-history/data python3 tools/rebuild_lines_index.py
            git add -A line-history/data
            if git diff --cached --quiet; then
              echo "unchanged"; break; fi
            git commit -m "data: מילוי-לאחור מארכיון אופן באס (${{ github.event.inputs.from }} עד ${{ github.event.inputs.to }})"
            if git push origin HEAD:"$BR"; then break; fi
            echo "push rejected — retry $i"; sleep 10
          done
