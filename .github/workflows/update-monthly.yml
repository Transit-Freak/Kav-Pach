name: update-monthly

# חודשי: רענון מלא — GTFS + נקודות עניין (OSM) + רשת כבישים + סיווג +
# חישוב זמני הליכה אמיתיים (OSRM). מעדכן את ענפי המטמון osm-poi/osm-roads
# ודוחף data.json מועשר ל-main.

on:
  schedule:
    - cron: '0 3 1 * *'   # ה-1 בכל חודש 03:00 UTC
  push:
    paths:
      - '.github/workflows/update-monthly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: update-monthly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresh GTFS stops + active set
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 30 --max-time 900 --retry 15 --retry-all-errors --retry-delay 60 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt
          unzip -o gtfs.zip stop_times.txt
          SID=$(head -1 stop_times.txt | tr -d '\r' | tr ',' '\n' | grep -n -x 'stop_id' | cut -d: -f1)
          awk -F, -v c="$SID" 'NR>1{gsub(/\r/,"",$c); if($c!="") a[$c]=1} END{for(k in a) print k}' stop_times.txt | sort > active_stops.txt
          wc -l stops.txt active_stops.txt

      - name: Overpass — points of interest
        run: |
          set -euo pipefail
          Q='[out:json][timeout:700][bbox:29.4,34.2,33.35,35.95];(nwr["amenity"~"^(school|university|college|kindergarten|hospital|clinic|townhall|police|fire_station|library|community_centre|courthouse|theatre|cinema|bus_station|marketplace|fuel|bank|place_of_worship|post_office|grave_yard|social_facility|nursing_home|retirement_home)$"]["name"];nwr["landuse"="cemetery"]["name"];nwr["shop"~"^(mall|department_store|supermarket|convenience)$"]["name"];nwr["railway"="station"]["name"];nwr["leisure"~"^(park|sports_centre|stadium|pitch)$"]["name"];nwr["tourism"~"^(museum|attraction)$"]["name"];nwr["office"="government"]["name"];nwr["public_transport"="station"]["name"];nwr["highway"="motorway_junction"]["name"];nwr["junction"="yes"]["name"];nwr["building"~"^(synagogue|mosque|church|chapel|temple|religious|school|university|college|kindergarten|civic|public|hospital|government)$"]["name"];nwr["place"~"^(neighbourhood|suburb|quarter|village|hamlet)$"]["name"];nwr["barrier"~"^(border_control|checkpoint)$"]["name"];);out center tags;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            if curl -fsS --max-time 800 --data-urlencode "data=$Q" "$ep" -o poi_raw.json; then echo "got $(wc -c < poi_raw.json) bytes"; break; fi
            echo "endpoint failed, next"; sleep 5
          done
          python3 - <<'PY'
          import json
          d=json.load(open('poi_raw.json'))
          def cat(t):
            sh=t.get('shop'); am=t.get('amenity'); rw=t.get('railway')
            le=t.get('leisure'); to=t.get('tourism'); of=t.get('office'); pt=t.get('public_transport')
            hw=t.get('highway'); jn=t.get('junction')
            if hw=='motorway_junction' or jn=='yes': return 'junction'
            if t.get('place') in ('neighbourhood','suburb','quarter'): return 'hood'
            if t.get('place') in ('village','hamlet'): return 'village'
            if t.get('barrier') in ('border_control','checkpoint'): return 'checkpoint'
            if sh in ('mall','department_store'): return 'mall'
            if sh in ('supermarket','convenience'): return 'shop'
            if am=='fuel': return 'fuel'
            if am=='bank': return 'bank'
            if am=='post_office': return 'post'
            # בתי אבות / דיור מוגן — נקודת ציון שתחנות נקראות על-שמה
            if am in ('social_facility','nursing_home','retirement_home'): return 'care'
            if am=='grave_yard' or t.get('landuse')=='cemetery': return 'cemetery'
            if rw=='station': return 'train'
            if am=='place_of_worship': return 'worship'
            if am in ('school','kindergarten'): return 'school'
            if am in ('university','college'): return 'academia'
            if am in ('hospital','clinic'): return 'health'
            if am=='police': return 'police'
            if am=='fire_station': return 'fire'
            if am=='library': return 'library'
            if am=='community_centre': return 'community'
            if am in ('townhall','courthouse') or of=='government': return 'gov'
            if am in ('theatre','cinema') or to in ('museum','attraction'): return 'culture'
            if am=='bus_station' or pt=='station': return 'busstation'
            if am=='marketplace': return 'mall'
            if le=='park': return 'park'
            if le in ('sports_centre','stadium','pitch'): return 'sport'
            bl=t.get('building')
            if bl in ('synagogue','mosque','church','chapel','temple','religious'): return 'worship'
            if bl in ('school','kindergarten'): return 'school'
            if bl in ('university','college'): return 'academia'
            if bl=='hospital': return 'health'
            if bl in ('civic','public','government'): return 'gov'
            return 'other'
          out=[]
          for e in d.get('elements',[]):
            t=e.get('tags',{}); name=t.get('name:he') or t.get('name')
            if not name: continue
            lat=e.get('lat'); lon=e.get('lon')
            if lat is None:
              c=e.get('center') or {}; lat=c.get('lat'); lon=c.get('lon')
            if lat is None or lon is None: continue
            out.append({'n':name,'la':round(float(lat),5),'lo':round(float(lon),5),'k':cat(t)})
          import datetime
          json.dump({'generated':datetime.date.today().isoformat(),'count':len(out),'poi':out}, open('poi.json','w'), ensure_ascii=False, separators=(',',':'))
          print('POIs:', len(out))
          PY
          cp poi.json /tmp/poi.json

      - name: Overpass — named roads
        run: |
          set -euo pipefail
          Q='[out:json][timeout:900][bbox:29.4,34.2,33.35,35.95];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|road)$"]["name"];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|motorway_link|trunk_link|primary_link|secondary_link)$"]["ref"][!"name"];);out geom;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            if curl -fsS --max-time 1000 --data-urlencode "data=$Q" "$ep" -o roads_raw.json; then echo "got $(wc -c < roads_raw.json) bytes"; break; fi
            echo "endpoint failed, next"; sleep 5
          done
          python3 - <<'PY'
          import json
          d=json.load(open('roads_raw.json')); out=[]
          import re
          for e in d.get('elements',[]):
            if e.get('type')!='way': continue
            tags=e.get('tags',{}); name=tags.get('name'); geom=e.get('geometry')
            if not name:
              m=re.match(r'\s*(\d+)',str(tags.get('ref','')))
              if m: name='כביש '+m.group(1)
            if not name or not geom: continue
            pts=[[round(p['lat'],5),round(p['lon'],5)] for p in geom]
            if len(pts)>=2: out.append({'n':name,'g':pts})
          import datetime
          json.dump({'generated':datetime.date.today().isoformat(),'count':len(out),'roads':out}, open('roads.json','w'), ensure_ascii=False, separators=(',',':'))
          print('named roads:', len(out))
          PY
          cp roads.json /tmp/roads.json

      - name: Classify
        run: |
          set -euo pipefail
          cp next-station/data.json prev.json 2>/dev/null || echo '{}' > prev.json
          STOPS=stops.txt POI=poi.json ROADS=roads.json ACTIVE=active_stops.txt \
            PREV=prev.json HISTORY=next-station/history.json CHANGES=next-station/changes.json CATDIFF=next-station/catdiff.json \
            OUT=next-station/data.json python3 tools/classify.py

      - name: Build OSRM (foot) and compute real walking times
        run: |
          set -euo pipefail
          curl -fSL --connect-timeout 30 --max-time 1200 --retry 15 --retry-all-errors --retry-delay 60 \
            -o region.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
          IMG=ghcr.io/project-osrm/osrm-backend
          docker run --rm -v "$PWD:/data" $IMG osrm-extract -p /opt/foot.lua /data/region.osm.pbf
          docker run --rm -v "$PWD:/data" $IMG osrm-partition /data/region.osrm
          docker run --rm -v "$PWD:/data" $IMG osrm-customize /data/region.osrm
          docker run -d --name osrm -p 5000:5000 -v "$PWD:/data" $IMG osrm-routed --algorithm mld --max-table-size 1000 /data/region.osrm
          for i in $(seq 1 30); do curl -fs "http://localhost:5000/route/v1/foot/34.78,32.07;34.79,32.08?overview=false" >/dev/null && break; sleep 2; done
          python3 - <<'PY'
          import json, urllib.request
          d=json.load(open('next-station/data.json')); base='http://localhost:5000/table/v1/foot/'; en=0
          for s in d['stops']:
            ps=[p for p in s.get('p',[]) if p.get('la') is not None]
            if not ps or s.get('la') is None: continue
            coords="%s,%s;"%(s['lo'],s['la'])+";".join("%s,%s"%(p['lo'],p['la']) for p in ps)
            try:
              with urllib.request.urlopen(base+coords+"?sources=0&annotations=duration,distance",timeout=15) as r:
                j=json.load(r)
              dur=j['durations'][0]; dis=(j.get('distances') or [[None]*(len(ps)+1)])[0]; k=1
              for p in s['p']:
                if p.get('la') is None: continue
                if dur[k] is not None: p['rt']={'min':max(1,round(dur[k]/60)),'d':round(dis[k]) if k<len(dis) and dis[k] is not None else None}
                k+=1
              en+=1
            except Exception: pass
          # מרחקי הליכה אמיתיים: "הצעות כלליות" (רחובות ראשי/מצטלב/מוצע)
          walked=0
          for s in d['stops']:
            if s.get('la') is None or s.get('k')!='closer': continue
            rds=s.get('roads',{})
            targets=[(k,rds[k]['pt'][1],rds[k]['pt'][0]) for k in ('prim','cur','sug') if rds.get(k) and rds[k].get('pt')]
            if not targets: continue
            coords="%s,%s;"%(s['lo'],s['la'])+";".join("%s,%s"%(x,y) for _,x,y in targets)
            try:
              with urllib.request.urlopen(base+coords+"?sources=0&annotations=duration,distance",timeout=15) as r:
                j=json.load(r)
              dur=j['durations'][0]; dis=(j.get('distances') or [[None]*(len(targets)+1)])[0]
              rw={}
              for i,(k,_,_) in enumerate(targets,1):
                if dur[i] is not None: rw[k]={'min':max(1,round(dur[i]/60)),'d':round(dis[i]) if i<len(dis) and dis[i] is not None else None}
              if rw: s['rw']=rw; walked+=1
            except Exception: pass
          json.dump(d, open('next-station/data.json','w'), ensure_ascii=False, separators=(',',':'))
          print('stops enriched with walking times:', en, '| closer streets walked:', walked)
          PY
          docker rm -f osrm || true

      - name: Commit data.json to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # הריצה ארוכה (~40 דק׳) ו-main עלול לזוז בינתיים — שומרים את הפלט,
          # מתעדכנים ל-main העדכני, מחילים מחדש ודוחפים (עד 4 ניסיונות)
          cp next-station/data.json /tmp/out-data.json
          cp next-station/history.json /tmp/out-hist.json 2>/dev/null || true
          cp next-station/changes.json /tmp/out-chg.json 2>/dev/null || true
          cp next-station/catdiff.json /tmp/out-catd.json 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/out-data.json next-station/data.json
            [ -f /tmp/out-hist.json ] && cp /tmp/out-hist.json next-station/history.json
            [ -f /tmp/out-chg.json ] && cp /tmp/out-chg.json next-station/changes.json
            [ -f /tmp/out-catd.json ] && cp /tmp/out-catd.json next-station/catdiff.json
            git add next-station/data.json next-station/history.json
            git add next-station/changes.json 2>/dev/null || true
            git add next-station/catdiff.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "no change"; break; fi
            git commit -m "monthly: full refresh (GTFS + OSM POI/roads + walking times)"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done

      - name: Refresh osm-poi and osm-roads cache branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan osm-poi-tmp
          git reset
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} +
          cp /tmp/poi.json ./poi.json
          git add -A && git commit -m "OSM POI for Israel (monthly)"
          git push -f origin osm-poi-tmp:osm-poi
          git checkout --orphan osm-roads-tmp
          git reset
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} +
          cp /tmp/roads.json ./roads.json
          git add -A && git commit -m "OSM named roads for Israel (monthly)"
          git push -f origin osm-roads-tmp:osm-roads

# trigger: full monthly refresh — populate real OSRM walking distance for "הצעות כלליות"

# trigger: monthly — villages layer + walking check to the namesake place (צומת ערוגות)

# trigger: monthly rerun — previous run lost its push in a main race (now hardened)
