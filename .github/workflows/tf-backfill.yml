# מילוי ההיסטוריה מארכיון TransitFeeds — 799 צילומים, 2017 עד ינואר 2022.
#
# הריצה נמשכת שעות ולכן היא מפוצלת לחוליות קצרות שממשיכות זו את זו: כל
# חוליה עובדת בתקציב זמן, שומרת את מצבה, דוחפת, ומפעילה את הבאה. אותו
# דפוס של סבבי geo/freq שרצו כאן קודם.
#
# הצילומים עצמם אינם נשמרים — הם היו תופסים עשרות ג'יגה. המנוע זורם
# דרכם, מחזיק בזיכרון רק את המצב האחרון הידוע של כל וריאנט, וכותב אך ורק
# את אירועי השינוי.
name: tf-backfill

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'מספר חוליה'
        default: '1'
        required: false
  push:
    branches: [tf-go]

permissions:
  contents: write
  actions: write

concurrency:
  group: tf-backfill
  # ריצה ממתינה נדחקת החוצה כשמגיעה חדשה באותה קבוצה, ולכן דחיפות
  # תוכן חוזרות ל-tf-go ביטלו חוליות זו את זו. הקבוצה מפוצלת לפי הריצה
  # כדי שחוליה שכבר התחילה לא תיפגע מדחיפה של קוד חדש.
  cancel-in-progress: false

env:
  WORK_BRANCH: claude/industrial-zones-accessibility-site-44h2i9

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/industrial-zones-accessibility-site-44h2i9

      - name: מילוי חוליה אחת
        id: tf
        env:
          FROM: '20170316'
          TO: '20220115'      # מכאן ואילך ארכיון הסדנא מכסה יום-יום
          MAX_MIN: '50'
          OUTDIR: line-history/data
        run: |
          set -o pipefail
          git config user.name tf-bot
          git config user.email actions@users.noreply.github.com
          python3 tools/backfill_tf.py 2>&1 | tee /tmp/tf.log | tail -25
          if grep -q 'אין צילומים שנותרו' /tmp/tf.log; then
            echo "done=1" >> "$GITHUB_OUTPUT"
          else
            echo "done=0" >> "$GITHUB_OUTPUT"
          fi

      # סריקה קלה ונפרדת: route_type קובע אם הקו אוטובוס, רכבת, מונית
      # שירות או "לפי דרישה". שינוי בו אינו נוגע בתחנות ובשרטוט ולכן מנוע
      # ההשוואה הראשי עיוור אליו לגמרי. הקריאה כאן היא של routes.txt בלבד
      # ולכן זולה בהרבה, ומתקדמת מהר יותר מהמילוי המלא.
      - name: סריקת שינויי סיווג
        if: always()
        env:
          FROM: '20170316'
          TO: '20220115'
          MAX_MIN: '10'
          OUTDIR: line-history/data
        run: python3 tools/backfill_mode.py 2>&1 | tail -12 || true

      # ביטול = היעלמות מהפיד. תאריך הביטול נגזר מהצילום האחרון שבו הקו
      # עוד נראה, ולא מיום הריצה — ההבדל בין השניים הגיע ל-3,000 יום.
      # היסטוריית התחנות נבנתה על ארכיון הסדנא ולכן התחילה ב-2022, בעוד
      # היסטוריית הקווים כבר מגיעה ל-2017. stops.txt יושב בכל צילום והוא
      # קל בהרבה מרצפי התחנות, ולכן הסריקה הזו רצה לצד המילוי.
      - name: היסטוריית תחנות מהארכיון
        id: st
        if: always()
        env:
          FROM: '20170316'
          TO: '20220115'
          MAX_MIN: '12'
          OUTDIR: line-history/data
        run: |
          set -o pipefail
          python3 tools/backfill_stops_tf.py 2>&1 | tee /tmp/st.log | tail -8 || true
          if grep -q 'אין צילומים שנותרו' /tmp/st.log; then
            echo "done=1" >> "$GITHUB_OUTPUT"
          else
            echo "done=0" >> "$GITHUB_OUTPUT"
          fi

      - name: סימון קווים שבוטלו לפי מועד ההיעלמות
        if: always()
        env:
          OUTDIR: line-history/data
        run: python3 tools/mark_archive_removed.py 2>&1 | tail -4 || true

      - name: פיד "שינויים לפי יום" לשנות הארכיון
        if: always()
        run: OUTDIR=line-history/data python3 tools/build_archive_months.py 2>&1 | tail -3 || true

      - name: בניית האינדקס מחדש
        if: always()
        run: OUTDIR=line-history/data python3 tools/rebuild_lines_index.py || true

      # הענף מקבל כתיבות גם מהסריקה היומית, ולכן ריבייס מתנגש בקבצי הקווים
      # הוא המצב הרגיל ולא החריג. שני הצדדים מוסיפים אירועים אמיתיים, ולכן
      # ההתנגשות נפתרת באיחוד ברמת הגרסה ולא בבחירת צד.
      #
      # הצעד נכשל ברעש אם הדחיפה לא הצליחה: בגרסה הקודמת הלולאה הסתיימה
      # ב-sleep מוצלח, הצעד דיווח הצלחה, ועבודה של 36 דקות נעלמה בשקט.
      - name: דחיפה
        if: always()
        run: |
          git add line-history/data
          git commit -qm "מילוי TransitFeeds — נקודת ביניים $(date -u +%FT%TZ)" || exit 0
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$WORK_BRANCH"
            if ! git rebase -q origin/"$WORK_BRANCH"; then
              while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                python3 tools/merge_line_conflicts.py || true
                git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
                git diff --name-only --diff-filter=U -z | xargs -0 -r git add -- 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; break; }
              done
            fi
            if git push -q origin HEAD:"$WORK_BRANCH"; then ok=1; break; fi
            sleep $((i * 10))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::הדחיפה נכשלה — עבודת החוליה הזו לא נשמרה ותיעשה שוב"
            exit 1
          fi

      - name: המשכה
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHAIN='${{ github.event.inputs.chain }}'
          CHAIN=${CHAIN:-1}
          # תנאי הסיום חייב לכלול את כל הסריקות. כשהוא בדק את המילוי בלבד,
          # השרשרת נעצרה ברגע שהמילוי הסתיים — וסריקה שנוספה אחריו לא רצה
          # מעולם, בלי שדבר דיווח על כך.
          if [ "${{ steps.tf.outputs.done }}" = "1" ] && [ "${{ steps.st.outputs.done }}" = "1" ]; then
            echo "כל הסריקות הושלמו — סוף השרשרת"
          elif [ "$CHAIN" -lt 200 ]; then
            gh workflow run tf-backfill.yml --repo "$GITHUB_REPOSITORY" \
              --ref tf-go -f chain=$((CHAIN + 1)) || true
          else
            echo "הגיע לגבול החוליות ($CHAIN) — יש להפעיל מחדש ידנית"
          fi
