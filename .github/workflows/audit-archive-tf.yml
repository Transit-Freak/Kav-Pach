name: audit-archive-tf

# הקו בזמן — סריקה צילום-מול-צילום של ארכיון TransitFeeds (2017–2022):
# בדיקה מחדש של כל השינויים, כמו הסריקה היומית של אופן באס.

on:
  schedule:
    - cron: '49 */4 * * *'
  workflow_dispatch:
    inputs:
      max_min:
        description: 'תקציב זמן בדקות'
        required: false
        default: '45'
      dry:
        description: 'גילוי בלבד (1 = בלי כתיבה)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: audit-archive-tf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Audit TransitFeeds snapshots pair-by-pair
        run: |
          set -euo pipefail
          MAX_MIN='${{ github.event.inputs.max_min || '45' }}' \
          DRY='${{ github.event.inputs.dry || '0' }}' \
          OUTDIR=line-history/data python3 tools/audit_archive_tf.py

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add line-history/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: סריקת ארכיון TransitFeeds צילום-מול-צילום — שינויים שלא תועדו נכתבו ביומם"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "קונפליקט מול עדכון מקביל — הריצה הבאה תשלים"
              exit 0
            fi
            echo "retry $i"; sleep 8
          done
          exit 1
