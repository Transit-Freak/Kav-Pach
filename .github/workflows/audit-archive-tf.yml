name: audit-archive-tf

# הקו בזמן — סריקה צילום-מול-צילום של ארכיון TransitFeeds (2017–2022):
# בדיקה מחדש של כל השינויים, כמו הסריקה היומית של אופן באס.

on:
  schedule:
    - cron: '49 */4 * * *'
  workflow_dispatch:
    inputs:
      max_min:
        description: 'תקציב זמן בדקות'
        required: false
        default: '45'
      dry:
        description: 'גילוי בלבד (1 = בלי כתיבה)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: audit-archive-tf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      # צ'אנקים קצרים + דחיפה אחרי כל אחד — קונפליקט מאבד דקות, לא ריצה
      - name: Audit TransitFeeds snapshots (chunks)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TOTAL='${{ github.event.inputs.max_min || '45' }}'
          CH=10
          for c in $(seq 1 $(( (TOTAL + CH - 1) / CH ))); do
            MAX_MIN=$CH DRY='${{ github.event.inputs.dry || '0' }}' \
              OUTDIR=line-history/data python3 tools/audit_archive_tf.py
            git add line-history/data
            if git diff --cached --quiet; then echo "אין שינוי — סוף העבודה"; break; fi
            git commit -m "data: סריקת ארכיון TransitFeeds צילום-מול-צילום — שינויים שלא תועדו נכתבו ביומם"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                git fetch origin main
                git reset --hard origin/main
                echo "קונפליקט — הצ'אנק אבד (עד ~$CH דקות), ממשיכים מבסיס עדכני"
                break
              fi
              echo "retry $i"; sleep 8
            done
          done
