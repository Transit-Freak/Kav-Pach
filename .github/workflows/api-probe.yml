name: api-probe
# בדיקה חד-פעמית של ה-API של הסדנא — אבחון עמוד המפעילה בדאטאבוס.
# טריגר לפי נתיב: כל שינוי בקובץ הזה מריץ את הבדיקה (הקומיט מוחק בסוף).
on:
  push:
    paths:
      - '.github/workflows/api-probe.yml'
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: שאילתות כמו של עמוד המפעילה
        run: |
          B="https://open-bus-stride-api.hasadna.org.il"
          TODAY=$(date -u +%F)
          YDAY=$(date -u -d '1 day ago' +%F)
          W8=$(date -u -d '8 days ago' +%F)
          W7=$(date -u -d '7 days ago' +%F)
          probe() {
            echo "===== $1"
            OUT=$(curl -s --max-time 30 "$2")
            echo "$OUT" | head -c 600
            echo
            echo "-- פריטים: $(echo "$OUT" | python3 -c 'import json,sys
try: print(len(json.load(sys.stdin)))
except Exception as e: print("ERR", e)')"
          }
          probe "agencies אתמול" "$B/gtfs_agencies/list?date_from=$YDAY"
          probe "group_by יומי (אתמול..היום) כמו העמוד" "$B/gtfs_rides_agg/group_by?date_from=$YDAY&date_to=$TODAY&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by לפני שבוע (יום בודד)" "$B/gtfs_rides_agg/group_by?date_from=$W8&date_to=$W7&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by טווח ישן 20-21.07" "$B/gtfs_rides_agg/group_by?date_from=2026-07-20&date_to=2026-07-21&group_by=operator_ref&exclude_hours_from=23&exclude_hours_to=2"
          probe "group_by יומי בלי exclude" "$B/gtfs_rides_agg/group_by?date_from=$YDAY&date_to=$TODAY&group_by=operator_ref"
