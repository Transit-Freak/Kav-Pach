name: fetch-osm-roads

on:
  push:
    paths:
      - '.github/workflows/fetch-osm-roads.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-osm-roads
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Query Overpass for named roads (with geometry)
        run: |
          set -euo pipefail
          # רחובות עם שם + כבישים ממוספרים בלי שם (ref בלבד, דרגות ראשיות) — האחרונים
          # נקראים "כביש N" ומשמשים לזיהוי בלבד (המסווג לעולם לא מציע שם כזה)
          Q='[out:json][timeout:900][bbox:29.4,34.2,33.35,35.95];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|road)$"]["name"];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|motorway_link|trunk_link|primary_link|secondary_link)$"]["ref"][!"name"];);out geom;'
          ok=0
          # השרתים העדכניים קודם (פעמיים, עם המתנה) — מראת mail.ru מפגרת בשעות אחרי עריכות
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== trying $ep =="
            if curl -fsS --max-time 1000 --data-urlencode "data=$Q" "$ep" -o raw.json; then ok=1; echo "got $(wc -c < raw.json) bytes"; break; fi
            echo "failed, next endpoint"; sleep 45
          done
          [ "$ok" = "1" ] || { echo "all overpass endpoints failed"; exit 1; }

      - name: Process to compact roads.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          d=json.load(open('raw.json'))
          out=[]; nref=0
          for e in d.get('elements',[]):
            if e.get('type')!='way': continue
            tags=e.get('tags',{}); name=tags.get('name'); geom=e.get('geometry')
            if not name:
              # כביש ממוספר בלי שם: ref="411" (או "40;411" — לוקחים את הראשון) -> "כביש 411"
              m=re.match(r'\s*(\d+)',str(tags.get('ref','')))
              if m: name='כביש '+m.group(1); nref+=1
            if not name or not geom: continue
            pts=[[round(p['lat'],5),round(p['lon'],5)] for p in geom]
            if len(pts)>=2: out.append({'n':name,'g':pts})
          import datetime
          json.dump({'generated':datetime.date.today().isoformat(),'count':len(out),'roads':out}, open('roads.json','w'), ensure_ascii=False, separators=(',',':'))
          print('roads:', len(out), '| of which numbered-by-ref:', nref)
          PY
          ls -la roads.json

      - name: Push roads.json to osm-roads branch
        run: |
          set -euo pipefail
          cp roads.json /tmp/roads.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan osm-roads
          git reset
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -not -name 'roads.json' -exec rm -rf {} +
          cp /tmp/roads.json ./roads.json
          git add -A
          git commit -m "OSM named roads for Israel"
          git push -f origin osm-roads

# refetch: user named רחוב מורן in ניר גלים on OSM — pick it up

# refetch: retry — Overpass had not yet ingested the מורן edit on the previous run
