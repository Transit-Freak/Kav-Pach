name: probe-industrial

# בדיקה חד-פעמית: מושך את כל אזורי-התעשייה הרשמיים מ-data.gov.il (CKAN datastore),
# ממיר את הגאומטריה מ-ITM (רשת ישראל, EPSG:2039) ל-WGS84, ומוציא official-zones.json
# עם מרכז (la/lo) + נתונים (עובדים/שטח/מחוז). דוחף ל-probe-industrial-out.

on:
  push:
    paths:
      - '.github/workflows/probe-industrial.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-industrial
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pyproj (המרת ITM→WGS84)
        run: python3 -m pip install --quiet pyproj
      - name: Pull ALL industrial-zones + convert coords
        run: |
          set +e
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          from pyproj import Transformer
          out=[]
          def log(s): print(s); out.append(str(s))
          RID="30af8da4-7586-4b00-ac88-c5ee75251632"
          BASE="https://data.gov.il/api/3/action/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          # EPSG:2039 = Israeli TM Grid (ITM). always_xy → (easting,northing)->(lon,lat)
          TR=Transformer.from_crs("EPSG:2039","EPSG:4326",always_xy=True)

          def get(url):
              req=urllib.request.Request(url, headers={"user-agent":UA,"accept":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          u=BASE+"datastore_search?"+urllib.parse.urlencode({"resource_id":RID,"limit":1000})
          j=get(u); res=j.get("result",{}); recs=res.get("records",[])
          log("=== רשימת אזורי תעשייה רשמית — %d רשומות ==="%len(recs))
          zones=[]
          for rec in recs:
              geom=rec.get("geom") or ""
              nums=[float(x) for x in re.findall(r'-?\d+\.?\d*', geom)]
              la=lo=None
              if len(nums)>=4:
                  xs=nums[0::2]; ys=nums[1::2]   # ITM easting,northing pairs
                  cx=sum(xs)/len(xs); cy=sum(ys)/len(ys)
                  lo,la=TR.transform(cx,cy)       # -> lon,lat
              z={"name":rec.get("alina_name"),"eng":rec.get("alina_eng_name"),
                 "district":rec.get("district"),
                 "avail":rec.get("available_space"),"occ":rec.get("occupied_space"),
                 "cur_emp":rec.get("current_employees"),"fut_emp":rec.get("future_employees"),
                 "open":rec.get("open_to_market"),
                 "la":round(la,5) if la else None,"lo":round(lo,5) if lo else None}
              zones.append(z)
              log("  %-28s | %-10s | עובדים:%s | פנוי:%s מ\"ר | %s"%(
                  str(z["name"])[:28], z["district"], z["cur_emp"], z["avail"],
                  ("%.4f,%.4f"%(z["la"],z["lo"])) if z["la"] else "אין geom"))
          nogeo=sum(1 for z in zones if z["la"] is None)
          log("")
          log("סה\"כ: %d | בלי גאומטריה תקינה: %d"%(len(zones),nogeo))
          json.dump(zones, open("official-zones.json","w"), ensure_ascii=False, indent=1)
          open("probe-industrial.txt","w").write("\n".join(out))
          PY
          ls -la official-zones.json probe-industrial.txt 2>/dev/null || true
      - name: Push results
        run: |
          set -euo pipefail
          cp probe-industrial.txt /tmp/r.txt 2>/dev/null || echo "no report">/tmp/r.txt
          cp official-zones.json /tmp/z.json 2>/dev/null || echo '[]'>/tmp/z.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-ind-tmp; git reset
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} +
          cp /tmp/r.txt probe-industrial.txt; cp /tmp/z.json official-zones.json
          git add -A; git commit -m "probe: official industrial zones + WGS84 centroids from data.gov.il"
          git push -f origin probe-ind-tmp:probe-industrial-out
