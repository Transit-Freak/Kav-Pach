name: backfill-stops

# "הקו בזמן" — שלב ב' של המילוי-לאחור: רצפי תחנות היסטוריים לגרסאות-עבר
# מארכיון אופן באס (הסדנא לידע ציבורי). בטוח להרצה חוזרת — ממשיך מהנקודה
# שבה עצר (גרסאות שמולאו מדולגות). רץ לילה-לילה עד שנגמרות המטרות.

on:
  schedule:
    # שלושה חלונות קצרים במקום ריצת-ענק אחת: כל חלון דוחף את ממצאיו מיד,
    # והמונים באתר מטפסים לאורך הלילה (בקשת שלמה: עדכון עם כל מציאה)
    - cron: '15 0 * * *'   # 03:15 ישראל
    - cron: '15 2 * * *'   # 05:15
    - cron: '15 4 * * *'   # 07:15
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-stops.yml'
      - 'tools/backfill_stops.py'
      - 'tools/backfill_stops_registry.py'
      - 'tools/backfill_stop_anchors.py'
      - 'tools/backfill_stop_dates.py'
      - 'tools/enrich_stop_diffs.py'
      - 'tools/enrich_stop_lines.py'
      - 'tools/rebuild_lines_index.py'
  workflow_dispatch:
    inputs:
      regmax:
        description: 'תקציב דקות לרישום ההיסטורי (ברירת מחדל 80)'
        required: false
        default: ''
      regonly:
        description: 'ריצת רישום-בלבד (1 = לדלג על שאר השלבים)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) לא תתפוס את מקומה של ריצת main שממתינה בתור
  group: backfill-stops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Historical stops registry (weekly snapshots)
        run: |
          set -euo pipefail
          # בקנרית מגבילים גם את הרישום הארצי לטעימה קצרה
          MAXMIN="${{ inputs.regmax || '80' }}"
          [ -z "$MAXMIN" ] && MAXMIN=80
          [ -f line-history/data/.stops-canary ] && MAXMIN=3
          OUTDIR=line-history/data PAUSE=0.35 MAX_MIN=$MAXMIN \
            python3 tools/backfill_stops_registry.py

      - name: Fill historical stop sequences from Stride
        if: ${{ inputs.regonly != '1' }}
        run: |
          set -euo pipefail
          # קובץ קנרית: מספר מטרות מוגבל לבדיקה ראשונה, נמחק אחרי שימוש
          MAXT=0
          if [ -f line-history/data/.stops-canary ]; then
            MAXT=$(cat line-history/data/.stops-canary)
          fi
          echo "MAX_TARGETS=$MAXT"
          OUTDIR=line-history/data PAUSE=0.35 MAX_MIN=50 MAX_TARGETS=$MAXT \
            python3 tools/backfill_stops.py
          rm -f line-history/data/.stops-canary

      - name: עוגני ארכיון לקווים שקטים (בלי אף אירוע רישום מאז 2022)
        if: ${{ inputs.regonly != '1' }}
        run: |
          OUTDIR=line-history/data PAUSE=0.35 MAX_MIN=20 \
            python3 tools/backfill_stop_anchors.py

      - name: הפרשי תחנות בין גרסאות שמולאו (מקומי, בלי רשת)
        run: OUTDIR=line-history/data python3 tools/enrich_stop_diffs.py

      - name: אילו קווים עצרו בכל תחנה בתקופת האירוע (מקומי, בלי רשת)
        run: OUTDIR=line-history/data python3 tools/enrich_stop_lines.py

      - name: איתור תאריך לשינויי תחנות — חיפוש בינארי בארכיון
        if: ${{ inputs.regonly != '1' }}
        run: |
          OUTDIR=line-history/data PAUSE=0.35 MAX_MIN=25 \
            python3 tools/backfill_stop_dates.py

      - name: Commit (לענף שהריץ)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f line-history/data/.stops-canary
          # מיזוג לפי קבצים במקום העתקת התיקייה כולה: נשמרים רק הקבצים
          # שהריצה הזו שינתה ביחס לבסיס שלה; קובץ שהשתנה בינתיים גם ב-origin
          # — origin גובר (המידע החדש יותר) והריצה הבאה תשלים מחדש.
          # העתקת-הכל דרסה קומיטים שנחתו בזמן שהריצה רצה (28.07 — פעמיים).
          BASE=$(git rev-parse HEAD)
          git add -A line-history/data
          git diff --cached --name-only --diff-filter=d -z "$BASE" -- line-history/data > /tmp/bs-changed
          git diff --cached --name-only --diff-filter=D -z "$BASE" -- line-history/data > /tmp/bs-deleted
          rm -rf /tmp/bs-out && mkdir -p /tmp/bs-out
          xargs -0 -r -I{} cp --parents {} /tmp/bs-out/ < /tmp/bs-changed
          for i in 1 2 3 4; do
            git fetch origin "$BR" && git reset --hard "origin/$BR"
            cp -r /tmp/bs-out/. .
            xargs -0 -r rm -f -- < /tmp/bs-deleted
            git diff --name-only -z "$BASE" "origin/$BR" -- line-history/data > /tmp/bs-theirs
            while IFS= read -r -d '' f; do
              git checkout "origin/$BR" -- "$f" 2>/dev/null || rm -f -- "$f"
            done < /tmp/bs-theirs
            OUTDIR=line-history/data python3 tools/enrich_stop_diffs.py
            OUTDIR=line-history/data python3 tools/rebuild_lines_index.py
            git add -A line-history/data
            if git diff --cached --quiet; then
              echo "unchanged"; break; fi
            git commit -m "data: שלב ב' — רצפי תחנות היסטוריים מארכיון אופן באס"
            if git push origin HEAD:"$BR"; then break; fi
            echo "push rejected — retry $i"; sleep 10
          done
