name: probe-tlv-terms

# שאלת שלמה: לא רואים תנאי שימוש ב-GIS של עיריית תל אביב — יש בכלל כאלה?
# חשוב כי הפיילוט של הסככות מאמן מודל על האורתופוטו שלהם, ותנאי govmap
# אוסרים בדיוק את זה. צריך לדעת מה תל אביב אומרת.
# שני מקומות לחפש: שדות הרישוי שמוטמעים במטא-דאטה של ArcGIS עצמה
# (copyrightText / licenseInfo / documentInfo), ועמודי התנאים של האתרים.
# לא כותב כלום לריפו; הממצאים בלוג הריצה.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: שדות הרישוי במטא-דאטה של שירותי ArcGIS
        run: |
          meta() {
            echo "=== $1"
            curl -sk --max-time 30 "$1" -H 'User-Agent: Mozilla/5.0' | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('לא JSON:',e); raise SystemExit
          keys=['serviceDescription','description','copyrightText','licenseInfo',
                'documentInfo','mapName','name','capabilities','maxRecordCount']
          for k in keys:
              v=d.get(k)
              if v not in (None,'',{},[]):
                  print(f'  {k} = {json.dumps(v,ensure_ascii=False)[:900]}')
          if not any(d.get(k) for k in ('copyrightText','licenseInfo')):
              print('  ** אין copyrightText ואין licenseInfo **')
          " || echo '  (כשל)'
            echo "---"
          }
          meta "https://gisn.tel-aviv.gov.il/arcgis/rest/services/WM/IView2Ortho2025WM/MapServer?f=json"
          meta "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer?f=json"
          meta "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2MapHeb/MapServer/24?f=json"
          meta "https://gisn.tel-aviv.gov.il/arcgis/rest/services?f=json"
          meta "https://gisn.tel-aviv.gov.il/arcgis/rest/info?f=json"

      - name: חיפוש קישורי "תנאי שימוש" בעמודי המפה והדאטה הפתוחה
        run: |
          scan() {
            echo "=== $1"
            code=$(curl -sk -o /tmp/p.html -w '%{http_code}' --max-time 30 \
                   -H 'User-Agent: Mozilla/5.0' "$1")
            echo "  HTTP $code · $(wc -c </tmp/p.html) בתים"
            python3 - <<'PY'
          import re,html
          t=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          pat=r'(תנאי[^<"\']{0,25}שימוש|תקנון|זכויות יוצרים|רישיון|terms|licen[sc]e|copyright|disclaimer)'
          seen=set()
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',t,re.S|re.I):
              href,txt=m.group(1),re.sub(r'<[^>]+>','',m.group(2))
              txt=html.unescape(txt).strip()
              if re.search(pat,href+' '+txt,re.I) and (href,txt) not in seen:
                  seen.add((href,txt)); print('  קישור:',txt[:60],'->',href[:130])
          for m in re.finditer(pat,t,re.I):
              s=max(0,m.start()-90); frag=re.sub(r'<[^>]+>',' ',t[s:m.end()+150])
              frag=' '.join(html.unescape(frag).split())
              if frag not in seen:
                  seen.add(frag); print('  אזכור:',frag[:220])
          if len(seen)==0: print('  ** לא נמצא שום אזכור של תנאים/רישיון/זכויות **')
          PY
            echo "---"
          }
          scan "https://opendata.tel-aviv.gov.il/"
          scan "https://gisn.tel-aviv.gov.il/iview2js4/index.aspx"
          scan "https://www5.tel-aviv.gov.il/tlv4u/gis/"
          scan "https://www.tel-aviv.gov.il/Pages/HomePage.aspx"

      - name: עמודי תנאים אפשריים — האם קיימים בכלל
        run: |
          t() {
            code=$(curl -sk -o /tmp/t.html -w '%{http_code}' --max-time 25 \
                   -H 'User-Agent: Mozilla/5.0' "$1")
            echo "HTTP $code  $(wc -c </tmp/t.html | tr -d ' ') בתים  $1"
            if [ "$code" = "200" ]; then
              python3 -c "
          import re,html,sys
          t=open('/tmp/t.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S|re.I)
          t=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',t)).split())
          print('   ',t[:700])"
            fi
          }
          t "https://opendata.tel-aviv.gov.il/Pages/terms.aspx"
          t "https://opendata.tel-aviv.gov.il/terms"
          t "https://www.tel-aviv.gov.il/Pages/TermsOfUse.aspx"
          t "https://www.tel-aviv.gov.il/Pages/Terms.aspx"
          t "https://www.tel-aviv.gov.il/Pages/Takanon.aspx"
          t "https://www.tel-aviv.gov.il/Pages/privacy.aspx"
          t "https://gisn.tel-aviv.gov.il/robots.txt"
          t "https://opendata.tel-aviv.gov.il/robots.txt"
          t "https://www.tel-aviv.gov.il/robots.txt"

      - name: הרישיון המלא של TLV Open Data — טקסט מלא
        run: |
          full() {
            echo "════════ $1"
            code=$(curl -sk -o /tmp/f.html -w '%{http_code}' --max-time 30 \
                   -H 'User-Agent: Mozilla/5.0' -H 'Accept-Language: he,en' "$1" \
                   || echo 000)
            echo "HTTP $code · $(wc -c </tmp/f.html | tr -d ' ') בתים"
            [ "$code" = "200" ] || { echo; return; }
            python3 -c "
          import re,html
          t=open('/tmp/f.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>|<!--.*?-->','',t,flags=re.S|re.I)
          t=re.sub(r'</(p|div|li|tr|h[1-6]|br)>','\n',t,flags=re.I)
          t=re.sub(r'<br\s*/?>','\n',t,flags=re.I)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t))
          t='\n'.join(' '.join(l.split()) for l in t.split('\n'))
          t=re.sub(r'\n{3,}','\n\n',t).strip()
          print(t[:9000])
          import sys
          pat=r'(לימוד מכונה|בינה מלאכותית|אלגוריתם|גירוד|כריי|scrap|machine learn|artificial intel|crawl|robot|אוטומט|מסחרי|commercial|קרדיט|credit|ייחוס|attribut)'
          hits=[m.group(0) for m in re.finditer(pat,t,re.I)]
          print('\n>>> מילות מפתח שנמצאו:', sorted(set(hits)) or 'אין')
          "
            echo
          }
          full "https://opendatasource.tel-aviv.gov.il/he/Pages/FAQ.aspx"
          full "https://opendata.tel-aviv.gov.il/he/Pages/FAQ.aspx"
          full "https://opendata.tel-aviv.gov.il/en/pages/faq.aspx"
          full "https://apiportal.tel-aviv.gov.il/"
          # תנאי השימוש הכלליים של אתר העירייה — הקישור נמצא בתחתית העמוד הראשי
          full "https://www.tel-aviv.gov.il/About/Pages/TermsofService.aspx"
          # בצופה המפות עצמו יש דיאלוג תנאים (spnTerms/imgTerms) — מאיפה הטקסט?
          full "https://gisn.tel-aviv.gov.il/iview2js4/Terms.aspx"
          full "https://gisn.tel-aviv.gov.il/iview2js4/terms.htm"
          full "https://gisn.tel-aviv.gov.il/iview2js4/Terms.html"

      - name: הטקסט של דיאלוג התנאים בתוך צופה המפות
        run: |
          curl -sk --max-time 30 -H 'User-Agent: Mozilla/5.0' \
            "https://gisn.tel-aviv.gov.il/iview2js4/index.aspx" -o /tmp/v.html
          python3 - <<'PY'
          import re, html
          t = open('/tmp/v.html', encoding='utf-8', errors='replace').read()
          # הבלוק סביב spnTerms — הטקסט המשפטי אמור לשבת שם או בקובץ שהוא טוען
          for key in ('spnTerms', 'imgTerms', 'Terms'):
              for m in re.finditer(key, t):
                  s = max(0, m.start() - 400)
                  frag = t[s:m.end() + 1500]
                  txt = ' '.join(html.unescape(re.sub(r'<[^>]+>', ' ', frag)).split())
                  if len(txt) > 60:
                      print(f'── {key} @{m.start()}:'); print('  ', txt[:800]); print()
                  break
          print('── קבצים שהעמוד טוען ובשמם terms/תנאים:')
          for m in re.finditer(r'["\']([^"\']*(?:erms|akanon|licen)[^"\']*)["\']', t):
              print('  ', m.group(1)[:160])
          PY

      - name: הסעיפים עצמם בתנאי אתר העירייה — הקשר סביב כל מילת מפתח
        run: |
          curl -sk --max-time 30 -H 'User-Agent: Mozilla/5.0' \
            "https://www.tel-aviv.gov.il/About/Pages/TermsofService.aspx" -o /tmp/g.html || true
          python3 - <<'PY'
          import re, html
          t = open('/tmp/g.html', encoding='utf-8', errors='replace').read()
          t = re.sub(r'<script.*?</script>|<style.*?</style>|<!--.*?-->', '', t, flags=re.S | re.I)
          t = re.sub(r'</(p|div|li|tr|h[1-6])>', '\n', t, flags=re.I)
          t = re.sub(r'<br\s*/?>', '\n', t, flags=re.I)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          lines = [' '.join(l.split()) for l in t.split('\n')]
          lines = [l for l in lines if len(l) > 40]      # לסנן פריטי תפריט
          pat = (r'(לימוד מכונה|בינה מלאכותית|אלגוריתם|גירוד|כריי|scrap|machine learn'
                 r'|artificial intel|crawl|robot|אוטומט|מסחרי|commercial|קרדיט|credit'
                 r'|ייחוס|attribut|זכויות יוצרים|העתק|שכפול|כריית|בוט)')
          hits = [l for l in lines if re.search(pat, l, re.I)]
          print(f'שורות תוכן: {len(lines)} · מתוכן עם מילות מפתח: {len(hits)}\n')
          for i, l in enumerate(hits, 1):
              print(f'[{i}] {l}\n')
          PY

      - name: מנוע החיפוש של אתר העירייה — "תנאי שימוש"
        run: |
          curl -sk --max-time 30 -H 'User-Agent: Mozilla/5.0' \
            "https://www.tel-aviv.gov.il/_api/search/query?querytext='%D7%AA%D7%A0%D7%90%D7%99%20%D7%A9%D7%99%D7%9E%D7%95%D7%A9'&rowlimit=10" \
            -H 'Accept: application/json;odata=verbose' | head -c 1500 || true
          echo; echo '---'
