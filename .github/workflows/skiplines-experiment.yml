name: skiplines-experiment

# "הקו המדלג" (ניסיוני): זיהוי קווים עירוניים שחולפים ליד תחנה פעילה בלי לעצור בה
# (ירושלים + תל אביב). מדפיס ממצאים ליומן וכותב skip-stops/data.json לאתר.

on:
  push:
    paths:
      - '.github/workflows/skiplines-experiment.yml'
      - 'tools/skiplines.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skiplines-experiment
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1200 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt
          ls -la

      - name: Detect skipped stops (Jerusalem + Tel Aviv)
        run: |
          set -euo pipefail
          # סוגי הקווים מהקובץ המצומצם שכבר בריפו (data-main.json — אותו קובץ שקו פח מציג)
          STOPS=stops.txt STOP_TIMES=stop_times.txt TRIPS=trips.txt ROUTES=routes.txt SHAPES=shapes.txt \
            MAIN=data-main.json CITIES="ירושלים,תל אביב יפו" OUT=skip-stops/data.json python3 tools/skiplines.py

      - name: Commit data.json to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main עלול לזוז בזמן הריצה — שומרים פלט, מתעדכנים, מחילים ודוחפים (עם ניסיונות חוזרים)
          cp skip-stops/data.json /tmp/out-skip.json
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/out-skip.json skip-stops/data.json
            git add skip-stops/data.json
            if git diff --cached --quiet; then
              echo "data unchanged — nothing to commit"; break; fi
            git commit -m "skip-stops: refresh findings (Jerusalem + Tel Aviv)"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done
