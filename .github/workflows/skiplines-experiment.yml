name: skiplines-experiment

# "הקו המדלג" (ניסיוני): זיהוי קווים עירוניים שחולפים ליד תחנה פעילה בלי לעצור בה
# (כל הארץ). מדפיס ממצאים ליומן וכותב skip-stops/data.json לאתר.

on:
  # צינור מאוחד: נדלק בסיום הריצה היומית של "הקו בזמן" (10:30 ישראל)
  # ומשתמש ב-GTFS שהיא כבר הורידה — בלי הורדה כפולה ובלי לו"ז נפרד.
  workflow_run:
    workflows: ["line-history"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/skiplines-experiment.yml'
      - 'tools/skiplines.py'
      - 'tools/overlap.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # מחיקת ה-GTFS המשותף אחרי ששני הצינורות סיימו

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: skiplines-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    # גם כשהצינור הראשי נכשל — הנסיגה מורידה את הפיד ישירות; מדלגים רק על ביטול ידני
    if: (github.ref == 'refs/heads/main' || github.event_name != 'push') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: ה-GTFS שכבר ירד בצינור המאוחד
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gtfs-daily
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fetch GTFS (הורדה ישירה רק אם אין קובץ מהצינור)
        run: |
          set -euo pipefail
          if [ -f gtfs.zip ]; then
            echo "משתמשים ב-GTFS מהצינור המאוחד"
          else
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
            curl -fSL --connect-timeout 20 --max-time 1200 --retry 15 --retry-all-errors --retry-delay 60 -A "$UA" \
              -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          fi
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt agency.txt
          ls -la

      - name: Detect skipped stops (nationwide)
        run: |
          set -euo pipefail
          # סוגי הקווים מהקובץ המצומצם שכבר בריפו (data-main.json — אותו קובץ שקו פח מציג)
          STOPS=stops.txt STOP_TIMES=stop_times.txt TRIPS=trips.txt ROUTES=routes.txt SHAPES=shapes.txt \
            MAIN=data-main.json AGENCY=agency.txt CITIES=ALL \
            OUT=skip-stops/data.json OUT2=skip-stops/data-inter.json python3 tools/skiplines.py

      - name: Route overlap for kav-pach (same GTFS)
        run: |
          set -euo pipefail
          TRIPS=trips.txt STOP_TIMES=stop_times.txt ROUTES=routes.txt \
            OUT=kavpach-overlap.json python3 tools/overlap.py

      - name: Commit data.json to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt agency.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main עלול לזוז בזמן הריצה — שומרים פלט, מתעדכנים, מחילים ודוחפים (עם ניסיונות חוזרים)
          cp skip-stops/data.json /tmp/out-skip.json
          cp skip-stops/data-inter.json /tmp/out-skip2.json 2>/dev/null || true
          cp kavpach-overlap.json /tmp/out-ovl.json 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/out-skip.json skip-stops/data.json
            [ -f /tmp/out-skip2.json ] && cp /tmp/out-skip2.json skip-stops/data-inter.json
            [ -f /tmp/out-ovl.json ] && cp /tmp/out-ovl.json kavpach-overlap.json
            git add skip-stops/data.json
            git add skip-stops/data-inter.json 2>/dev/null || true
            git add kavpach-overlap.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "data unchanged — nothing to commit"; break; fi
            git commit -m "data: refresh skip-stops findings + route overlap"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done

      - name: מחיקת ה-GTFS המשותף — רק אחרי ששני הצינורות סיימו ותיעדו
        if: github.event_name == 'workflow_run' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_RUN: ${{ github.event.workflow_run.id }}
          SRC_START: ${{ github.event.workflow_run.run_started_at }}
          OTHER: update-weekly.yml
        run: |
          # בטיחות: קובץ הביניים נמחק רק כששני הצינורות שניזונים ממנו סיימו
          # בהצלחה את כל העיבוד ודחפו את התוצרים. מי שמסיים שני מוחק; בכל
          # מצב אחר הקובץ נשאר, ונמחק ממילא לבד אחרי יום.
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$OTHER/runs?event=workflow_run&per_page=1" \
                 --jq '.workflow_runs[0] | .created_at+" "+.status+" "+(.conclusion//"-")' 2>/dev/null || echo "")
          echo "הצינור השני: ${info:-לא נמצא}"
          [ -n "$info" ] || { echo "אין מידע — לא מוחקים"; exit 0; }
          created=${info%% *}; rest=${info#* }
          [ "$rest" = "completed success" ] || { echo "השני עוד לא סיים בהצלחה — לא מוחקים"; exit 0; }
          { [ "$created" \> "$SRC_START" ] || [ "$created" = "$SRC_START" ]; } || { echo "הריצה שנמצאה ישנה מהלילה — לא מוחקים"; exit 0; }
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SRC_RUN/artifacts" \
                --jq '.artifacts[] | select(.name=="gtfs-daily") | .id' 2>/dev/null || true)
          [ -n "$ids" ] || { echo "אין artifact למחוק"; exit 0; }
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null && echo "נמחק gtfs-daily ($id)"; done

# retry: MOT GTFS endpoint timeout at 08:55Z
