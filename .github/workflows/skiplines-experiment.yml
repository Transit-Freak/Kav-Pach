name: skiplines-experiment

# ניסוי בלבד: זיהוי קווים עירוניים שחולפים ליד תחנה פעילה בלי לעצור בה
# (ירושלים + תל אביב). מדפיס ממצאים ליומן — לא נוגע באתר ולא דוחף כלום.

on:
  push:
    paths:
      - '.github/workflows/skiplines-experiment.yml'
      - 'tools/skiplines.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skiplines-experiment
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GTFS + ClusterToLine (line types)
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1200 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt shapes.txt
          curl -fSL --connect-timeout 20 --max-time 300 --retry 3 --retry-all-errors -A "$UA" \
            -o cluster.zip "https://gtfs.mot.gov.il/gtfsfiles/ClusterToLine.zip" || echo "cluster download failed (optional)"
          unzip -o cluster.zip || true
          ls -la

      - name: Detect skipped stops (Jerusalem + Tel Aviv)
        run: |
          set -euo pipefail
          CL=$(ls *luster*.[cC][sS][vV] 2>/dev/null | head -1 || true)
          echo "cluster file: ${CL:-none}"
          STOPS=stops.txt STOP_TIMES=stop_times.txt TRIPS=trips.txt ROUTES=routes.txt SHAPES=shapes.txt \
            CLUSTER="$CL" CITIES="ירושלים,תל אביב יפו" python3 tools/skiplines.py

# retry: MOT GTFS endpoint timeout at 15:27Z
