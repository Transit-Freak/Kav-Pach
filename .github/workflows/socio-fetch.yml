# שליפה חד-פעמית של המדד החברתי-כלכלי (למ"ס, דרך data.gov.il) —
# רץ על runner כי לסביבת הפיתוח אין גישת רשת לדומיין.
# הפלט נדחף לענף socio-data.
name: socio-fetch
on:
  workflow_dispatch:
  push:
    branches: [socio-go]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: שליפה ודחיפה
        run: |
          set -e
          pip -q install openpyxl xlrd
          sudo apt-get -qq install -y gdal-bin >/dev/null
          python3 tools/fetch_socio.py
          # האשכול לפי אזור סטטיסטי — תוספת; כישלון שלה לא מפיל את היישובי
          python3 tools/fetch_socio_sa.py || echo "שליפת האזורים הסטטיסטיים נכשלה"
          git config user.name socio-bot
          git config user.email actions@users.noreply.github.com
          git add parks/data/socio.json
          if [ -f parks/data/socio-sa.json ]; then git add parks/data/socio-sa.json; fi
          if [ -f parks/data/socio-sa-polys.json ]; then git add parks/data/socio-sa-polys.json; fi
          # כשאין שינוי (הנתונים כבר על main) commit ריק נכשל — לא מפילים את הריצה
          git diff --cached --quiet || git commit -m "נתוני המדד החברתי-כלכלי (למ\"ס)"
          git push -f origin HEAD:socio-data
