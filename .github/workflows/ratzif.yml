name: ratzif

# רציף כפול — שני קווים שיוצאים מאותו רציף מוצא באותה דקה (בקשת שלמה).
# רץ לילית על ה-GTFS של אתמול מהארכיון; מעדכן ratzif/data/conflicts.json.

on:
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: איתור התנגשויות
        run: python3 tools/ratzif_conflicts.py
      - name: דחיפה
        run: |
          git config user.name kav-bochan-bot
          git config user.email bot@users.noreply.github.com
          git add ratzif/data
          git diff --cached --quiet && { echo "אין שינוי"; exit 0; }
          git commit -m "רציף כפול: עדכון לילי"
          for i in 1 2 3 4; do git push && exit 0; git pull --rebase && continue; done
          git push
