name: report

# הדו"ח של איריס (parks/REPORT-SPEC.md): מסמך Word שנבנה מהנתונים החיים —
# נתונים ותרשימים בפייתון, מפות על אריחי OSM (רק כאן, הסביבה המקומית חוסמת),
# המסמך ב-docx (npm), ותצוגה מקדימה ב-PDF דרך LibreOffice.
# הרצה ידנית, או אחרי בנייה של parks-access כשמבקשים.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Python deps
        run: pip install --quiet matplotlib pillow python-bidi pymupdf

      - name: נתונים + תרשימים
        run: python3 tools/report_data.py

      - name: מפות על רקע OSM (כמות קטנה, קרדיט על המפה)
        run: python3 tools/report_maps.py

      - name: Word
        run: |
          npm install --no-audit --no-fund --silent docx@9
          node tools/report_docx.mjs

      - name: PDF לתצוגה מקדימה (LibreOffice)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer python3-uno fonts-dejavu >/dev/null
          # דרך UNO כדי שתוכן העניינים יתמלא; נופל להמרה רגילה אם אין חיבור
          /usr/bin/python3 tools/report_pdf.py "parks/report/נגישות-אזורי-תעשייה.docx" || echo "PDF failed"
          ls -la parks/report/*.pdf 2>/dev/null || true
          # תמונות העמודים הראשונים — כדי לראות בלוג/בריפו איך זה יצא
          python3 - <<'PY'
          import pymupdf, pathlib
          p = pathlib.Path('parks/report/נגישות-אזורי-תעשייה.pdf')
          if p.exists():
              d = pymupdf.open(p); print('עמודים:', len(d))
              out = pathlib.Path('parks/report/preview'); out.mkdir(exist_ok=True)
              for f in out.glob('*.png'): f.unlink()
              for i, pg in enumerate(d):
                  if i < 40: pg.get_pixmap(dpi=60).save(out / f'p{i+1:02d}.png')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf node_modules package.json package-lock.json
          git add parks/report
          git diff --cached --quiet && { echo unchanged; exit 0; }
          git commit -m "report: הדו\"ח של איריס — נבנה מהנתונים החיים"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main || { git rebase --abort; break; }
          done
