name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם קיים ב-data.gov.il מידע על אוטובוסים
# ממוגני ירי — מאגר ייעודי או שדה מיגון במאגרי הרכב. קריאה בלבד,
# לעולם לא נכשלת (בלי מיילים אדומים) — הממצאים בלוג.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: מה האתר החי מגיש — צי הרכבים
        run: |
          set -uo pipefail
          H=$(curl -fsS -H 'Cache-Control: no-cache' "https://transit-freak.github.io/kav-bochan/fleet/index.html?cb=$RANDOM")
          echo "bytes: $(echo "$H" | wc -c)"
          echo "$H" | grep -o "FLEET_BUILD='[0-9]*'" || echo "אין FLEET_BUILD — עמוד ישן!"
          echo "$H" | grep -c "הכי מקולקלים" && echo "כפתור המקולקלים: קיים" || echo "כפתור המקולקלים: חסר!"
          echo "$H" | grep -c "loadGaps" && echo "קוד הנפילות: קיים" || echo "קוד הנפילות: חסר!"
          curl -fsS "https://transit-freak.github.io/kav-bochan/fleet/data/fleet-gaps.json?cb=$RANDOM" | head -c 120 && echo && echo "fleet-gaps.json: מוגש"
