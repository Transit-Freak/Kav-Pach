name: probe-publisher

# חיפוש עמוד רשמי עם הסבר מדדי השירות ואימותו בדפדפן. דוח ללוג בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Search catalog for madadey shirut
        run: |
          set -euo pipefail
          curl -fsS 'https://data.gov.il/api/3/action/package_search?q=%D7%9E%D7%93%D7%93%D7%99%20%D7%A9%D7%99%D7%A8%D7%95%D7%AA&rows=8' -o s.json
          python3 - <<'PY'
          import json
          d = json.load(open('s.json'))['result']
          print('matches:', d.get('count'))
          for p in d.get('results', []):
              org = (p.get('organization') or {}).get('name')
              print('-', p.get('title'), '| https://data.gov.il/datasets/%s/%s' % (org, p.get('name')))
          PY

      - name: Verify top candidates in browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium 2>/dev/null | tail -1
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          d = json.load(open('s.json'))['result']
          urls = ['https://data.gov.il/datasets/%s/%s' % ((p.get('organization') or {}).get('name'), p.get('name'))
                  for p in d.get('results', [])[:3]]
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              pg = b.new_page(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36')
              for url in urls:
                  try:
                      pg.goto(url, wait_until='networkidle', timeout=45000)
                  except Exception as e:
                      print(url, '-> goto error:', str(e)[:90])
                  pg.wait_for_timeout(2500)
                  print('=== URL:', url)
                  print('  title:', pg.title())
                  print('  body:', pg.inner_text('body')[:220].replace('\n', ' | '))
              b.close()
          PY
