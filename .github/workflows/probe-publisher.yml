name: probe-publisher

# בדיקה מול ארכיון אופן באס: האם רצף התחנות של קו 26 שדרות (30026)
# השתנה במהלך הקיץ — דוח ללוג בלבד, שום כתיבה.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:
    inputs:
      dates:
        description: 'תאריכים מופרדי-פסיק לדגימה'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Sample line 26 Sderot stop sequences across archive days
        run: |
          set -euo pipefail
          DATES='${{ github.event.inputs.dates || '' }}' python3 - <<'PY'
          import os, sys, json
          sys.path.insert(0, 'tools')
          from backfill_change_dates import day_sigs_cal
          from compact_lines import materialize
          RDS = ['30026-1-#', '30026-2-#']
          # הרצפים המתועדים אצלנו (צילום 01.05) — הבסיס להשוואה
          ref = {}
          for rd, f in (('30026-1-#', '30026-1-H'), ('30026-2-#', '30026-2-H')):
              d = materialize(json.load(open(f'line-history/data/lines/{f}.json', encoding='utf-8')))
              vs = [v for v in sorted(d['versions'], key=lambda v: v['d']) if v.get('stops')]
              ref[rd] = tuple(str(s[0]) for s in vs[-1]['stops']) if vs else ()
              print(f'{rd}: מתועד אצלנו {len(ref[rd])} תחנות (גרסת {vs[-1]["d"] if vs else "?"})')
          dates = [x for x in (os.environ.get('DATES') or '').split(',') if x] or [
              '2026-05-02', '2026-05-20', '2026-06-10', '2026-07-01', '2026-07-15', '2026-07-24']
          for ds in dates:
              try:
                  sigs = day_sigs_cal(ds, RDS)
              except (Exception, SystemExit) as e:
                  print(f'{ds}: שגיאה {type(e).__name__}: {e}')
                  continue
              for rd in RDS:
                  sig = sigs.get(rd)
                  if sig is None:
                      print(f'{ds} {rd}: אין נסיעות בתוקף בצילום')
                      continue
                  same = 'זהה למתועד' if sig == ref[rd] else 'שונה!'
                  extra = ''
                  if sig != ref[rd]:
                      a, b = set(ref[rd]), set(sig)
                      extra = f' | נוספו: {sorted(b - a)} | ירדו: {sorted(a - b)}'
                  print(f'{ds} {rd}: {len(sig)} תחנות — {same}{extra}')
          PY
