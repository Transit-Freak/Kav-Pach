name: probe-publisher

# הפורטל הממשלתי שבר את כתובות /dataset הישנות (404). פותחים דפדפן אמיתי,
# מריצים חיפוש, ומדווחים מהן כתובות עמודי-המאגר החדשות. דוח ללוג בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium 2>/dev/null | tail -1

      - name: Discover real dataset-page URLs in a browser
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              pg = b.new_page(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36')
              for url in ['https://data.gov.il/dataset?q=תחום אזורי תעשיה תעסוקה',
                          'https://data.gov.il/he/dataset/industrial',
                          'https://data.gov.il/']:
                  try:
                      pg.goto(url, wait_until='networkidle', timeout=45000)
                  except Exception as e:
                      print(url, '-> goto error:', str(e)[:100])
                  pg.wait_for_timeout(4000)
                  print('=== URL:', url)
                  print('  final:', pg.url)
                  print('  title:', pg.title())
                  hrefs = pg.eval_on_selector_all('a', 'els => els.map(e => e.href)')
                  seen = set()
                  for h in hrefs:
                      if ('dataset' in h or 'datasets' in h) and h not in seen:
                          seen.add(h)
                          print('  link:', h[:120])
                      if len(seen) > 12: break
                  body = pg.inner_text('body')[:400].replace('\n', ' | ')
                  print('  body starts:', body[:250])
              b.close()
          PY
