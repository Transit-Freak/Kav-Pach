name: probe-publisher

# אימות מה האתר החי מגיש בפועל: האם app.jsx שבאוויר מכיל את קוד ריבוי
# הערים. דוח ללוג בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live app.jsx and check
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' \
            "https://transit-freak.github.io/kav-bochan/line-history/app.jsx?cb=$RANDOM" -o live.jsx
          echo "bytes: $(wc -c < live.jsx)"
          for s in "אפשר כמה" "addCity" "include_subscription" "הוסף"; do
            n=$(grep -c "$s" live.jsx || true)
            echo "'$s' occurrences: $n"
          done
