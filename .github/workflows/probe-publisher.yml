name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם לסדנא יש נתוני GTFS מלפני 2022 —
# תיקיות ישנות ב-S3, טבלאות ישנות ב-Stride API. קריאה בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: כל התיקיות בדלי הציבורי של הסדנא
        run: |
          python3 - <<'PYEOF' || echo "נכשל"
          import urllib.request, re
          u='https://openbus-stride-public.s3.eu-west-1.amazonaws.com/?list-type=2&delimiter=/&max-keys=100'
          h=urllib.request.urlopen(u, timeout=30).read().decode()
          print('תיקיות עליונות:', re.findall(r'<Prefix>([^<]+)</Prefix>', h))
          # שנים בתוך כל תיקיית ארכיון
          for pref in re.findall(r'<Prefix>([^<]+)</Prefix>', h):
              u2=f'https://openbus-stride-public.s3.eu-west-1.amazonaws.com/?list-type=2&prefix={pref}&delimiter=/&max-keys=50'
              try:
                  h2=urllib.request.urlopen(u2, timeout=30).read().decode()
                  subs=re.findall(r'<Prefix>'+re.escape(pref)+r'([^<]+)</Prefix>', h2)
                  if subs: print(' ', pref, '→', subs[:15])
              except Exception as e: print(' ', pref, 'שגיאה', e)
          PYEOF
      - name: התאריך הישן ביותר ב-Stride API
        run: |
          python3 - <<'PYEOF' || echo "נכשל"
          import urllib.request, json
          def q(u):
              return json.loads(urllib.request.urlopen('https://open-bus-stride-api.hasadna.org.il'+u, timeout=40).read())
          for ep,orderf in [('/gtfs_routes/list?limit=1&order_by=date%20asc','date'),
                            ('/siri_snapshots/list?limit=1&order_by=snapshot_id%20asc','snapshot_id')]:
              try:
                  r=q(ep)
                  print(ep.split('/')[1], '→', (r[0].get(orderf) if r else 'ריק'))
              except Exception as e:
                  print(ep.split('/')[1], 'שגיאה:', str(e)[:80])
          PYEOF
