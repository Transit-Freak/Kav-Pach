name: probe-publisher

# בדיקת-כיס לשימוש חוזר: מאמתת מה האתר החי באמת מגיש. הבדיקה האחרונה
# שרצה כאן (29.08) אימתה את לולאת קו 26 מול צילומי הארכיון הגולמיים —
# הושלמה, והקובץ הוחזר לבדיקת ברירת-מחדל שקטה שתמיד עוברת, כדי שלא
# יישלחו התראות כשל בלילה על בדיקות חד-פעמיות שכבר הסתיימו.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: האתר החי מגיש את הגרסה העדכנית
        run: |
          set -euo pipefail
          curl -fsS "https://transit-freak.github.io/kav-bochan/line-history/index.html?cb=$RANDOM" | grep -o 'LH_BUILD = "[0-9]*"'
          curl -fsS "https://transit-freak.github.io/kav-bochan/fleet/index.html?cb=$RANDOM" | grep -c 'fleet-km' && echo 'fleet: עמודות הק"מ מוגשות'
