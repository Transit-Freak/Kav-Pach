name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם קיים ב-data.gov.il מידע על אוטובוסים
# ממוגני ירי — מאגר ייעודי או שדה מיגון במאגרי הרכב. קריאה בלבד,
# לעולם לא נכשלת (בלי מיילים אדומים) — הממצאים בלוג.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: חיפוש מיגון ב-data.gov.il
        run: |
          python3 - <<'EOF' || echo "שגיאה — ראו למעלה"
          import json
          import urllib.parse
          import urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan-probe/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          CKAN = 'https://data.gov.il/api/3/action'
          for pkg in ['bus_fleet']:
              d = get(f'{CKAN}/package_show?id={pkg}')['result']
              print(f'=== {d.get("title")} · org: {d.get("organization", {}).get("title", "")}')
              print('   notes:', (d.get('notes') or '').replace(chr(10), ' ')[:300])
              for res in d.get('resources', []):
                  rid = res['id']
                  print(f'   resource: {res.get("name", "")[:60]} · {rid} · {res.get("format")}')
                  try:
                      f = get(f'{CKAN}/datastore_search?resource_id={rid}&limit=0')
                      fields = [x['id'] for x in f['result'].get('fields', [])]
                      print('     שדות:', ', '.join(fields))
                      # חיפוש רשומות ממוגנות
                      s = get(f'{CKAN}/datastore_search?resource_id={rid}&q={urllib.parse.quote("ממוגן")}&limit=5')
                      tot = s['result'].get('total')
                      print(f'     רשומות עם "ממוגן": {tot}')
                      for rec in s['result'].get('records', [])[:4]:
                          rec.pop('_id', None)
                          print('      ·', json.dumps(rec, ensure_ascii=False)[:250])
                  except Exception as e:
                      print(f'     datastore: {type(e).__name__}: {e}')
          # גם רישוי מערך האוטובוסים
          d = get(f'{CKAN}/package_search?q={urllib.parse.quote("רישוי מערך האוטובוסים")}&rows=3')
          for p in d['result']['results']:
              print(f'=== {p.get("title")}')
              for res in p.get('resources', [])[:4]:
                  rid = res['id']
                  print(f'   resource: {res.get("name", "")[:60]} · {rid}')
                  try:
                      f = get(f'{CKAN}/datastore_search?resource_id={rid}&limit=0')
                      fields = [x['id'] for x in f['result'].get('fields', [])]
                      hit = [x for x in fields if 'migun' in x.lower() or 'mugan' in x.lower()]
                      print('     שדות:', ', '.join(fields[:35]))
                      s = get(f'{CKAN}/datastore_search?resource_id={rid}&q={urllib.parse.quote("ממוגן")}&limit=3')
                      print(f'     רשומות עם "ממוגן": {s["result"].get("total")} · שדות מיגון: {hit or "אין"}')
                      for rec in s['result'].get('records', [])[:2]:
                          rec.pop('_id', None)
                          print('      ·', json.dumps(rec, ensure_ascii=False)[:250])
                  except Exception as e:
                      print(f'     datastore: {type(e).__name__}: {e}')
          EOF
