name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם קיים ב-data.gov.il מידע על אוטובוסים
# ממוגני ירי — מאגר ייעודי או שדה מיגון במאגרי הרכב. קריאה בלבד,
# לעולם לא נכשלת (בלי מיילים אדומים) — הממצאים בלוג.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: חיפוש מיגון ב-data.gov.il
        run: |
          python3 - <<'EOF' || echo "שגיאה"
          import json
          import urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan-probe/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          CKAN = 'https://data.gov.il/api/3/action'
          RID = '91d298ed-a260-4f93-9d50-d5e3c5b82ce1'
          d = get(f'{CKAN}/datastore_search?resource_id={RID}&limit=2')
          fields = [x['id'] + ':' + x.get('type', '') for x in d['result'].get('fields', [])]
          print('כל השדות של ציי רכב אוטובוסים:')
          for f in fields:
              print('  ·', f)
          print()
          print('רשומה מלאה לדוגמה:')
          for rec in d['result'].get('records', [])[:2]:
              print(json.dumps(rec, ensure_ascii=False, indent=1))
          EOF
