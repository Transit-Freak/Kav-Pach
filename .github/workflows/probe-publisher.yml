name: probe-publisher

# בדיקה: מי הגוף המפרסם הרשמי של מאגר "תחום אזורי תעשיה תעסוקה"
# ב-data.gov.il, וכמה רשומות יש בכל אחד משני הקבצים הממשלתיים.
# דוח ללוג בלבד — שום שינוי בנתונים.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask data.gov.il who publishes and how many records
        run: |
          set -euo pipefail
          curl -fsS 'https://data.gov.il/api/3/action/package_show?id=8db5effd-59ca-44ef-b561-86e0ce2911d1' -o pkg.json
          curl -fsS 'https://data.gov.il/api/3/action/datastore_search?resource_id=71799e72-7a1f-45cf-9d81-5cd1d5f3b201&limit=1' -o mot.json
          curl -fsS 'https://data.gov.il/api/3/action/datastore_search?resource_id=30af8da4-7586-4b00-ac88-c5ee75251632&limit=1' -o eco.json
          python3 - <<'PY'
          import json
          d = json.load(open('pkg.json'))['result']
          org = d.get('organization') or {}
          print('=== PUBLISHER PROBE ===')
          print('dataset title:', d.get('title'))
          print('dataset slug (page URL name):', d.get('name'))
          print('human page URL: https://data.gov.il/dataset/' + str(d.get('name')))
          print('organization title:', org.get('title'))
          print('MOT layer total records:', json.load(open('mot.json'))['result']['total'])
          print('Economy registry total records:', json.load(open('eco.json'))['result']['total'])
          PY
