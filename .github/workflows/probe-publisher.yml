name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם קיים ב-data.gov.il מידע על אוטובוסים
# ממוגני ירי — מאגר ייעודי או שדה מיגון במאגרי הרכב. קריאה בלבד,
# לעולם לא נכשלת (בלי מיילים אדומים) — הממצאים בלוג.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: רשימת הבין-עירוניים הנגישים מה-GTFS
        run: |
          mkdir -p reports
          python3 - <<'EOF' || echo "שגיאה"
          import csv
          import datetime
          import io
          import json
          import sys
          import urllib.parse
          import urllib.request
          sys.path.insert(0, 'tools')
          from backfill_geo import central_dir, member_rows

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan-probe/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          day = datetime.date.today() - datetime.timedelta(days=1)
          URL = ('https://openbus-stride-public.s3.eu-west-1.amazonaws.com'
                 f'/gtfs_archive/{day.year}/{day.month:02d}/{day.day:02d}/israel-public-transportation.zip')
          members = central_dir(URL)
          # 1) האם דגל הנגישות מאוכלס בכלל?
          c, rows = member_rows(URL, members, 'trips.txt')
          from collections import Counter, defaultdict
          has_wc = 'wheelchair_accessible' in c
          print('שדה wheelchair_accessible בטריפס:', has_wc)
          per_route = defaultdict(lambda: [0, 0])
          dist = Counter()
          for r in rows:
              rid = r[c['route_id']]
              w = (r[c['wheelchair_accessible']] if has_wc else '').strip()
              dist[w] += 1
              per_route[rid][0] += 1
              if w == '1':
                  per_route[rid][1] += 1
          print('התפלגות הדגל:', dict(dist))
          if not has_wc or dist.get('1', 0) == 0:
              print('הדגל לא מאוכלס — אין דרך לבנות את הרשימה מה-GTFS')
              raise SystemExit(0)
          # 2) routes.txt — מק"ט, מספר קו, שם
          c2, rows2 = member_rows(URL, members, 'routes.txt')
          rinfo = {}
          for r in rows2:
              p = (r[c2['route_desc']] or '').split('-')
              rinfo[r[c2['route_id']]] = {
                  'mkt': p[0].lstrip('0') if p else '',
                  'num': r[c2['route_short_name']],
                  'name': r[c2['route_long_name']][:60],
                  'agency': r[c2['agency_id']],
              }
          # 3) הבין-עירוניים מרישוי המערך 2026
          inter = {}
          offset = 0
          while True:
              d = get('https://data.gov.il/api/3/action/datastore_search?resource_id=58593e9b-2d71-4c39-8663-b34ab29607ab'
                      f'&limit=5000&offset={offset}')
              recs = d['result'].get('records') or []
              for r in recs:
                  if 'בינעירוני' in (r.get('line_type_nm') or ''):
                      inter[str(r.get('office_line_id'))] = r.get('operator_nm', '')
              if len(recs) < 5000:
                  break
              offset += 5000
          print('קווים בין-עירוניים ברישוי המערך:', len(inter))
          # 4) איחוד לקובץ
          agg = defaultdict(lambda: [0, 0, None])
          for rid, (tot, acc) in per_route.items():
              ri = rinfo.get(rid)
              if not ri or ri['mkt'] not in inter:
                  continue
              a = agg[ri['mkt']]
              a[0] += tot
              a[1] += acc
              a[2] = ri
          out = io.StringIO()
          w = csv.writer(out)
          w.writerow(['מקט', 'קו', 'מפעילה', 'מסלול', 'נסיעות ביום', 'מהן נגישות', 'אחוז נגיש'])
          full = part = none = 0
          for mkt, (tot, acc, ri) in sorted(agg.items(), key=lambda x: -x[1][1]):
              pct = round(100 * acc / tot) if tot else 0
              if pct >= 99: full += 1
              elif pct > 0: part += 1
              else: none += 1
              w.writerow([mkt, ri['num'], inter.get(mkt, ''), ri['name'], tot, acc, f'{pct}%'])
          open('reports/intercity-accessible.csv', 'w', encoding='utf-8-sig').write(out.getvalue())
          print(f'קווים בין-עירוניים ב-GTFS של אתמול: {len(agg)} · נגישים במלואם: {full} · חלקית: {part} · ללא: {none}')
          EOF

      - name: commit
        run: |
          git config user.name 'probe-bot'
          git config user.email 'noreply@github.com'
          git add reports/ 2>/dev/null || true
          git diff --cached --quiet && { echo 'אין קובץ'; exit 0; }
          git commit -m 'data: רשימת קווים בין-עירוניים נגישים (GTFS wheelchair_accessible)'
          git pull --rebase -X theirs origin main
          git push
