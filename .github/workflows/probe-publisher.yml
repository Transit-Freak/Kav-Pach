name: probe-publisher

# בירור עתלית: גיל וסוג 45 המבנים בתוך גבול האזור — מכריע בין "בנוי ישן"
# ל"אתר בהקמה". דוח ללוג בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask OSM about buildings inside Atlit zone
        run: |
          set -euo pipefail
          Q='[out:json][timeout:60];(way["building"](poly:"POLY"););out meta tags center;'
          Q="${Q/POLY/32.69634 34.93852 32.69527 34.93839 32.69527 34.93862 32.69478 34.93854 32.69471 34.93883 32.69458 34.93924 32.69447 34.93943 32.69431 34.93964 32.69412 34.93984 32.69399 34.93994 32.69345 34.93985 32.69344 34.93985 32.69312 34.93977 32.69310 34.93977 32.69303 34.93974 32.69302 34.93974 32.69302 34.93967 32.69302 34.93953 32.69273 34.93947 32.69244 34.93941 32.69233 34.93939 32.69232 34.93952 32.69228 34.93951 32.69226 34.93951 32.69218 34.93912 32.69206 34.93843 32.69203 34.93822 32.69203 34.93821 32.69202 34.93809 32.69202 34.93808 32.69199 34.93792 32.69132 34.93787 32.69119 34.93785 32.69115 34.93784 32.69113 34.93776 32.69113 34.93772 32.69099 34.93659 32.69098 34.93650 32.69096 34.93612 32.69094 34.93609 32.69093 34.93605 32.69093 34.93600 32.69095 34.93596 32.69093 34.93552 32.69093 34.93542 32.69092 34.93522 32.69092 34.93517 32.69197 34.93547 32.69304 34.93521 32.69395 34.93546 32.69492 34.93600 32.69491 34.93620 32.69527 34.93602 32.69527 34.93603 32.69533 34.93614 32.69532 34.93615 32.69721 34.93613 32.69733 34.93868 32.69732 34.93868 32.69699 34.93866 32.69634 34.93852}"
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            if curl -fsS --max-time 90 --data-urlencode "data=$Q" "$ep" -o b.json; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || exit 1
          python3 - <<'PY'
          import json, collections
          d=json.load(open('b.json'))
          els=d.get('elements',[])
          print('buildings inside polygon:',len(els))
          yrs=collections.Counter(); types=collections.Counter()
          for e in els:
              yrs[(e.get('timestamp') or '????')[:4]]+=1
              types[(e.get('tags') or {}).get('building','?')]+=1
          print('last-edit years:',dict(sorted(yrs.items())))
          print('building types:',dict(types.most_common(10)))
          for e in els[:6]:
              t=e.get('tags',{})
              print(' sample:',t.get('building'),t.get('name',''),e.get('timestamp','')[:10],'user:',e.get('user',''))
          PY
