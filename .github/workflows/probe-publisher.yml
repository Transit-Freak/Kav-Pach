name: probe-publisher

# בדיקת-כיס (שאלת שלמה): האם קיים ב-data.gov.il מידע על אוטובוסים
# ממוגני ירי — מאגר ייעודי או שדה מיגון במאגרי הרכב. קריאה בלבד,
# לעולם לא נכשלת (בלי מיילים אדומים) — הממצאים בלוג.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: חיפוש מיגון ב-data.gov.il
        run: |
          python3 - <<'EOF' || echo "הבדיקה הסתיימה עם שגיאה — ראו למעלה"
          import json
          import urllib.parse
          import urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan-probe/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          CKAN = 'https://data.gov.il/api/3/action'
          # 1) חיפוש מאגרים לפי מילות מפתח
          for q in ['ממוגן', 'מיגון', 'ממוגנים', 'מיגון ירי']:
              try:
                  d = get(f'{CKAN}/package_search?q={urllib.parse.quote(q)}&rows=10')
                  res = d['result']
                  print(f'--- חיפוש "{q}": {res["count"]} מאגרים')
                  for p in res['results']:
                      print(f'   · {p.get("title", "")[:70]} · {p.get("name", "")}')
              except Exception as e:
                  print(f'--- חיפוש "{q}": שגיאה {type(e).__name__}: {e}')

          # 2) שדות במאגרי הרכב המרכזיים — יש עמודת מיגון?
          RES = {
              'כלי רכב ציבוריים (שלנו)': 'cf29862d-ca25-4691-84f6-1be60dcb4a1e',
              'רכב פרטי ומסחרי (הראשי)': '053cea08-09bc-40ec-8f7a-156f0677aff3',
              'כלי רכב פעילים ברמת דגם': '142afde2-6228-49f9-8a29-9b6c3a0cbe40',
          }
          for name, rid in RES.items():
              try:
                  d = get(f'{CKAN}/datastore_search?resource_id={rid}&limit=0')
                  fields = [f['id'] for f in d['result'].get('fields', [])]
                  hit = [f for f in fields if 'migun' in f.lower() or 'ממוגן' in f or 'מיגון' in f or 'armor' in f.lower()]
                  print(f'--- {name}: {len(fields)} שדות · שדות מיגון: {hit or "אין"}')
                  print('    ' + ', '.join(fields[:30]))
              except Exception as e:
                  print(f'--- {name}: שגיאה {type(e).__name__}: {e}')

          # 3) חיפוש כללי של מאגרי אוטובוסים — אולי מאגר ייעודי בשם אחר
          try:
              d = get(f'{CKAN}/package_search?q={urllib.parse.quote("אוטובוס")}&rows=30')
              print(f'--- מאגרים עם "אוטובוס": {d["result"]["count"]}')
              for p in d['result']['results']:
                  print(f'   · {p.get("title", "")[:80]}')
          except Exception as e:
              print(f'--- אוטובוס: שגיאה {e}')
          EOF
