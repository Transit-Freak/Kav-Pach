name: probe-publisher

# אימות מה האתר החי מגיש: הודעת הבדיקה-מחדש וקובץ הסטטוס שלה.

on:
  push:
    paths:
      - '.github/workflows/probe-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live files and check
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' \
            "https://transit-freak.github.io/kav-bochan/line-history/app.jsx?cb=$RANDOM" -o live.jsx
          echo "app.jsx bytes: $(wc -c < live.jsx)"
          grep -c "RecheckNotice" live.jsx && echo "RecheckNotice: קיים" || echo "RecheckNotice: חסר!"
          curl -fsS "https://transit-freak.github.io/kav-bochan/line-history/data/recheck.json?cb=$RANDOM" && echo && echo "recheck.json: קיים"
          curl -fsS "https://transit-freak.github.io/kav-bochan/line-history/index.html?cb=$RANDOM" | grep -o 'LH_BUILD = "[0-9]*"'
