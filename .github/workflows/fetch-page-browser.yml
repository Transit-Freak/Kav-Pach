name: fetch-page-browser

# הורדת טקסט של דף אינטרנט דרך דפדפן אמיתי (Chromium) במכונת Actions —
# לדפים שחוסמים הורדה אוטומטית (gov.il מחזיר 403 ל-curl). הטקסט נשמר
# ב-docs/fetched/ בענף שהריץ, עם שורת מקור ותאריך.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'כתובת הדף'
        required: true
      out:
        description: 'נתיב היעד (טקסט) בתוך הריפו'
        required: true
        default: 'docs/fetched/page.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: דפדפן
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: פתיחת הדף ושמירת הטקסט
        env:
          U: ${{ inputs.url }}
          OUT: ${{ inputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          cat > fetch.js <<'EOF'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: 'he-IL', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36' });
            const pg = await ctx.newPage(); const resp = await pg.goto(process.env.U, { waitUntil: 'networkidle', timeout: 90000 });
            await pg.waitForTimeout(4000);
            const text = await pg.evaluate(() => document.body.innerText);
            const links = await pg.$$eval('a[href]', as => as.map(a => (a.innerText.trim() + ' | ' + a.href)).filter(s => s.length > 3));
            fs.writeFileSync(process.env.OUT, `מקור: ${process.env.U}\nסטטוס: ${resp && resp.status()}\nהורד: ${new Date().toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem' })} (שעון ישראל)\n\n${text}\n\n===== קישורים =====\n${links.join('\n')}\n`);
            await b.close();
          })();
          EOF
          node fetch.js
          wc -c "$OUT"

      - name: שמירה בענף שהריץ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git diff --cached --quiet && { echo "ללא שינוי"; exit 0; }
          git commit -m "docs: דף שהורד דרך דפדפן במכונת Actions — ${{ inputs.out }}"
          git push origin HEAD:"$GITHUB_REF_NAME"
