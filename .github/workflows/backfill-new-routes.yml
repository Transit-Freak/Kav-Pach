name: backfill-new-routes

# הקו בזמן — השלמת מסלול ותחנות לרשומות "וריאנט חדש" של סריקת-הקיום
# (tools/backfill_new_routes.py). רץ במחזורים עד שהמלאי נגמר; ריצה בלי
# עבודה מסתיימת מיד.

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
    inputs:
      max_min:
        description: 'תקציב זמן בדקות'
        required: false
        default: '45'
      dry:
        description: 'ניתוח בלבד (1 = בלי כתיבה)'
        required: false
        default: '0'
      redo:
        description: 'מילוי-מחדש גם של רשומות שכבר מולאו (1 = כן)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: backfill-new-routes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Backfill routes for presence-only records
        run: |
          set -euo pipefail
          MAX_MIN='${{ github.event.inputs.max_min || '45' }}' \
          DRY='${{ github.event.inputs.dry || '0' }}' \
          REDO='${{ github.event.inputs.redo || '0' }}' \
          python3 tools/backfill_new_routes.py

      - name: Resolve stop codes unlocked by the new routes
        run: |
          set -euo pipefail
          DRY='${{ github.event.inputs.dry || '0' }}' \
          python3 tools/backfill_codes.py

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add line-history/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # קומיט פעם אחת; הלולאה רק דוחפת ומבצעת rebase על ריצות מקבילות
          git commit -m "data: מסלול אמיתי לרשומות ארכיון של קיום-בלבד (backfill_new_routes)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            echo "retry $i"; sleep 8
          done
          exit 1
