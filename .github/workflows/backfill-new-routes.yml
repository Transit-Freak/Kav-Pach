name: backfill-new-routes

# הקו בזמן — השלמת מסלול ותחנות לרשומות "וריאנט חדש" של סריקת-הקיום
# (tools/backfill_new_routes.py). רץ במחזורים עד שהמלאי נגמר; ריצה בלי
# עבודה מסתיימת מיד.

on:
  schedule:
    - cron: '7 * * * *'   # כל שעה עד שכל 306 התאריכים מולאו; ריצה בלי עבודה יוצאת מיד
  workflow_dispatch:
    inputs:
      max_min:
        description: 'תקציב זמן בדקות'
        required: false
        default: '45'
      dry:
        description: 'ניתוח בלבד (1 = בלי כתיבה)'
        required: false
        default: '0'
      redo:
        description: 'מילוי-מחדש גם של רשומות שכבר מולאו (1 = כן)'
        required: false
        default: '0'
      only:
        description: 'תאריכים מופרדי-פסיק לטיפול מיידי (עוקף את התור)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: backfill-new-routes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      # צ'אנקים קצרים + דחיפה אחרי כל אחד — קונפליקט מאבד דקות, לא ריצה.
      # התבנית הישנה (45 דקות עבודה, דחיפה אחת) איבדה ריצות שלמות שוב ושוב
      # ו-shp_missing בפאנל נתקע — המנוע עבד אבל שום דבר לא נשמר.
      - name: Backfill routes (chunks)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TOTAL='${{ github.event.inputs.max_min || '45' }}'
          CH=8
          for c in $(seq 1 $(( (TOTAL + CH - 1) / CH ))); do
            MAX_MIN=$CH DRY='${{ github.event.inputs.dry || '0' }}' \
            REDO='${{ github.event.inputs.redo || '0' }}' \
            ONLY='${{ github.event.inputs.only || '' }}' \
              python3 tools/backfill_new_routes.py
            DRY='${{ github.event.inputs.dry || '0' }}' \
              python3 tools/backfill_codes.py || true
            git add line-history/data
            if git diff --cached --quiet; then echo "אין שינוי — סוף העבודה"; break; fi
            git commit -m "data: מסלול אמיתי לרשומות ארכיון של קיום-בלבד (backfill_new_routes)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                git fetch origin main
                git reset --hard origin/main
                echo "קונפליקט — הצ'אנק אבד (עד ~$CH דקות), ממשיכים מבסיס עדכני"
                break
              fi
              echo "retry $i"; sleep 8
            done
          done
