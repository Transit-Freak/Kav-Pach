name: probe-iplan

# ניסוי שליפת גבולות תב"ע ממנהל התכנון עבור אזורי משרד התחבורה. דוח בלבד.

on:
  push:
    paths:
      - '.github/workflows/probe-iplan.yml'
      - 'tools/probe_iplan.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-iplan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ניסוי שליפה ממנהל התכנון
        run: python3 tools/probe_iplan.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp parks/checks/iplan-probe.json /tmp/iplan.json
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p parks/checks && cp /tmp/iplan.json parks/checks/iplan-probe.json
            git add parks/checks/iplan-probe.json
            if git diff --cached --quiet; then echo 'אין שינוי'; break; fi
            git commit -m 'data: ניסוי שליפת גבולות ממנהל התכנון'
            if git push origin HEAD:main; then break; fi
            echo "push rejected — retry $i"; sleep 10
          done
