name: probe-stride-stops

# אבחון חד-פעמי לשלב ב': קריאה ידנית לכל נקודות ה-API על מטרה אחת,
# עם הדפסת גוף השגיאה המלא — כדי לגלות פרמטרים לא נתמכים בלי לחכות לקנרית.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-stride-stops.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, urllib.error
          API='https://open-bus-stride-api.hasadna.org.il'
          def call(path, **params):
              url=f'{API}{path}?{urllib.parse.urlencode(params)}'
              print('==>', url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'kav-bochan probe'}), timeout=60) as r:
                      data=json.load(r)
                      if isinstance(data,list):
                          print('   OK list, len', len(data))
                          if data: print('   first keys:', sorted(data[0].keys()))
                          if data: print('   first row:', json.dumps(data[0], ensure_ascii=False)[:300])
                      else:
                          print('   OK obj:', json.dumps(data, ensure_ascii=False)[:300])
                      return data
              except urllib.error.HTTPError as e:
                  print('   HTTP', e.code, ':', e.read()[:400])
              except Exception as e:
                  print('   ERR:', e)
              return None

          d='2023-09-30'; mkt='72001'; dr='3'; alt='2'
          r1=call('/gtfs_routes/list', date_from=d, date_to=d, route_mkt=mkt, route_direction=dr, route_alternative=alt, limit=5)
          if r1:
              rid=r1[0]['id']
              print('route id:', rid)
              # פרמטר יחיד gtfs_route_id — האם מסנן באמת?
              r2=call('/gtfs_rides/list', gtfs_route_id=rid, limit=2, start_time_from=f'{d}T00:00:00+02:00', start_time_to=f'{d}T23:59:00+02:00')
              if r2:
                  ok=all(x.get('gtfs_route_id')==rid for x in r2)
                  print('   gtfs_route_id filter honored?', ok, '| returned route ids:', [x.get('gtfs_route_id') for x in r2])
                  if ok:
                      ride=r2[0]['id']
                      r3=call('/gtfs_ride_stops/list', gtfs_ride_ids=ride, limit=300)
                      if r3:
                          same=all(x.get('gtfs_ride_id')==ride for x in r3)
                          print('   ride_stops all from ride?', same, '| count:', len(r3))
                          rows=sorted(r3, key=lambda x: x.get('stop_sequence') or 0)
                          seq=[[str(x.get('gtfs_stop__code')), x.get('gtfs_stop__name'), x.get('gtfs_stop__lat'), x.get('gtfs_stop__lon')] for x in rows]
                          print('   seq head:', json.dumps(seq[:3], ensure_ascii=False))
                          print('   seq tail:', json.dumps(seq[-2:], ensure_ascii=False))
          # רישום ארצי: האם date_from/date_to מכובדים ב-gtfs_stops/list?
          s22=call('/gtfs_stops/list', date_from='2022-01-08', date_to='2022-01-08', limit=3)
          if s22: print('   dates returned:', [x.get('date') for x in s22])
          s22b=call('/gtfs_stops/list', date_from='2022-01-08', date_to='2022-01-08', limit=3, offset=20000)
          if s22b: print('   dates at offset 20000:', [x.get('date') for x in s22b])
          EOF
