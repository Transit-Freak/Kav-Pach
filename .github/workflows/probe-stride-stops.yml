name: probe-stride-stops

# אבחון חד-פעמי לשלב ב': קריאה ידנית לכל נקודות ה-API על מטרה אחת,
# עם הדפסת גוף השגיאה המלא — כדי לגלות פרמטרים לא נתמכים בלי לחכות לקנרית.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-stride-stops.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, urllib.error
          API='https://open-bus-stride-api.hasadna.org.il'
          def call(path, **params):
              url=f'{API}{path}?{urllib.parse.urlencode(params)}'
              print('==>', url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'kav-bochan probe'}), timeout=60) as r:
                      data=json.load(r)
                      if isinstance(data,list):
                          print('   OK list, len', len(data))
                          if data: print('   first keys:', sorted(data[0].keys()))
                          if data: print('   first row:', json.dumps(data[0], ensure_ascii=False)[:300])
                      else:
                          print('   OK obj:', json.dumps(data, ensure_ascii=False)[:300])
                      return data
              except urllib.error.HTTPError as e:
                  print('   HTTP', e.code, ':', e.read()[:400])
              except Exception as e:
                  print('   ERR:', e)
              return None

          d='2023-09-30'; mkt='72001'; dr='3'; alt='2'
          r1=call('/gtfs_routes/list', date_from=d, date_to=d, route_mkt=mkt, route_direction=dr, route_alternative=alt, limit=5)
          r1b=call('/gtfs_routes/list', date_from=d, date_to=d, route_mkt=mkt.zfill(5), route_direction=dr, route_alternative=alt, limit=5)
          rows=r1 if r1 else r1b
          if rows:
              rid=rows[0]['id']
              print('route id:', rid)
              call('/gtfs_rides/list', gtfs_route_ids=rid, limit=1, start_time_from=f'{d}T00:00:00+02:00', start_time_to=f'{d}T23:59:00+02:00')
              call('/gtfs_rides/list', gtfs_route_ids=rid, limit=1, start_time_from=f'{d}T00:00:00', start_time_to=f'{d}T23:59:00')
              r2=call('/gtfs_rides/list', gtfs_route_ids=rid, limit=1, start_time_from=f'{d}T00:00:00Z', start_time_to=f'{d}T23:59:00Z')
              if r2:
                  ride=r2[0]['id']
                  print('ride id:', ride)
                  r3=call('/gtfs_ride_stops/list', gtfs_ride_ids=ride, limit=200)
                  if r3:
                      ids=[x.get('gtfs_stop_id') for x in r3[:5]]
                      print('stop ids sample:', ids)
                      call('/gtfs_stops/list', gtfs_stop_ids=','.join(map(str,ids)), limit=10)
                      call('/gtfs_stops/get', id=ids[0])
          EOF
