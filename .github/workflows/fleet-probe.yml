name: fleet-probe

# אבחון חד-פעמי: מריץ את ההעשרה הממשלתית לבדה עם פלט מלא,
# כדי לראות למה היא נכשלת בתוך הסריקות. לא כותב כלום לריפו.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: בדיקת גישה למאגר הממשלתי
        run: |
          python3 - <<'EOF'
          import urllib.request, json, traceback
          UA = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36')
          for name, url in [
              ('package_search', 'https://data.gov.il/api/3/action/package_search?q=%D7%A8%D7%9B%D7%91%20%D7%A6%D7%99%D7%91%D7%95%D7%A8%D7%99&rows=3'),
              ('site_read', 'https://data.gov.il/api/3/action/site_read'),
          ]:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      j = json.load(r)
                  print(name, 'OK, success =', j.get('success'))
                  if name == 'package_search':
                      for p in j['result']['results']:
                          print('  dataset:', p.get('title'))
              except Exception as e:
                  print(name, 'FAILED:', e)
                  traceback.print_exc()
          EOF
      - name: הרצת ההעשרה המלאה עם פלט
        continue-on-error: true
        run: python3 -X faulthandler tools/fleet_enrich_gov.py || echo "exit=$?"
