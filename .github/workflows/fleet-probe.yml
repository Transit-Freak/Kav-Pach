name: fleet-probe

# אבחון: האם הקישורים הישירים (resource_id) של מאגרי הרישוי
# נגישים מהשרתים של GitHub. לא כותב כלום לריפו.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: הקישורים הישירים ששלח המשתמש
        run: |
          python3 - <<'EOF'
          import urllib.request, json, traceback
          UA = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36')
          urls = [
            ('רכב פרטי - datastore', 'https://data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3&limit=1'),
            ('רכב פרטי המשך - datastore', 'https://data.gov.il/api/3/action/datastore_search?resource_id=0866573c-40cd-4ca8-91d2-9dd2d7a492e5&limit=1'),
            ('api.data.gov.il (מראה חלופית)', 'https://api.data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3&limit=1'),
            ('e.data.gov.il', 'https://e.data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3&limit=1'),
          ]
          for name, url in urls:
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': UA, 'Accept': 'application/json',
                      'Accept-Language': 'he-IL,he;q=0.9,en;q=0.8',
                      'Referer': 'https://data.gov.il/'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read(500)
                  print(name, '=> OK!', body[:120])
              except Exception as e:
                  print(name, '=> FAILED:', e)
          EOF
