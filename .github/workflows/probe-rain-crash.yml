# בדיקה חד-פעמית סיבוב 3: איפה נתוני הגשם במאגר השמ"ט + כל משאבי ה-PUF.
name: probe-rain-crash
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: find the rain resource
        run: |
          set +e
          echo "===== 1. כל המשאבים של 'ארכיון נתונים מטאורולוגיים' ====="
          curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/package_search?q=%D7%9E%D7%98%D7%90%D7%95%D7%A8%D7%95%D7%9C%D7%95%D7%92%D7%99&rows=5" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('result',{}).get('results',[]):
              print('DATASET:',p.get('title'),'| org:',(p.get('organization') or {}).get('title'),'| id:',p.get('id'))
              for r in p.get('resources',[]):
                  print('   RES:',r.get('name'),'|',r.get('format'),'| id:',r.get('id'))
          " 2>&1 | head -60
          echo "===== 2. חיפוש ממוקד: גשם ====="
          curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/package_search?q=%D7%92%D7%A9%D7%9D&rows=8" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('result',{}).get('results',[]):
              print('DATASET:',p.get('title'),'| org:',(p.get('organization') or {}).get('title'))
              for r in p.get('resources',[])[:8]:
                  print('   RES:',r.get('name'),'|',r.get('format'),'| id:',r.get('id'))
          " 2>&1 | head -60
          echo "===== 3. משאבי ה-PUF 2020-2024 המלא ====="
          curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/package_search?q=PUF&rows=6" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('result',{}).get('results',[]):
              t=p.get('title','')
              if 'PUF' not in t: continue
              print('DATASET:',t)
              for r in p.get('resources',[]):
                  print('   RES:',r.get('name'),'|',r.get('format'),'| id:',r.get('id'))
          " 2>&1 | head -40
          echo "===== done ====="
          true
