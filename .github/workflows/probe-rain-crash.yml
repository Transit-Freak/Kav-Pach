# בדיקה חד-פעמית סיבוב 2: מה בתוך הקבצים — שדות, כמויות, טווחי תאריכים.
name: probe-rain-crash
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: sample the actual records
        run: |
          set +e
          Q() { curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/datastore_search?resource_id=$1&limit=$2" ; }
          echo "===== 1. שירות מטאורולוגי — נתונים יומיים (שדות + רשומה) ====="
          Q cee3ad4a-4e77-4015-8245-52505417d7ea 2 | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['result']
          print('total:',d.get('total'))
          print('fields:',[f['id'] for f in d.get('fields',[])])
          for r in d.get('records',[])[:2]: print(r)
          " 2>&1 | head -20
          echo "===== 2. שירות מטאורולוגי — תחנות ====="
          Q 83841660-b9c4-4ecc-a403-d435b3e8c92f 3 | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['result']
          print('total:',d.get('total'))
          print('fields:',[f['id'] for f in d.get('fields',[])])
          for r in d.get('records',[])[:3]: print(r)
          " 2>&1 | head -20
          echo "===== 3. למ\"ס PUF 2024 — שדות התאונות ====="
          Q 05d14adb-fe54-49f7-b7ce-f30348e2d959 2 | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['result']
          print('total:',d.get('total'))
          print('fields:',[f['id'] for f in d.get('fields',[])])
          for r in d.get('records',[])[:1]: print(r)
          " 2>&1 | head -25
          echo "===== 4. נתונים יומיים של השמ\"ט: כמה אחורה זה הולך? (מיון לפי תאריך) ====="
          curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/datastore_search?resource_id=cee3ad4a-4e77-4015-8245-52505417d7ea&limit=1&sort=_id%20asc" | head -c 700; echo
          curl -sS --max-time 60 -A "Mozilla/5.0" "https://data.gov.il/api/3/action/datastore_search?resource_id=cee3ad4a-4e77-4015-8245-52505417d7ea&limit=1&sort=_id%20desc" | head -c 700; echo
          echo "===== done ====="
          true
