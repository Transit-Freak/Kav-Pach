name: make-heatbtn

# חד-פעמי: מייצר צילום אמיתי של מפת החום לכפתור באתר אזורי התעשייה.
# רץ מ-CI כי שרת אריחי OSM חסום מסביבת הפיתוח.

on:
  push:
    paths:
      - '.github/workflows/make-heatbtn.yml'
      - 'tools/make_heatbtn.py'

permissions:
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose heat-map button image
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 tools/make_heatbtn.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parks/heatbtn-map.png
          git diff --cached --quiet && { echo 'אין שינוי'; exit 0; }
          git commit -m 'data: צילום מפת החום לכפתור (אריחי OSM + עיגולי האזורים)'
          for i in 1 2 3; do
            git push && break
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git commit -m 'data: צילום מפת החום לכפתור (אריחי OSM + עיגולי האזורים)' || true
            sleep 5
          done
