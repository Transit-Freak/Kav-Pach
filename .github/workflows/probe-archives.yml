# בדיקה חד-פעמית: האם קיימים קובצי GTFS ישראליים מלפני מרץ 2017
# בארכיונים ציבוריים (GTFS Data Exchange הישן, S3, Transitland, Wayback).
# מורץ ידנית בלבד; הפלט נקרא מהלוג. לא נוגע באתר.
name: probe-archives
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: round 3 - validate the negative result
        run: |
          set +e
          echo "===== 1. GDX live api/agencies - is the API alive at all ====="
          curl -s --max-time 30 "http://www.gtfs-data-exchange.com/api/agencies" -o api.json
          wc -c api.json
          head -c 400 api.json; echo
          grep -io israel api.json | head -3
          echo "===== 2. agencies page snapshot: does it really contain the agency list ====="
          curl -sL --max-time 60 "http://web.archive.org/web/2016id_/http://www.gtfs-data-exchange.com/agencies" -o ag.html
          wc -c ag.html
          echo "-- sample agency slugs found on page:"
          grep -oE 'agency/[a-z0-9-]+' ag.html | sort -u | head -15
          echo "-- total distinct agency links:"
          grep -oE 'agency/[a-z0-9-]+' ag.html | sort -u | wc -l
          echo "-- israel/jerusalem/tel-aviv mentions:"
          grep -ioE 'israel|jerusalem|tel.?aviv' ag.html | sort | uniq -c
          echo "===== 3. Wayback CDX: israel files on gtfs.s3.amazonaws.com ====="
          curl -s --max-time 60 "http://web.archive.org/cdx/search/cdx?url=gtfs.s3.amazonaws.com&matchType=domain&filter=urlkey:.*israel.*&collapse=urlkey&limit=30&output=text" | head -c 3000; echo
          echo "===== done ====="
          true
