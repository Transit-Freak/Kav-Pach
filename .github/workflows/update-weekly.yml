name: update-weekly

# יומי: רענון שמות התחנות והסיווג מ-GTFS (משרד התחבורה מפרסם קובץ חדש כל יום).
# משתמש ב-POI/כבישים הקיימים ושומר זמני הליכה שכבר חושבו (rt) — בלי בניית OSRM הכבדה.
# (שם הקובץ נשאר update-weekly מסיבות היסטוריות — התזמון בפועל יומי מאז 04.07.2026.)
# (סיווג מעודכן: זיהוי דואר 📮 + הבדל "ה" הידיעה אינו טעות + שם מוצע ממוקד מרכזי עד 100 מ׳
#  + "הצעות כלליות": לתחנות תקינות שבהן הרחוב שבכתובת רחוק והרחוב הקרוב במפה שונה
#    — סינון רעש: התאמת רחובות עמידה למקפים/ר"ת, דילוג על שמות בכתב ערבי/מספריים.)

on:
  # צינור מאוחד: נדלק בסיום הריצה היומית של "הקו בזמן" (10:30 ישראל)
  # ומשתמש ב-GTFS שהיא כבר הורידה — הורדה אחת ביום לכל הכלים.
  workflow_run:
    workflows: ["line-history"]
    types: [completed]
  # (דחיפה: הפעלת סיווג-מחדש אחרי סינון וריאציות כתיב)
  push:
    paths:
      - '.github/workflows/update-weekly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: update-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    # גם כשהצינור הראשי נכשל — הנסיגה מורידה את הפיד ישירות; מדלגים רק על ביטול ידני
    if: (github.ref == 'refs/heads/main' || github.event_name != 'push') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ה-GTFS שכבר ירד בצינור המאוחד
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gtfs-daily
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fetch fresh GTFS stops + active set
        run: |
          set -euo pipefail
          if [ ! -f gtfs.zip ]; then
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
            URL="https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
            curl -fSL --connect-timeout 20 --max-time 1200 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" -o gtfs.zip "$URL"
          else
            echo "משתמשים ב-GTFS מהצינור המאוחד"
          fi
          unzip -o gtfs.zip stops.txt
          unzip -o gtfs.zip stop_times.txt
          unzip -o gtfs.zip translations.txt
          # לחישוב "קו עם לוז" של המחירון (current.json)
          unzip -o gtfs.zip routes.txt trips.txt calendar.txt
          unzip -o gtfs.zip calendar_dates.txt || true
          SID=$(head -1 stop_times.txt | tr -d '\r' | tr ',' '\n' | grep -n -x 'stop_id' | cut -d: -f1)
          awk -F, -v c="$SID" 'NR>1{gsub(/\r/,"",$c); if($c!="") a[$c]=1} END{for(k in a) print k}' stop_times.txt | sort > active_stops.txt
          wc -l stops.txt active_stops.txt

      - name: Reuse existing POI + roads from data branches
        run: |
          set -euo pipefail
          git fetch origin osm-poi && git show FETCH_HEAD:poi.json > poi.json
          git fetch origin osm-roads && git show FETCH_HEAD:roads.json > roads.json
          ls -la poi.json roads.json

      - name: Classify (carry forward walking times from current data.json)
        run: |
          set -euo pipefail
          cp next-station/data.json prev.json 2>/dev/null || echo '{}' > prev.json
          STOPS=stops.txt POI=poi.json ROADS=roads.json ACTIVE=active_stops.txt \
            PREV=prev.json HISTORY=next-station/history.json CHANGES=next-station/changes.json CATDIFF=next-station/catdiff.json \
            SNAPSHOT=next-station/stops-names.json \
            OUT=next-station/data.json python3 tools/classify.py

      - name: Build המחירון stops index (from fresh line-history + stops.txt + schedule)
        run: |
          GEN_DATE=$(date -u +%F) OUTDIR=fares/data STOPS_TXT=stops.txt \
            ROUTES_TXT=routes.txt TRIPS_TXT=trips.txt CAL_TXT=calendar.txt CALD_TXT=calendar_dates.txt \
            python3 tools/build_fares_stops.py

      - name: Detect English-translation errors (טעויות תרגום — קטגוריה באפליקציה)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyspellchecker || true
          STOPS=stops.txt TRANS=translations.txt OUTFILE=next-station/translation-errors.json \
            MANUAL=tools/translation-errors-manual.json python3 tools/translation_check.py

      - name: Commit refreshed data.json to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt translations.txt active_stops.txt poi.json roads.json prev.json
          rm -f routes.txt trips.txt calendar.txt calendar_dates.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main עלול לזוז בזמן הריצה — שומרים פלט, מתעדכנים, מחילים ודוחפים (עם ניסיונות חוזרים)
          cp next-station/data.json /tmp/out-data.json
          cp next-station/history.json /tmp/out-hist.json 2>/dev/null || true
          cp next-station/changes.json /tmp/out-chg.json 2>/dev/null || true
          cp next-station/catdiff.json /tmp/out-catd.json 2>/dev/null || true
          cp next-station/translation-errors.json /tmp/out-trans.json 2>/dev/null || true
          cp next-station/stops-names.json /tmp/out-snap.json 2>/dev/null || true
          cp fares/data/stops.json /tmp/out-fares.json 2>/dev/null || true
          cp fares/data/current.json /tmp/out-fares-cur.json 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/out-data.json next-station/data.json
            [ -f /tmp/out-hist.json ] && cp /tmp/out-hist.json next-station/history.json
            [ -f /tmp/out-chg.json ] && cp /tmp/out-chg.json next-station/changes.json
            [ -f /tmp/out-catd.json ] && cp /tmp/out-catd.json next-station/catdiff.json
            [ -f /tmp/out-trans.json ] && cp /tmp/out-trans.json next-station/translation-errors.json
            [ -f /tmp/out-snap.json ] && cp /tmp/out-snap.json next-station/stops-names.json
            mkdir -p fares/data
            [ -f /tmp/out-fares.json ] && cp /tmp/out-fares.json fares/data/stops.json
            [ -f /tmp/out-fares-cur.json ] && cp /tmp/out-fares-cur.json fares/data/current.json
            git add next-station/data.json next-station/history.json
            git add next-station/changes.json 2>/dev/null || true
            git add next-station/catdiff.json 2>/dev/null || true
            git add next-station/translation-errors.json 2>/dev/null || true
            git add next-station/stops-names.json 2>/dev/null || true
            git add fares/data/stops.json fares/data/current.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "data unchanged — nothing to commit"; break; fi
            git commit -m "weekly: refresh stop names & classification from GTFS + fares stops index"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done

