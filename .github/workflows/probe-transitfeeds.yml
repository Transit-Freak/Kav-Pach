name: probe-transitfeeds

# ארכיאולוגיית מוניות שירות: סריקת ארכיון TransitFeeds (S3) — אילו תאגידי
# מוניות היו בפיד הארצי 2017–2022, אילו קווים, ומה חסר בארכיון הקו בזמן.
# שלב א' = דיווח בלבד ליומן. הפעלה ידנית.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: סריקת הארכיון ומיפוי החוסרים
        run: python3 tools/probe_hadar.py
