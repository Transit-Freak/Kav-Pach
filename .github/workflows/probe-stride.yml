name: probe-stride

# בדיקת היתכנות חד-פעמית למילוי-לאחור של "הקו בזמן" מארכיון אופן באס:
# (א) אילו endpoints יש ב-API (יש שם shapes?), (ב) האם קובצי ה-GTFS היומיים
# הגולמיים נגישים להורדה ובאיזו כתובת, (ג) דגימת נתונים היסטוריים לקו אחד.
# רק מדפיס ללוג — לא כותב כלום לריפו.

on:
  push:
    paths:
      - '.github/workflows/probe-stride.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: API endpoints (מה קיים, יש shapes?)
        run: |
          set -uo pipefail
          curl -fsS --max-time 60 "https://open-bus-stride-api.hasadna.org.il/openapi.json" -o api.json || { echo "API unreachable"; exit 0; }
          python3 - <<'PY'
          import json
          d = json.load(open('api.json'))
          paths = sorted(d.get('paths', {}).keys())
          print('=== כל ה-endpoints ===')
          for p in paths: print(' ', p)
          print('=== מכילים shape ===')
          print([p for p in paths if 'shape' in p.lower()] or 'אין endpoint של shapes')
          PY

      - name: Historical sample — route 480 on 2023-06-01
        run: |
          set -uo pipefail
          echo "--- gtfs_routes ---"
          curl -fsS --max-time 60 "https://open-bus-stride-api.hasadna.org.il/gtfs_routes/list?date_from=2023-06-01&date_to=2023-06-01&route_short_name=480&limit=3" | head -c 2000; echo
          echo "--- gtfs_rides (route_ids מהתשובה הקודמת ייבדקו ידנית; דגימה כללית) ---"
          curl -fsS --max-time 60 "https://open-bus-stride-api.hasadna.org.il/gtfs_rides/list?gtfs_route__date_from=2023-06-01&gtfs_route__date_to=2023-06-01&gtfs_route__route_short_name=480&limit=2" | head -c 1500; echo
          echo "--- gtfs_stops (תחנה 20101 ב-2023) ---"
          curl -fsS --max-time 60 "https://open-bus-stride-api.hasadna.org.il/gtfs_stops/list?date_from=2023-06-01&date_to=2023-06-01&code=20101&limit=2" | head -c 1200; echo

      - name: Raw daily GTFS archive — candidate URLs
        run: |
          set -uo pipefail
          for u in \
            "https://open-bus-stride-public.s3.eu-west-1.amazonaws.com/gtfs_archive/2023/06/01/israel-public-transportation.zip" \
            "https://open-bus-stride-public.s3.amazonaws.com/gtfs_archive/2023/06/01/israel-public-transportation.zip" \
            "https://open-bus-gtfs-data.hasadna.org.il/2023/06/01/israel-public-transportation.zip" \
            "https://open-bus-stride-public.s3.eu-west-1.amazonaws.com/gtfs/2023/06/01/israel-public-transportation.zip" \
          ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -I "$u")
            size=$(curl -s --max-time 30 -I "$u" | grep -i content-length | tr -d '\r' | awk '{print $2}')
            echo "$code ${size:-?} $u"
          done
          echo "--- bucket listing נסיון ---"
          curl -fsS --max-time 30 "https://open-bus-stride-public.s3.eu-west-1.amazonaws.com/?list-type=2&prefix=gtfs_archive/2023/06/01/&max-keys=10" | head -c 2000 || echo "listing blocked"

      - name: Docs — where does the ETL store the archive
        run: |
          set -uo pipefail
          for f in \
            "https://raw.githubusercontent.com/hasadna/open-bus-gtfs-etl/main/README.md" \
            "https://raw.githubusercontent.com/hasadna/open-bus-pipelines/main/STRIDE.md" \
          ; do
            echo "===== $f ====="
            curl -fsS --max-time 30 "$f" | grep -in "s3\|archive\|download\|http" | head -25 || true
          done
