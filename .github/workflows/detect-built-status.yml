name: detect-built-status

# מי כבר בנוי ומי עדיין מתוכנן: ספירת מבנים בתוך כל אזור תעשייה מ-OSM.
# הפלט נקרא ע"י parks.py בריצה הבאה ומסמן אזורים "בהקמה/מתוכנן" באתר.
# רץ שבועי (אחרי הריצה הראשית) — אזור שנבנה משנה סטטוס מעצמו.

on:
  schedule:
    - cron: '0 9 * * 0'   # ראשון 09:00 UTC — שעתיים אחרי הריצה הראשית
  push:
    paths:
      - '.github/workflows/detect-built-status.yml'
      - 'tools/detect_built_status.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detect-built-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: ספירת מבנים בכל אזור
        run: python3 tools/detect_built_status.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp parks/checks/built-status.json /tmp/bs.json
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p parks/checks && cp /tmp/bs.json parks/checks/built-status.json
            git add parks/checks/built-status.json
            if git diff --cached --quiet; then echo 'אין שינוי'; break; fi
            git commit -m 'data: סטטוס בנוי/מתוכנן לאזורי התעשייה (ספירת מבנים מ-OSM)'
            if git push origin HEAD:main; then break; fi
            echo "push rejected — retry $i"; sleep 10
          done
