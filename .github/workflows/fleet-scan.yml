name: fleet-scan

# צי הרכבים: סריקת דאטאבוס (Stride API) — אילו רכבים פעלו אצל כל מפעיל
# ומתי נצפו לראשונה ולאחרונה, בתוספת העשרה מהמאגר הממשלתי (שנה/יצרן/דגם/דלתות/סוג).
# שבועי: מרחיב את החלון ב-8 הימים האחרונים. Backfill: הפעלה עם chain=true —
# כל ריצה סורקת פרק של עד 45 יום אחורה ומזניקה את הפרק הבא, עד 16.01.2022.

on:
  schedule:
    - cron: '30 3 * * 5'   # שישי 03:30 UTC — אחרי שהצינורות היומיים סיימו
  workflow_dispatch:
    inputs:
      from:
        description: 'FROM (YYYY-MM-DD) — ריק = 8 ימים אחורה'
        required: false
      to:
        description: 'TO (YYYY-MM-DD) — ריק = היום'
        required: false
      max_min:
        description: 'עצירה נקייה אחרי X דקות (0 = בלי מגבלה)'
        required: false
        default: '300'
      chain:
        description: 'backfill משורשר — בסיום, הזנקת הפרק הבא אחורה עד 2022'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: fleet-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: סריקת דאטאבוס
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          MAX_MIN: ${{ github.event.inputs.max_min || '300' }}
          FLUSH_DAYS: '1'   # עדכון חי לאתר אחרי כל יום סרוק
        run: python3 tools/fleet_scan.py

      - name: העשרה מהמאגר הממשלתי (best-effort)
        continue-on-error: true
        run: python3 tools/fleet_enrich_gov.py

      - name: שיוך ערים (best-effort)
        continue-on-error: true
        run: python3 tools/fleet_cities.py

      - name: commit
        run: |
          git config user.name 'fleet-bot'
          git config user.email 'noreply@github.com'
          git rebase --abort 2>/dev/null || true
          git add fleet/data
          git diff --cached --quiet && { echo 'אין שינוי'; exit 0; }
          git commit -m 'data: fleet — עדכון צי הרכבים מדאטאבוס'
          git pull --rebase origin main
          git push

      - name: המשך backfill אוטומטי
        if: github.event.inputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - > /tmp/next.env <<'EOF'
          import datetime
          import json
          st = json.load(open('fleet/data/fleet-state.json'))['vehicles']
          earliest = min(v[0] for v in st.values())
          target = datetime.date(2022, 1, 16)
          e = datetime.date.fromisoformat(earliest)
          if e <= target:
              print('DONE=1')
          else:
              to = e - datetime.timedelta(days=1)
              frm = max(target, to - datetime.timedelta(days=44))
              print(f'FROM={frm}')
              print(f'TO={to}')
              print('DONE=')
          EOF
          cat /tmp/next.env
          . /tmp/next.env
          if [ -z "$DONE" ]; then
            echo "מזניק פרק הבא: $FROM → $TO"
            gh workflow run fleet-scan.yml --ref main -f from="$FROM" -f to="$TO" -f chain=true -f max_min=300
          else
            echo 'ה-backfill הושלם — הגענו ל-16.01.2022'
          fi
