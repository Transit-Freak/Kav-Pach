name: parks-access

# נגישות תחבורה ציבורית לאזורי תעשייה — מקור האזורים: הדאטהסט הרשמי של משרד
# הכלכלה (data.gov.il, "רשימת אזורי תעשייה"). תחנות ולוחות זמנים מ-GTFS (משרד
# התחבורה). חישוב הליכה מדויק ב-OSRM (רשת OSM). שבילי OSM רק למדד כיסוי-שטח.
# רץ שבועי.

on:
  schedule:
    - cron: '0 4 * * 0'
  push:
    paths:
      - '.github/workflows/parks-access.yml'
      - 'tools/parks.py'
      - 'tools/fetch_footways.py'
      - 'tools/fetch_official.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parks-access
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official industrial zones (משרד הכלכלה) — מקור האזורים
        run: |
          set -euo pipefail
          # המקור הרשמי הוא מקור-האמת היחיד לאזורים. כשל כאן מפיל את הריצה
          # (בלי המקור הרשמי אין מה לבנות במצב ממשלתי-בלבד).
          python3 -m pip install --quiet pyproj
          OFFICIAL_OUT=official.json python3 tools/fetch_official.py
          echo "official.json: $(wc -c < official.json) bytes"

      - name: Compute park regions (מהאזורים הרשמיים ← תיבות-גבול לשלב-השבילים)
        run: |
          set -euo pipefail
          EMIT_REGIONS=1 OFFICIAL_ONLY=1 OFFICIAL=official.json REGIONS_OUT=regions.json python3 tools/parks.py
          echo "regions: $(wc -c < regions.json) bytes"

      - name: Query Overpass — footways within regions (למדד כיסוי-שטח בלבד)
        run: |
          set -euo pipefail
          REGIONS=regions.json FOOT_OUT=footways.json CHUNK=100 python3 tools/fetch_footways.py

      - name: parks-raw.json = שבילים בלבד (בלי פוליגונים מ-OSM)
        run: |
          set -euo pipefail
          cp footways.json parks-raw.json
          echo "footway elements: $(python3 -c "import json;print(len(json.load(open('parks-raw.json')).get('elements',[])))")"

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1800 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt

      - name: Set up local OSRM (foot) — מפת ישראל, ניתוב מקומי מלא
        run: |
          set -euo pipefail
          # שרת OSRM מקומי עם פרופיל-רגל על מפת ישראל+פלסטין. ניתוב מקומי מיידי
          # (בלי הגבלת-קצב) => כל התחנות נבדקות בריצה אחת.
          mkdir -p osrm && cd osrm
          curl -fSL --connect-timeout 20 --max-time 600 --retry 6 --retry-all-errors --retry-delay 10 \
            -o map.osm.pbf "https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf"
          echo "pbf: $(du -h map.osm.pbf | cut -f1)"
          IMG=osrm/osrm-backend:latest
          docker pull "$IMG"
          # foot.lua מגיע בתוך ה-image ב-/opt/foot.lua
          docker run --rm -v "$PWD:/data" "$IMG" osrm-extract   -p /opt/foot.lua /data/map.osm.pbf
          docker run --rm -v "$PWD:/data" "$IMG" osrm-partition  /data/map.osrm
          docker run --rm -v "$PWD:/data" "$IMG" osrm-customize  /data/map.osrm
          docker run -d --name osrm -p 5000:5000 -v "$PWD:/data" "$IMG" \
            osrm-routed --algorithm mld --max-table-size 8000 /data/map.osrm
          # המתנה לזמינות
          up=0
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:5000/nearest/v1/foot/34.78,32.08" >/dev/null 2>&1; then
              up=1; echo "OSRM up after ${i}x2s"; break; fi
            sleep 2
          done
          [ "$up" = "1" ] || { echo "OSRM failed to start"; docker logs osrm || true; exit 1; }

      - name: Build park accessibility data (ממשלתי-בלבד)
        run: |
          set -euo pipefail
          # OFFICIAL_ONLY: האזורים אך ורק מהדאטהסט הרשמי. GTFS לתחנות/זמנים,
          # OSRM מקומי למרחק-הליכה מדויק, שבילי OSM רק למדד כיסוי-שטח.
          OFFICIAL_ONLY=1 OFFICIAL=official.json \
            OSRM_URL="http://localhost:5000" OSRM_BUDGET=3000 OSRM_SLEEP=0 \
            WALK_CACHE_IN=parks/data/walk-cache.json \
            PARKS_RAW=parks-raw.json OUTDIR=/tmp/parksout python3 tools/parks.py
          ls /tmp/parksout | head -5
          echo "files: $(ls /tmp/parksout | wc -l)"

      - name: Commit to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt parks-raw.json footways.json regions.json official.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p parks
            rm -rf parks/data
            cp -r /tmp/parksout parks/data
            git add parks/data
            if git diff --cached --quiet; then
              echo "unchanged — nothing to commit"; break; fi
            git commit -m "data: refresh industrial-park accessibility (רשמי)"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done
