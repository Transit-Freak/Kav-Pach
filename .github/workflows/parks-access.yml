name: parks-access

# נגישות תחבורה ציבורית לאזורי תעשייה (ניסוי): פוליגונים + שבילים מ-OSM,
# תחנות ולוחות זמנים מ-GTFS. רץ שבועי.

on:
  schedule:
    - cron: '0 4 * * 0'
  push:
    paths:
      - '.github/workflows/parks-access.yml'
      - 'tools/parks.py'
      - 'tools/fetch_footways.py'
      - 'tools/fetch_official.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parks-access
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Query Overpass — industrial polygons (בלי around, מהיר)
        run: |
          set -euo pipefail
          # רק הפוליגונים התעשייתיים (עם שם ובלי שם). זול — בלי around על אלפי פוליגונים.
          Q='[out:json][timeout:400][bbox:29.4,34.2,33.35,35.95];(way["landuse"="industrial"];relation["landuse"="industrial"]["name"];);out geom;'
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== trying $ep =="
            if curl -fsS --max-time 450 --data-urlencode "data=$Q" "$ep" -o parks-polys.json; then ok=1; echo "got $(wc -c < parks-polys.json) bytes"; break; fi
            echo "failed, next endpoint"; sleep 45
          done
          [ "$ok" = "1" ] || { echo "all overpass endpoints failed"; exit 1; }

      - name: Compute park regions (קיבוץ+סינון ← תיבות-גבול לשלב-השבילים)
        run: |
          set -euo pipefail
          EMIT_REGIONS=1 PARKS_RAW=parks-polys.json REGIONS_OUT=regions.json python3 tools/parks.py
          echo "regions: $(wc -c < regions.json) bytes"

      - name: Query Overpass — footways within regions (מכסה גם ללא-שם)
        run: |
          set -euo pipefail
          REGIONS=regions.json FOOT_OUT=footways.json CHUNK=100 python3 tools/fetch_footways.py

      - name: Merge polygons + footways → parks-raw.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a = json.load(open('parks-polys.json'))
          b = json.load(open('footways.json'))
          a['elements'] = a.get('elements', []) + b.get('elements', [])
          json.dump(a, open('parks-raw.json', 'w'))
          print('merged elements:', len(a['elements']))
          PY

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -fSL --connect-timeout 20 --max-time 1800 --retry 6 --retry-all-errors --retry-delay 15 -A "$UA" \
            -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt

      - name: Fetch official industrial zones (משרד הכלכלה) — best-effort
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyproj
          OFFICIAL_OUT=official.json python3 tools/fetch_official.py

      - name: Build park accessibility data
        run: |
          set -euo pipefail
          # OFFICIAL רק אם נמשך בהצלחה — אחרת ממשיכים עם OSM בלבד
          OFF=""; [ -f official.json ] && OFF=official.json
          # OSRM foot (FOSSGIS ציבורי) לסיווג תחנות לפי מרחק-הליכה אמיתי;
          # best-effort ומוגבל-תקציב בתוך parks.py — כשל נופל חזרה לגאומטרי.
          OSRM_URL="https://routing.openstreetmap.de/routed-foot" OSRM_BUDGET=1800 \
            WALK_CACHE_IN=parks/data/walk-cache.json \
            PARKS_RAW=parks-raw.json OFFICIAL="$OFF" OUTDIR=/tmp/parksout python3 tools/parks.py
          ls /tmp/parksout | head -5
          echo "files: $(ls /tmp/parksout | wc -l)"

      - name: Commit to main
        run: |
          set -euo pipefail
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt parks-raw.json parks-polys.json footways.json regions.json official.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p parks
            rm -rf parks/data
            cp -r /tmp/parksout parks/data
            git add parks/data
            if git diff --cached --quiet; then
              echo "unchanged — nothing to commit"; break; fi
            git commit -m "data: refresh industrial-park accessibility"
            if git push origin HEAD:main; then break; fi
            echo "push rejected (main moved) — retry $i"; sleep 10
          done
