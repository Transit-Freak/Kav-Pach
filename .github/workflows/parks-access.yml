name: parks-access

# נגישות תחבורה ציבורית לאזורי תעשייה — מקורות האזורים: (א) הדאטהסט הרשמי של
# משרד הכלכלה (data.gov.il, "רשימת אזורי תעשייה"); (ב) אזורי תעשייה מ-OSM
# שאומתו כקיימים ע"י פאנל בוטים (parks/osm-check/osm-approved.json). תחנות
# ולוחות זמנים מ-GTFS (משרד התחבורה). חישוב הליכה מדויק ב-OSRM (רשת OSM).
# שבילי OSM רק למדד כיסוי-שטח. רץ שבועי.

on:
  schedule:
    - cron: '0 7 * * 0'   # ראשון 07:00 UTC (10:00 ישראל בקיץ) — מיושר לשעת הרענון היומי
  push:
    paths:
      - '.github/workflows/parks-access.yml'
      - 'tools/parks.py'
      - 'tools/fetch_footways.py'
      - 'tools/fetch_official.py'
      - 'tools/fetch_osm_approved.py'
      - 'parks/osm-check/manual-zones.json'
      - 'parks/osm-check/mot-zones.json'
      - 'parks/checks/built-status.json'
      - 'parks/checks/service-indices.json'
      - 'tools/convert_service_indices.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: parks-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # ‎+15 דק' לעיבוד shapes.txt (קובץ המסלולים הגדול)
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official industrial zones (משרד הכלכלה) — מקור האזורים
        run: |
          set -euo pipefail
          # המקור הרשמי הוא מקור-האמת היחיד לאזורים. כשל כאן מפיל את הריצה
          # (בלי המקור הרשמי אין מה לבנות במצב ממשלתי-בלבד).
          python3 -m pip install --quiet pyproj
          OFFICIAL_OUT=official.json python3 tools/fetch_official.py
          echo "official.json: $(wc -c < official.json) bytes"

      - name: Fetch approved OSM industrial polygons (מאומתי-פאנל) — גאומטריה
        run: |
          set -euo pipefail
          APPROVED=parks/osm-check/osm-approved.json OUT=osm-approved-raw.json \
            python3 tools/fetch_osm_approved.py

      - name: Compute park regions (רשמי + OSM מאומת ← תיבות-גבול לשלב-השבילים)
        run: |
          set -euo pipefail
          EMIT_REGIONS=1 OFFICIAL=official.json PARKS_RAW=osm-approved-raw.json \
            REGIONS_OUT=regions.json python3 tools/parks.py
          echo "regions: $(wc -c < regions.json) bytes"

      - name: Query Overpass — footways within regions (למדד כיסוי-שטח בלבד)
        run: |
          set -euo pipefail
          REGIONS=regions.json FOOT_OUT=footways.json CHUNK=100 python3 tools/fetch_footways.py

      - name: parks-raw.json = פוליגונים מאומתים + שבילים
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          foot = json.load(open('footways.json')).get('elements', [])
          polys = json.load(open('osm-approved-raw.json')).get('elements', [])
          json.dump({'elements': polys + foot}, open('parks-raw.json', 'w'))
          print(f'industrial polygons: {len(polys)} | footway elements: {len(foot)}')
          PY

      - name: Fetch GTFS
        run: |
          set -euo pipefail
          # שרת ה-GTFS של משרד התחבורה נופל מדי פעם לכמה דקות. לולאת ניסיונות
          # ארוכה (עד ~8–10 דק') כדי לתפוס התאוששות במקום ליפול על בליפ זמני.
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          ok=0
          for a in 1 2 3 4 5 6 7 8; do
            echo "== GTFS attempt $a =="
            if curl -fSL --connect-timeout 40 --max-time 1800 -A "$UA" \
                 -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"; then
              ok=1; break; fi
            echo "GTFS server not responding; waiting 60s"; sleep 60
          done
          [ "$ok" = "1" ] || { echo "GTFS server (gtfs.mot.gov.il) unreachable after retries"; exit 1; }
          # shapes.txt — מסלולי הקווים לתצוגה בלחיצה על קו (בקשת ההסתדרות)
          unzip -o gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt shapes.txt

      - name: Set up local OSRM (foot) — מפת ישראל, ניתוב מקומי מלא
        run: |
          set -euo pipefail
          # שרת OSRM מקומי עם פרופיל-רגל על מפת ישראל+פלסטין. ניתוב מקומי מיידי
          # (בלי הגבלת-קצב) => כל התחנות נבדקות בריצה אחת.
          mkdir -p osrm && cd osrm
          curl -fSL --connect-timeout 20 --max-time 600 --retry 15 --retry-all-errors --retry-delay 60 \
            -o map.osm.pbf "https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf"
          echo "pbf: $(du -h map.osm.pbf | cut -f1)"
          IMG=osrm/osrm-backend:latest
          docker pull "$IMG"
          # foot.lua מגיע בתוך ה-image ב-/opt/foot.lua
          docker run --rm -v "$PWD:/data" "$IMG" osrm-extract   -p /opt/foot.lua /data/map.osm.pbf
          docker run --rm -v "$PWD:/data" "$IMG" osrm-partition  /data/map.osrm
          docker run --rm -v "$PWD:/data" "$IMG" osrm-customize  /data/map.osrm
          docker run -d --name osrm -p 5000:5000 -v "$PWD:/data" "$IMG" \
            osrm-routed --algorithm mld --max-table-size 8000 /data/map.osrm
          # המתנה לזמינות
          up=0
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:5000/nearest/v1/foot/34.78,32.08" >/dev/null 2>&1; then
              up=1; echo "OSRM up after ${i}x2s"; break; fi
            sleep 2
          done
          [ "$up" = "1" ] || { echo "OSRM failed to start"; docker logs osrm || true; exit 1; }

      - name: Build park accessibility data (רשמי + OSM מאומת)
        run: |
          set -euo pipefail
          # האזורים: פוליגונים מאומתים מ-OSM + הדאטהסט הרשמי (מיזוג/השלמה).
          # GTFS לתחנות/זמנים, OSRM מקומי למרחק-הליכה מדויק, שבילי OSM לכיסוי-שטח.
          # תקציב OSRM מוגדל — פי ~5 אזורים מקודם; המטמון מצטבר בין ריצות.
          OFFICIAL=official.json \
            OSRM_URL="http://localhost:5000" OSRM_BUDGET=9000 OSRM_SLEEP=0 \
            WALK_CACHE_IN=parks/data/walk-cache.json \
            PARKS_RAW=parks-raw.json OUTDIR=/tmp/parksout python3 tools/parks.py
          ls /tmp/parksout | head -5
          echo "files: $(ls /tmp/parksout | wc -l)"

      - name: שער בדיקות-הקבע — נתונים שבורים לא מתפרסמים (אישור איריס 01.09)
        run: DATA_DIR=/tmp/parksout OUT=/tmp/parksout/invariants.json python3 tools/parks_invariants.py

      - name: Commit results (לענף שהריץ — main בריצה השבועית)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME:-main}"
          rm -f gtfs.zip stops.txt stop_times.txt trips.txt routes.txt calendar.txt shapes.txt parks-raw.json footways.json regions.json official.json osm-approved-raw.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "$BR" && git reset --hard "origin/$BR"
            mkdir -p parks
            # קובצי האשכולות נבנים בריצה נפרדת (socio-fetch) — בלי השימור
            # הזה ה-rm -rf מוחק אותם בכל רענון ושכבת האשכולות באתר מתה
            for f in socio.json socio-sa.json socio-sa-polys.json; do
              [ -f "parks/data/$f" ] && cp "parks/data/$f" "/tmp/keep-$f" || true
            done
            rm -rf parks/data
            cp -r /tmp/parksout parks/data
            for f in socio.json socio-sa.json socio-sa-polys.json; do
              [ -f "/tmp/keep-$f" ] && cp "/tmp/keep-$f" "parks/data/$f" || true
            done
            git add parks/data
            if git diff --cached --quiet; then
              echo "unchanged — nothing to commit"; break; fi
            git commit -m "data: refresh industrial-park accessibility (רשמי + OSM מאומת)"
            if git push origin HEAD:"$BR"; then break; fi
            echo "push rejected ($BR moved) — retry $i"; sleep 10
          done
