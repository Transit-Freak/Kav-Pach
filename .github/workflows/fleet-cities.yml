name: fleet-cities

# בנייה מחדש של שכבת הערים בלבד (בלי סריקה) — לרענון מיידי אחרי תיקון

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: שיוך ערים
        run: python3 tools/fleet_cities.py

      - name: הערכת קילומטראז' (best-effort)
        continue-on-error: true
        run: python3 tools/fleet_km.py

      - name: מיגון ירי/אבנים (best-effort)
        continue-on-error: true
        run: python3 tools/fleet_armor.py

      - name: commit
        run: |
          git config user.name 'fleet-bot'
          git config user.email 'noreply@github.com'
          git add fleet/data
          git diff --cached --quiet && { echo 'אין שינוי'; exit 0; }
          git commit -m 'data: fleet-cities — רענון שכבת הערים'
          git pull --rebase origin main
          git push
