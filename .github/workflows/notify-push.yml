name: notify-push

# הקו בזמן — שליחת התראות הדפדפן היומית (OneSignal), אחרי הסריקה של 07:30.
# בלי המפתחות (Secrets) הריצה יוצאת בשקט — הפיצ'ר כבוי עד שיוזנו.

on:
  schedule:
    - cron: '15 9 * * *'   # ~12:15 ישראל בקיץ — אחרי שהסריקה היומית מסיימת
  workflow_dispatch:
    inputs:
      date:
        description: 'תאריך השינויים (ברירת מחדל: היום)'
        required: false
        default: ''
      dry:
        description: 'הרצה יבשה (1 = רק להדפיס)'
        required: false
        default: '0'
      debug:
        description: 'אבחון: הצגת הנרשמים והתגים (1 = כן)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: notify-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Send daily notifications
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ '${{ github.event.inputs.debug }}' = '1' ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          app=os.environ['ONESIGNAL_APP_ID']; key=os.environ['ONESIGNAL_API_KEY']
          req=urllib.request.Request(f'https://api.onesignal.com/players?app_id={app}&limit=10',
              headers={'Authorization': f'Key {key}'})
          try:
              d=json.load(urllib.request.urlopen(req, timeout=30))
              print('total subscriptions:', d.get('total_count'))
              for p in d.get('players', [])[:10]:
                  print(' device:', p.get('device_os'), '| last_active:', p.get('last_active'),
                        '| tags:', p.get('tags'), '| invalid:', p.get('invalid_identifier'))
          except Exception as e:
              print('players API error:', e)
          PY
            exit 0
          fi
          DATE='${{ github.event.inputs.date || '' }}' \
          DRY='${{ github.event.inputs.dry || '0' }}' \
          python3 tools/send_push.py
