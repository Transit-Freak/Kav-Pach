name: probe-permkt

# בדיקה: האם gtfs_routes/list עם טווח תאריכים מחזיר שורה-ליום לכל וריאנט
# של מק"ט — הבסיס לרעיון של המשתמש (סריקה לפי מק"ט במקום לפי יום בשבוע).

on:
  push:
    paths:
      - '.github/workflows/probe-permkt.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Per-mkt range query
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from collections import Counter

          API = 'https://open-bus-stride-api.hasadna.org.il'
          def api(path, **params):
              url = f'{API}{path}?{urllib.parse.urlencode(params)}'
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan probe (polite)'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          # חודש אחד של מק"ט 94001 — כמה שורות, ומה גרעיניות התאריכים?
          rows = api('/gtfs_routes/list', route_mkt='94001',
                     date_from='2024-10-01', date_to='2024-10-31', limit=1000)
          print('שורות באוקטובר 2024 למק"ט 94001:', len(rows) if isinstance(rows, list) else rows)
          if isinstance(rows, list) and rows:
              per_rd = Counter()
              dates_1a = []
              for r in rows:
                  rd = f"{r.get('route_mkt')}-{r.get('route_direction')}-{r.get('route_alternative')}"
                  per_rd[rd] += 1
                  if r.get('route_alternative') == '1' and r.get('route_direction') == '1':
                      dates_1a.append(r.get('date'))
              print('שורות לכל וריאנט:', dict(per_rd))
              print('תאריכי 1א כיוון 1 (ממוין):', sorted(d for d in dates_1a if d)[:35])

          # דפדוף מעבר ל-1000: כל התקופה למק"ט אחד
          total = 0; offset = 0; pages = 0
          first = last = None
          while True:
              rows = api('/gtfs_routes/list', route_mkt='94001',
                         date_from='2022-01-01', date_to='2026-07-20',
                         limit=1000, offset=offset)
              if not isinstance(rows, list) or not rows: break
              pages += 1; total += len(rows)
              ds = sorted(r.get('date') or '' for r in rows)
              first = min(filter(None, [first, ds[0]])) if first else ds[0]
              last = max(last or '', ds[-1])
              if len(rows) < 1000: break
              offset += 1000
              if pages > 15: print('עצירה'); break
          print(f'כל התקופה: {total} שורות ב-{pages} עמודים | {first} עד {last}')
          PY
