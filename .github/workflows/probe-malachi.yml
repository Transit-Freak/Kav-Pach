name: probe-malachi

# סבב 2: שחזור מדויק של הסריקה (routes_on) על 2024-10-14 — למה 94001-1-1
# (חלופת 1א קרית מלאכי) לא נקלטה: route_type? כיוון/חלופה ריקים? דפדוף?

on:
  push:
    paths:
      - '.github/workflows/probe-malachi.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Replay routes_on
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse

          API = 'https://open-bus-stride-api.hasadna.org.il'
          def api(path, **params):
              url = f'{API}{path}?{urllib.parse.urlencode(params)}'
              req = urllib.request.Request(url, headers={'User-Agent': 'kav-bochan probe (polite)'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          d = '2024-10-14'
          offset = 0
          total = 0
          skipped_type = 0
          seen_type = {}
          found = []
          pages = 0
          while True:
              rows = api('/gtfs_routes/list', date_from=d, date_to=d, limit=1000, offset=offset)
              if not isinstance(rows, list) or not rows: break
              pages += 1
              total += len(rows)
              for r in rows:
                  t = str(r.get('route_type'))
                  seen_type[t] = seen_type.get(t, 0) + 1
                  if str(r.get('route_mkt') or '').lstrip('0') == '94001':
                      found.append({k: r.get(k) for k in
                                    ('route_mkt', 'route_direction', 'route_alternative',
                                     'route_type', 'route_short_name', 'agency_name', 'id', 'date')})
              if len(rows) < 1000: break
              offset += 1000
              if pages > 20: print('עצירה — יותר מדי עמודים'); break

          print(f'{d}: סה"כ שורות {total} בעמודים {pages}')
          print('התפלגות route_type:', seen_type)
          print('שורות 94001 שנתקלנו בהן בסריקה:')
          for f in found: print(' ', json.dumps(f, ensure_ascii=False))
          PY
