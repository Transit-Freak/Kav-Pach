# מעקב תגבורים יומי — יציאות מרובות-רכבים מ-Gtfs_10_days.zip (פרסום
# הרישוי היומי של משרד התחבורה). רץ כל בוקר אחרי הרענון היומי של הקו
# בזמן (07:30) וקו באג (08:00); כל שינוי במפת התגבורים נרשם כאירוע.
name: vcnt-scan
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
  push:
    branches: [vcnt-go]
permissions:
  contents: write
concurrency:
  group: vcnt-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: סריקה ותיעוד שינויים
        run: |
          set -e
          git config user.name vcnt-bot
          git config user.email actions@users.noreply.github.com
          python3 tools/scan_vcnt_daily.py
          git add line-history/data
          git diff --cached --quiet || git commit -m "מעקב תגבורים יומי (Gtfs_10_days) $(date -u +%F)"
          git fetch origin main && git rebase origin/main || true
          git push origin HEAD:main || true
