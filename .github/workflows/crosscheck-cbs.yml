name: crosscheck-cbs

# הצלבת אזורי התעשייה מול האזורים הסטטיסטיים של הלמ"ס (סעיף 0).
# רץ רק כשמשנים את הסקריפט/הוורקפלואו — לא ריצה קבועה.

on:
  push:
    paths:
      - '.github/workflows/crosscheck-cbs.yml'
      - 'tools/crosscheck_cbs.py'

permissions:
  contents: write

concurrency:
  # קבוצה נפרדת לכל ref: ריצת ה-push של סנכרון הענף (שמדלגת בגלל תנאי
  # main-בלבד) נכנסת לקבוצה לפני שהתנאי נבדק — בלי זה היא מבטלת את ריצת main
  group: crosscheck-cbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check zones vs CBS statistical areas
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyshp pyproj fiona
          python3 tools/crosscheck_cbs.py
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parks/data/cbs-crosscheck.json
          git diff --cached --quiet && { echo 'אין שינוי'; exit 0; }
          git commit -m 'data: הצלבת אזורי תעשייה מול אזורים סטטיסטיים של הלמ"ס'
          for i in 1 2 3; do
            git push && break
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; git reset --hard "origin/${GITHUB_REF_NAME}"; exit 1; }
            sleep 5
          done
