name: probe-gtfs-files

# בדיקה חד-פעמית: מוריד את חבילת ה-GTFS של משרד התחבורה, רושם את כל הקבצים בה,
# ובודק אם קיים קובץ translations.txt (תרגומים/אנגלית). read-only — לא דוחף כלום.

on:
  push:
    paths:
      - '.github/workflows/probe-gtfs-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download GTFS + list files + check translations/English
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          ok=0
          for a in 1 2 3 4 5 6; do
            echo "== download attempt $a =="
            if curl -fSL --connect-timeout 40 --max-time 1200 -A "$UA" \
                 -o gtfs.zip "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip"; then
              ok=1; break; fi
            echo "retry in 60s"; sleep 60
          done
          [ "$ok" = "1" ] || { echo "GTFS server unreachable"; exit 1; }
          echo "================ ALL FILES IN GTFS ZIP ================"
          unzip -l gtfs.zip
          echo "================ translations.txt present? ================"
          if unzip -l gtfs.zip | grep -qi 'translations'; then
            echo "RESULT: YES — a translations file exists:"
            unzip -p gtfs.zip translations.txt 2>/dev/null | head -8 || true
          else
            echo "RESULT: NO — no translations file in the GTFS package"
          fi
          echo "================ any English name columns in stops.txt? ================"
          unzip -p gtfs.zip stops.txt | head -1
