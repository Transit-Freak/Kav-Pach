<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טעויות תרגום — התחנה הבאה</title>
<meta name="description" content="שמות תחנות אוטובוס שהתרגום הרשמי שלהם לאנגלית (GTFS משרד התחבורה) שגוי.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%234f46e5'/%3E%3Ctext x='17' y='24' font-size='20' text-anchor='middle' fill='white'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Assistant','Heebo',system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
  .top{background:#4f46e5;color:#fff;padding:14px 18px}
  .top h1{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .top .cnt{background:#c7d2fe;color:#312e81;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:900}
  .top a{color:#c7d2fe;font-weight:800;text-decoration:none;font-size:13px;margin-right:auto}
  .top .sub{font-size:12px;opacity:.85;font-weight:600;margin-top:6px;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:14px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:2px solid #e2e8f0;background:#fff;border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px;cursor:pointer;color:#475569;font-family:inherit}
  .chip.on{background:#4f46e5;border-color:#4f46e5;color:#fff}
  .chip b{opacity:.7;font-weight:900;margin-inline-start:4px}
  #q{width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;margin-bottom:12px}
  .card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-inline-start:4px solid var(--c)}
  .row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .he{font-weight:900;font-size:16px}
  .arrow{color:#94a3b8}
  .en{font-weight:700;color:#334155;direction:ltr;unicode-bidi:isolate}
  .tag{font-size:11px;font-weight:900;border-radius:6px;padding:2px 8px;color:#fff;background:var(--c);white-space:nowrap}
  .issue{font-size:13.5px;color:#475569;font-weight:600;margin-top:5px}
  .cities{font-size:12px;color:#94a3b8;font-weight:700;margin-top:3px}
  .empty{text-align:center;color:#94a3b8;font-weight:800;padding:40px}
  .foot{text-align:center;color:#94a3b8;font-size:12px;font-weight:700;padding:16px}
</style>
</head>
<body>
  <div class="top">
    <h1>🌐 טעויות תרגום לאנגלית <span class="cnt" id="tcnt">…</span>
      <a href="./">→ התחנה הבאה</a></h1>
    <div class="sub">שמות תחנה שהתרגום הרשמי שלהם לאנגלית (מ-GTFS של משרד התחבורה) שגוי. <b>רשימה נפרדת — לא נספרת בטעויות השם↔כתובת של הכלי הראשי.</b> נוצר אוטומטית · מתעדכן שבועית.</div>
  </div>
  <div class="wrap">
    <div class="filters" id="filters"></div>
    <input id="q" type="search" placeholder="חיפוש שם תחנה / עיר…">
    <div id="list"></div>
    <div class="foot" id="foot"></div>
  </div>
<script>
const CAT={
  wrong:  {label:'תרגום שגוי',   c:'#dc2626'},
  missing:{label:'חלק חסר',      c:'#ea580c'},
  literal:{label:'תרגום מילולי', c:'#7c3aed'},
  format: {label:'פורמט / כתיב',  c:'#0891b2'},
};
let DATA=[], curCat='all', q='';
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

fetch('translation-errors.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d.errors||[];
  el('tcnt').textContent=DATA.length.toLocaleString('he');
  const counts={all:DATA.length};
  for(const e of DATA) counts[e.category]=(counts[e.category]||0)+1;
  const order=['all','wrong','missing','literal','format'];
  el('filters').innerHTML=order.map(k=>{
    const lbl=k==='all'?'הכל':CAT[k].label, n=counts[k]||0;
    return `<button class="chip${k==='all'?' on':''}" data-k="${k}">${lbl}<b>${n}</b></button>`;
  }).join('');
  el('filters').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
    curCat=b.dataset.k;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render();};
  render();
}).catch(()=>{el('list').innerHTML='<div class="empty">שגיאה בטעינת הנתונים</div>';});

el('q').oninput=e=>{q=e.target.value.trim();render();};

function render(){
  let rows=DATA;
  if(curCat!=='all') rows=rows.filter(e=>e.category===curCat);
  if(q) rows=rows.filter(e=>(e.he+' '+e.en+' '+(e.cities||[]).join(' ')).includes(q));
  el('foot').textContent=`מציג ${rows.length.toLocaleString('he')} מתוך ${DATA.length.toLocaleString('he')} טעויות`;
  if(!rows.length){el('list').innerHTML='<div class="empty">אין תוצאות</div>';return;}
  el('list').innerHTML=rows.slice(0,600).map(e=>{
    const cat=CAT[e.category]||{label:e.category,c:'#64748b'};
    const cities=(e.cities||[]).join(' · ');
    return `<div class="card" style="--c:${cat.c}">
      <div class="row1"><span class="he">${esc(e.he)}</span><span class="arrow">→</span>
        <span class="en">${esc(e.en)}</span><span class="tag">${cat.label}</span></div>
      <div class="issue">${esc(e.issue)}</div>
      ${cities?`<div class="cities">${esc(cities)}</div>`:''}</div>`;
  }).join('') + (rows.length>600?'<div class="foot">…מוצגות 600 הראשונות. צמצם עם חיפוש/סינון.</div>':'');
}
</script>
</body>
</html>
