<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הקו המדלג — קווים שחולפים ליד תחנה בלי לעצור</title>
  <meta name="description" content="הקו המדלג — איתור קווי אוטובוס עירוניים שעוברים ממש ליד תחנה פעילה, עוצרים לפניה ואחריה — אבל מדלגים עליה." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- בטלפון: אצבע אחת גוללת את הדף, שתי אצבעות מזיזות את המפה (כמו ב"התחנה הבאה") -->
  <link rel="stylesheet" href="vendor/leaflet-gesture-handling.min.css" />
  <script>window.SK_BUILD = "20";</script>
  <!-- document.write חסם את הפרסר; קישור רגיל + חותמת גרסה סטטית -->
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div id="root"><div class="boot">טוען נתונים…</div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="vendor/leaflet-gesture-handling.min.js"></script>
  <!-- React ייצור, מוגש מאותו דומיין: גרסת הפיתוח מ-CDN הייתה איטית
       משמעותית (בדיקות ואזהרות בכל רינדור) והוסיפה תלות בשרת חיצוני -->
  <script src="vendor/react.production.min.js?v=18.3.1"></script>
  <script src="vendor/react-dom.production.min.js?v=18.3.1"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    (function () {
      // קומפילציית ה-JSX נשמרת ב-localStorage לפי גרסה: בביקור חוזר אין
      // קומפילציה בכלל והדף עולה מיד (אותו דפוס כמו בקו פח)
      var build = window.SK_BUILD;
      var CK = "sk-compiled-v" + build;
      function run(js) {
        var s = document.createElement("script");
        s.textContent = js;
        document.body.appendChild(s);
      }
      try {
        var cached = localStorage.getItem(CK);
        if (cached) { run(cached); return; }
      } catch (e) { /* מצב פרטי */ }
      fetch("app.jsx?v=" + build)
        .then(function (r) { return r.text(); })
        .then(function (code) {
          var out = Babel.transform(code, { presets: ["react"], filename: "app.jsx" }).code;
          try {
            Object.keys(localStorage).forEach(function (k) { if (k.indexOf("sk-compiled-") === 0 && k !== CK) localStorage.removeItem(k); });
            localStorage.setItem(CK, out);
          } catch (e) { /* אין מקום — פשוט בלי מטמון */ }
          run(out);
        })
        .catch(function (e) {
          document.getElementById("root").innerHTML =
            '<div class="boot">שגיאת טעינה. נסו לרענן.</div>';
          console.error("load error", e);
        });
    })();
  </script>
</body>
</html>
